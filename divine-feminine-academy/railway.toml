# Railway.
#
# Railway has no built-in scheduler. The hourly job is driven from GitHub
# Actions instead - .github/workflows/divine-feminine-cron.yml - because a
# Railway cron service was tried here first and silently did nothing: the
# container started on schedule, produced no output, and never made the
# request. See DEPLOY.md section 8. On Vercel the schedule lives in
# vercel.json and nothing else is needed.

[build]
builder = "NIXPACKS"
# Nixpacks installs dependencies in its own step before this one. Repeating
# `npm ci` here fails the build outright: Railway mounts node_modules/.cache as
# a build cache, and npm ci tries to remove node_modules wholesale, which gives
# EBUSY on the live mount.
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start"
# Migrate, seed, THEN check the configuration - and fail the deploy if the
# configuration is wrong.
#
# preflight was written to catch exactly this and was never run against the
# real environment, so PAYMENTS_PROVIDER sat at "fake" in production. The app
# booted, the health check passed, every page rendered, and the single broken
# thing was the purchase - discovered by someone trying to buy.
#
# A failing preflight fails this deploy and leaves the PREVIOUS one serving,
# which is the right way round: a misconfiguration should cost a deploy, not a
# customer.
preDeployCommand = "npm run db:migrate && npm run bootstrap && npm run preflight"
# Restart on crash, but give up rather than loop forever on a broken deploy.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/api/health"
healthcheckTimeout = 30
