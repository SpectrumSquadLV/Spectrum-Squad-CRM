# Railway.
#
# Railway has no built-in scheduler. The hourly job is driven from GitHub
# Actions instead - .github/workflows/divine-feminine-cron.yml - because a
# Railway cron service was tried here first and silently did nothing: the
# container started on schedule, produced no output, and never made the
# request. See DEPLOY.md section 8. On Vercel the schedule lives in
# vercel.json and nothing else is needed.

[build]
builder = "NIXPACKS"
# Nixpacks installs dependencies in its own step before this one. Repeating
# `npm ci` here fails the build outright: Railway mounts node_modules/.cache as
# a build cache, and npm ci tries to remove node_modules wholesale, which gives
# EBUSY on the live mount.
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start"
# Restart on crash, but give up rather than loop forever on a broken deploy.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/api/health"
healthcheckTimeout = 30
