# Railway.
#
# Railway has no built-in scheduler, so the hourly job needs either a second
# service running a cron, or an external scheduler hitting the endpoint. Both
# are described in DEPLOY.md. On Vercel the schedule lives in vercel.json and
# nothing else is needed.

[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build"

[deploy]
startCommand = "npm run start"
# Restart on crash, but give up rather than loop forever on a broken deploy.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/api/health"
healthcheckTimeout = 30
