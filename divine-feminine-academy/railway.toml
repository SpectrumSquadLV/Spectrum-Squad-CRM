# Railway.
#
# Railway has no built-in scheduler, so the hourly job needs either a second
# service running a cron, or an external scheduler hitting the endpoint. Both
# are described in DEPLOY.md. On Vercel the schedule lives in vercel.json and
# nothing else is needed.

[build]
builder = "NIXPACKS"
# Nixpacks installs dependencies in its own step before this one. Repeating
# `npm ci` here fails the build outright: Railway mounts node_modules/.cache as
# a build cache, and npm ci tries to remove node_modules wholesale, which gives
# EBUSY on the live mount.
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start"
# Restart on crash, but give up rather than loop forever on a broken deploy.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/api/health"
healthcheckTimeout = 30
