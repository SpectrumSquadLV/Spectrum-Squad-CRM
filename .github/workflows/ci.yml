name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same PR makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Without this the job races the database and fails on connect.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches the Dockerfile

      # package-lock.json is deliberately not committed (see .gitignore), so
      # there is no npm ci to run here.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Thirteen suites drive the app in a real browser. CHROMIUM_PATH is left
      # unset so Playwright uses the build it just downloaded.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: node run-tests.js

      # The per-suite logs say which assertion went red and what the server was
      # doing at the time -- worth having when a UI suite fails only in CI.
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test-logs/
          retention-days: 14
