name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same PR makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Without this the job races the database and fails on connect.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches the Dockerfile

      # package-lock.json is deliberately not committed (see .gitignore), so
      # there is no npm ci to run here.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Thirteen suites drive the app in a real browser. CHROMIUM_PATH is left
      # unset so Playwright uses the build it downloads here.
      #
      # Deliberately NOT --with-deps: that shells out to apt-get, and the first
      # run of this workflow sat on it for 20 minutes -- an apt/dpkg lock on the
      # hosted runner, which is a known way for that flag to hang. The
      # ubuntu-latest image already ships the system libraries Chromium needs,
      # so the flag bought nothing and cost the entire job.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the exact pinned version, so a version bump misses the
          # cache and downloads the browser that version expects.
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5 # fail fast rather than eat the job's budget
        run: npx playwright install chromium

      - name: Run tests
        timeout-minutes: 25
        run: node run-tests.js

      # The per-suite logs say which assertion went red and what the server was
      # doing at the time -- worth having when a UI suite fails only in CI.
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test-logs/
          retention-days: 14

  # The Divine Feminine app is a separate Next.js application in this
  # repository with its own dependencies, database and checks. Nothing above
  # touches it: the job over there runs `test-*.js` at the repository root, so
  # a green tick on this workflow used to say nothing whatsoever about this
  # application.
  #
  # That is not theoretical. Three deployments in a row failed on things a run
  # of these scripts would have caught first - a migration that could not
  # install on a database without Supabase's auth.uid(), and a TypeScript error
  # in a script - and each one was found by reading deploy logs afterwards.
  divine-feminine:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: divine-feminine-academy

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: divine_feminine
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5433/divine_feminine
      # A throwaway key for this run only. Nothing here outlives the job, and a
      # real one would be a secret in a repository that does not need it.
      JOURNAL_MASTER_KEY: dGVzdGtleXRlc3RrZXl0ZXN0a2V5dGVzdGtleXRlc3Q=
      PAYMENTS_PROVIDER: fake
      CRON_SECRET: ci-only
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: divine-feminine-academy/package-lock.json

      # This application commits its lockfile (see its .gitignore), so installs
      # here are reproducible and `npm ci` is the right command.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Against a bare postgres with no Supabase in sight, which is the whole
      # point: that is what production turned out to be, and the migrations
      # had never once been run against it.
      - name: Apply migrations
        run: npm run db:migrate

      - name: Seed
        run: npm run bootstrap

      # Before the checks, because verify:noindex serves the built output - and
      # because a build failure is the single most common way this breaks.
      - name: Build
        run: npm run build

      # verify:a11y, verify:journeys and verify:photo-type are deliberately
      # NOT in this list. Each one drives a real browser against a running
      # server, and this job installs neither - adding them would fail on
      # ERR_CONNECTION_REFUSED rather than on anything true about the code.
      - name: Run the checks
        run: |
          failed=()
          for check in \
            crypto pacing engine scoring certificates issuance permissions \
            pricing webhooks fulfilment crm-privacy automation reminders \
            rate-limit contrast db-url archetypes quiz sequences writing \
            cohorts audience curriculum me-vs-her scenes migrations origin \
            preflight images noindex podcast public
          do
            echo "::group::verify:$check"
            if npm run --silent "verify:$check"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::verify:$check failed"
              failed+=("$check")
            fi
          done

          if [ ${#failed[@]} -gt 0 ]; then
            echo "failed: ${failed[*]}"
            exit 1
          fi
          echo "all checks passed"
