<script>
"use strict";

// ---------------- Connector tool names (verified this session) ----------------
const READ_TOOL = "mcp__a23730f6-a51d-4315-a819-3d5cdbf08492__read_file_content";
const MAIL_TOOL = "mcp__d172c7c1-83c7-4e74-8238-d1269c2ceac9__outlook_send_mail";
const SHEET_FILE_ID = "1GT-1ndShU8oKHTkp7agY9FFBKjJHPiV-cwkF3Io-15Q";

// ---------------- Pipeline definition ----------------
const STAGES = [
  { key: "new_submission", label: "New Submission", color: "#6b7280" },
  { key: "clinical_screener", label: "Clinical Screener", color: "#8b5cf6" },
  { key: "insurance_verification", label: "Insurance Verification", color: "#3b82f6" },
  { key: "intake_packet", label: "Intake Packet", color: "#0ea5e9" },
  { key: "assessment_scheduling", label: "Assessment (Vineland/Intake)", color: "#14b8a6" },
  { key: "authorization", label: "Authorization Pending", color: "#f59e0b" },
  { key: "first_day_scheduled", label: "First Day Scheduling", color: "#ec4899" },
  { key: "active", label: "Active Therapy", color: "#22c55e" },
  { key: "discharged", label: "Discharged", color: "#64748b" },
  { key: "not_moving_forward", label: "Not Moving Forward", color: "#ef4444" },
];
const STAGE_ORDER = STAGES.map((s) => s.key);
const STAGE_TASKS = [
  { stage_key: "new_submission", label: "Welcome call / initial contact", dept: "intake", sla: 1 },
  { stage_key: "clinical_screener", label: "Complete Clinical Screener", dept: "clinical", sla: 2 },
  { stage_key: "insurance_verification", label: "Verify Insurance Benefits", dept: "billing", sla: 3 },
  { stage_key: "intake_packet", label: "Send Intake Packet", dept: "intake", sla: 1 },
  { stage_key: "assessment_scheduling", label: "Schedule Vineland / Intake Assessment", dept: "clinical", sla: 5 },
  { stage_key: "authorization", label: "Submit Authorization Request", dept: "billing", sla: 3 },
  { stage_key: "first_day_scheduled", label: "Schedule First Day of ABA", dept: "scheduling", sla: 5 },
];
const PARENT_MILESTONES = {
  new_submission: { subject: "We received your enrollment form — Spectrum Squad",
    html: (c) => `<p>Hi ${c.parent_name},</p><p>Thanks for submitting your enrollment form for ${c.child_name}. Our intake team will reach out within 24-48 hours.</p>` },
  intake_packet: { subject: "Your intake packet is on its way — Spectrum Squad",
    html: (c) => `<p>Hi ${c.parent_name},</p><p>We're sending over ${c.child_name}'s intake packet. Please complete and return it so we can keep things moving.</p>` },
  authorization: { subject: "We're requesting your authorization for services — Spectrum Squad",
    html: (c) => `<p>Hi ${c.parent_name},</p><p>We're now submitting the authorization request for ${c.child_name}'s ABA services to your insurance.</p>` },
  first_day_scheduled: { subject: "Let's get a first day scheduled! — Spectrum Squad",
    html: (c) => `<p>Hi ${c.parent_name},</p><p>${c.child_name}'s authorization is in and we're ready to schedule a first day of ABA therapy. Our scheduling team will be in touch shortly.</p>` },
  active: { subject: (c) => `Welcome to Spectrum Squad, ${c.child_name}!`,
    html: (c) => `<p>Hi ${c.parent_name},</p><p>We're so excited — ${c.child_name} is officially starting ABA therapy with us!</p>` },
};

function nextStageKey(current) {
  const idx = STAGE_ORDER.indexOf(current);
  if (idx === -1 || idx >= STAGE_ORDER.length - 1) return null;
  const next = STAGE_ORDER[idx + 1];
  if (next === "discharged" || next === "not_moving_forward") return null;
  return next;
}
function stageInfo(key) { return STAGES.find((s) => s.key === key) || {}; }

// ---------------- State (persisted to this browser's localStorage) ----------------
const STORAGE_KEY = "ssq_crm_data_v1";
function defaultState() {
  return {
    nextId: 1,
    clients: [],
    departments: {
      intake: { name: "Intake / Admin", color: "#0ea5e9", email: "intake@spectrumsquadlv.com" },
      clinical: { name: "Clinical (BCBA)", color: "#8b5cf6", email: "clinical@spectrumsquadlv.com" },
      billing: { name: "Billing / Insurance", color: "#f59e0b", email: "billing@spectrumsquadlv.com" },
      scheduling: { name: "Scheduling", color: "#ec4899", email: "scheduling@spectrumsquadlv.com" },
    },
    therapists: [
      { id: 1, name: "Allie R.", role: "BCBA", color: "#8b5cf6" },
      { id: 2, name: "Katelyn S.", role: "RBT", color: "#0ea5e9" },
      { id: 3, name: "April M.", role: "RBT", color: "#14b8a6" },
    ],
    scheduleSessions: [],
    notifications: [],
    importedKeys: [],
    scheduleTargets: { "Full-Time": 30, "Part Time AM": 15, "Part Time PM": 15 },
    settings: { liveEmail: false, lastSync: null },
  };
}
let state = load();
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  } catch (e) { return defaultState(); }
}
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function uid() { return state.nextId++; }

const PALETTE = ["#f472b6", "#60a5fa", "#34d399", "#fbbf24", "#a78bfa", "#fb7185"];
function pickColor() { return PALETTE[Math.floor(Math.random() * PALETTE.length)]; }

function addBusinessDays(date, days) {
  const result = new Date(date);
  let added = 0;
  while (added < days) {
    result.setDate(result.getDate() + 1);
    const day = result.getDay();
    if (day !== 0 && day !== 6) added++;
  }
  return result;
}
function fmtDate(d) {
  if (!d) return "—";
  const date = new Date(d);
  if (isNaN(date)) return d;
  return date.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}
function dayName(n) { return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][n] || n; }

// ---------------- Email sending ----------------
async function sendEmail({ to, subject, html, clientId, type }) {
  let delivered = "simulated";
  if (state.settings.liveEmail && to) {
    try {
      const result = await window.cowork.callMcpTool(MAIL_TOOL, { to: [to], subject, body: html, bodyType: "html" });
      delivered = result.isError ? "failed" : "sent";
    } catch (e) {
      delivered = "failed";
    }
  }
  state.notifications.unshift({
    id: uid(), client_id: clientId, type, recipient: to, subject, body: html,
    sent_at: new Date().toISOString(), delivered,
  });
  save();
  return delivered;
}

// ---------------- Pipeline engine ----------------
async function enterStage(client, stageKey, opts = {}) {
  client.stage = stageKey;
  client.updated_at = new Date().toISOString();
  const tasksForStage = STAGE_TASKS.filter((t) => t.stage_key === stageKey);
  for (const t of tasksForStage) {
    const due = addBusinessDays(new Date(), t.sla).toISOString();
    client.tasks.push({ id: uid(), stage_key: stageKey, label: t.label, dept: t.dept, status: "pending", due_date: due, completed_at: null, overdue_notified: false });
    if (!opts.silent) {
      const dept = state.departments[t.dept];
      await sendEmail({
        to: dept.email,
        subject: `[${dept.name}] Action needed: ${client.child_name} — ${t.label}`,
        html: `<p><strong>${client.child_name}</strong> (parent: ${client.parent_name}) has entered stage <strong>${stageInfo(stageKey).label}</strong> and needs: <strong>${t.label}</strong>.</p><p>Due by: ${fmtDate(due)}</p>`,
        clientId: client.id, type: "department_alert",
      });
    }
  }
  if (!opts.silent) {
    const milestone = PARENT_MILESTONES[stageKey];
    if (milestone && client.parent_email) {
      const subject = typeof milestone.subject === "function" ? milestone.subject(client) : milestone.subject;
      await sendEmail({ to: client.parent_email, subject, html: milestone.html(client), clientId: client.id, type: "parent_milestone" });
    }
  }
  save();
}

async function completeTask(clientId, taskId) {
  const client = state.clients.find((c) => c.id === clientId);
  const task = client.tasks.find((t) => t.id === taskId);
  task.status = "completed";
  task.completed_at = new Date().toISOString();
  const remaining = client.tasks.filter((t) => t.stage_key === client.stage && t.status !== "completed");
  if (remaining.length === 0) {
    const next = nextStageKey(client.stage);
    if (next) await enterStage(client, next);
  }
  save();
}

async function checkOverdueAll() {
  const now = new Date();
  let flagged = 0;
  for (const client of state.clients) {
    for (const task of client.tasks) {
      if (task.status === "pending" && new Date(task.due_date) < now) {
        task.status = "overdue";
        task.overdue_notified = true;
        const dept = state.departments[task.dept];
        await sendEmail({
          to: dept.email,
          subject: `⚠ OVERDUE: ${task.label} — ${client.child_name}`,
          html: `<p><strong>${task.label}</strong> for <strong>${client.child_name}</strong> (parent: ${client.parent_name}) was due ${fmtDate(task.due_date)} and has not been completed.</p>`,
          clientId: client.id, type: "overdue_alert",
        });
        flagged++;
      }
    }
  }
  save();
  return flagged;
}

// ---------------- Google Sheet import ----------------
function splitRow(line) {
  let inner = line.replace(/^\|/, "").replace(/\|$/, "");
  return inner.split("|").map((c) => c.trim());
}
function unescapeMd(s) {
  return (s || "").replace(/\\_/g, "_").replace(/\\#/g, "#").replace(/\\\*/g, "*").trim();
}
function parseMarkdownTable(md) {
  const lines = md.split("\n").map((l) => l.trim()).filter((l) => l.startsWith("|"));
  if (lines.length < 2) return [];
  // The Drive export sometimes prepends a blank formatting row before the
  // real header row (Google Sheets artifact), so don't assume position --
  // find the row that actually contains "Timestamp", a stable column name
  // on this form, and treat that as the header row.
  let headerIdx = lines.findIndex((l) => splitRow(l).some((c) => c === "Timestamp"));
  if (headerIdx === -1) headerIdx = 0;
  const headers = splitRow(lines[headerIdx]);
  const isSeparatorRow = (l) => /^\|?(\s*:?-+:?\s*\|)+\s*$/.test(l);
  const dataLines = lines.slice(headerIdx + 1).filter((l) => !isSeparatorRow(l));
  return dataLines.map((line) => {
    const cells = splitRow(line);
    const obj = {};
    headers.forEach((h, i) => { obj[h] = unescapeMd(cells[i] || ""); });
    return obj;
  });
}

function buildClientFromRow(row) {
  return {
    id: uid(),
    child_name: (row["First and Last Name of Child"] || "").trim(),
    dob: row["Date of Birth of Child"] || "",
    parent_name: row["Your First and Last Name"] || "",
    parent_relationship: row["What is your relationship to patient? (Are you the legal guardian?)"] || "",
    parent_email: (row["Email Address"] || "").trim(),
    parent_phone: row["Phone Number"] || "",
    address: row["Address"] || "",
    service_location: row["Are you seeking in-home or in-school services?"] || "",
    school_status: row["Is the child currently enrolled in:"] || "",
    start_urgency: row["How soon are you looking to start services?"] || "",
    insurance_provider: row["What insurance do you have?"] || "",
    has_asd_diagnosis: row["Does your child have an official Autism Spectrum Disorder Diagnosis"] || "",
    has_iep: row["Does the child have an IEP?"] || "",
    prior_aba_nv: row["Has the child/individual received ABA services in the State of Nevada?"] || "",
    preferred_contact: row["Preferred Method of Contact"] || "",
    desired_schedule: row["What is your desired schedule?"] || "",
    rethink_status: row["Rethink Status"] || "",
    stage: "new_submission",
    color: pickColor(),
    notes: row["Note"] || "",
    first_day_date: null,
    discharge_reason: "",
    submitted_at: row["Timestamp"] || new Date().toISOString(),
    updated_at: new Date().toISOString(),
    tasks: [],
  };
}

function inferStage(row) {
  const notes = (row["Note"] || "").toLowerCase();
  if (/discharg/.test(notes)) return "discharged";
  if (/not moving forward|decided not to|chose not to|will not be moving|cannot accept|ref(erred)? out|moving forward elsewhere|not to move forward/.test(notes)) return "not_moving_forward";

  const firstDay = (row["First Day of ABA Scheduled"] || "").trim();
  if (firstDay && firstDay.toUpperCase() !== "FALSE") {
    const d = new Date(firstDay);
    if (!isNaN(d) && d < new Date()) return "active";
    return "first_day_scheduled";
  }
  if ((row["Authorization for Services Sent"] || "").trim().toUpperCase() === "TRUE") return "first_day_scheduled";

  const assessScheduled = (row["Intake Assesment Scheduled"] || row["Intake Assessment Scheduled"] || "").toLowerCase();
  const vineland = (row["Vineland"] || "").toLowerCase();
  if (assessScheduled.includes("completed") || assessScheduled.includes("scheduled") || assessScheduled.includes("submitted") || vineland.includes("completed")) return "authorization";

  if ((row["Intake Packet Sent"] || "").trim().toUpperCase() === "TRUE") return "assessment_scheduling";

  const insVerif = (row["Insurance Verification Completed"] || "").toLowerCase();
  if (insVerif.includes("insurance verified")) return "intake_packet";

  if ((row["Clinical Screener Completed"] || "").trim().toUpperCase() === "TRUE") return "insurance_verification";

  return "clinical_screener";
}

async function silentFastForward(client, targetStageKey) {
  const order = STAGE_ORDER.filter((k) => !["discharged", "not_moving_forward"].includes(k));
  const idx = order.indexOf(targetStageKey);
  const path = idx === -1 ? ["new_submission"] : order.slice(0, idx + 1);
  for (let i = 0; i < path.length; i++) {
    await enterStage(client, path[i], { silent: true });
    if (i < path.length - 1) {
      client.tasks.filter((t) => t.stage_key === path[i]).forEach((t) => { t.status = "completed"; t.completed_at = new Date().toISOString(); });
    }
  }
  if (targetStageKey === "discharged" || targetStageKey === "not_moving_forward") {
    client.stage = targetStageKey;
  }
}

async function importFromSheet() {
  const statusEl = document.getElementById("sync-status");
  if (statusEl) statusEl.textContent = "Reading enrollment sheet…";
  const result = await window.cowork.callMcpTool(READ_TOOL, { fileId: SHEET_FILE_ID });
  const raw = result.structuredContent ?? JSON.parse(result.content[0].text);
  const md = raw.fileContent || "";
  const rows = parseMarkdownTable(md);
  const isFirstSync = state.clients.length === 0 && state.importedKeys.length === 0;

  let imported = 0, skipped = 0;
  for (const row of rows) {
    const childName = (row["First and Last Name of Child"] || "").trim();
    if (!childName) continue;
    const key = (row["Timestamp"] || "") + "|" + childName;
    if (state.importedKeys.includes(key)) { skipped++; continue; }
    state.importedKeys.push(key);
    const client = buildClientFromRow(row);
    state.clients.push(client);
    if (isFirstSync) {
      await silentFastForward(client, inferStage(row));
    } else {
      await enterStage(client, "new_submission");
    }
    imported++;
  }
  state.settings.lastSync = new Date().toISOString();
  save();
  if (statusEl) {
    statusEl.textContent = isFirstSync
      ? `Backfilled ${imported} existing families (no emails sent) · ${skipped} skipped`
      : `Synced: ${imported} new signup(s), ${skipped} already imported`;
  }
  render();
}

function hoursBetween(start, end) {
  const [sh, sm] = start.split(":").map(Number), [eh, em] = end.split(":").map(Number);
  return Math.round(((eh * 60 + em) - (sh * 60 + sm)) / 60 * 10) / 10;
}

  const notifications = state.notifications.slice(0, 100);
  mount.innerHTML = `
    <div class="page-header"><div><h1>Message Outbox</h1><p>Every automated email the system has sent (or simulated) to staff and parents.</p></div></div>
    <div class="card">${notifications.length ? notifications.map((n) => `<div class="outbox-item">
        <div class="subject">${n.subject}</div>
        <div class="meta">to <strong>${n.recipient}</strong> · ${n.type.replace("_"," ")} · ${fmtDate(n.sent_at)}<span class="delivered-pill ${n.delivered}">${n.delivered}</span></div>
        <div class="body">${n.body.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim()}</div>
      </div>`).join("") : `<div class="empty-state">No messages sent yet.</div>`}</div>`;
}

function renderAdmin(mount) {
  mount.innerHTML = `
    <div class="page-header"><div><h1>Admin Settings</h1><p>Email routing, live-send toggle, and data controls.</p></div></div>

    <div class="card" style="margin-bottom:18px;">
      <div class="section-title" style="margin-top:0;">Live Email Sending</div>
      <div class="toggle-row">
        <div style="max-width:480px; font-size:12.5px; color:var(--text-muted);">
          When <strong>ON</strong>, department and parent emails actually send through your connected Outlook account.
          When <strong>OFF</strong>, everything is logged to the Outbox but nothing really sends — safe for testing.
        </div>
        <label class="switch"><input type="checkbox" id="live-email-toggle" ${state.settings.liveEmail ? "checked" : ""}/><span class="slider"></span></label>
      </div>
      <button class="btn secondary small" id="test-email-btn" style="margin-top:10px;">Send test email to myself</button>
      <span id="test-email-result" style="margin-left:8px; font-size:12.5px; color:var(--text-muted);"></span>
    </div>

    <div class="card" style="margin-bottom:18px;">
      <div class="section-title" style="margin-top:0;">Department Notification Emails</div>
      ${Object.entries(state.departments).map(([key, d]) => `<div class="task-row">
        <div class="info"><span class="badge" style="background:${d.color}">${d.name}</span></div>
        <div style="display:flex; gap:8px;"><input data-dept-email="${key}" value="${d.email}" style="width:230px;" /><button class="btn small secondary" data-save-dept="${key}">Save</button></div>
      </div>`).join("")}
    </div>

    <div class="card" style="margin-bottom:18px;">
      <div class="section-title" style="margin-top:0;">Overdue Sweep</div>
      <p style="color:var(--text-muted); font-size:12.5px;">This only runs when the page is open (there's no background server). Run it manually, or reopen this page periodically.</p>
      <button class="btn secondary" id="run-sweep">Run overdue check now</button>
      <span id="sweep-result" style="margin-left:10px; font-size:12.5px; color:var(--text-muted);"></span>
    </div>

    <div class="card">
      <div class="section-title" style="margin-top:0;">Data</div>
      <p style="color:var(--text-muted); font-size:12.5px;">All data lives only in this browser's local storage. Clearing it removes everything.</p>
      <button class="btn danger small" id="reset-data-btn">Erase all local data</button>
    </div>`;

  mount.querySelector("#live-email-toggle").addEventListener("change", (e) => { state.settings.liveEmail = e.target.checked; save(); render(); });
  mount.querySelector("#test-email-btn").addEventListener("click", async () => {
    const to = prompt("Send test email to which address?", "");
    if (!to) return;
    const delivered = await sendEmail({ to, subject: "Spectrum Squad CRM — test email", html: "<p>This confirms email sending is working.</p>", type: "department_alert" });
    document.getElementById("test-email-result").textContent = `Result: ${delivered}`;
  });
  mount.querySelectorAll("[data-save-dept]").forEach((btn) => btn.addEventListener("click", () => {
    const key = btn.dataset.saveDept;
    state.departments[key].email = mount.querySelector(`[data-dept-email="${key}"]`).value;
    save(); btn.textContent = "Saved ✓"; setTimeout(() => (btn.textContent = "Save"), 1400);
  }));
  mount.querySelector("#run-sweep").addEventListener("click", async () => {
    const n = await checkOverdueAll();
    document.getElementById("sweep-result").textContent = `${n} task(s) newly flagged overdue.`;
  });
  mount.querySelector("#reset-data-btn").addEventListener("click", () => {
    if (confirm("This erases all clients, tasks, schedule, and outbox history in this browser. Continue?")) {
      state = defaultState(); save(); render();
    }
  });
}

render();
</script>
</body>
</html>
