<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Peer Review — Spectrum Squad</title>
<style>
  :root { --navy:#1b2a6b; --ink:#201a4d; --muted:#6b6a86; --line:#e6e1d4; --bg:#faf8f2; --gold:#e0a430; --ok:#15803d; --bad:#b42318; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width:820px; margin:0 auto; padding:18px 16px 120px; }
  .logo { display:block; width:190px; max-width:60%; margin:6px auto 14px; }
  h1 { font-size:22px; margin:0 0 4px; color:var(--navy); }
  h2 { font-size:17px; margin:22px 0 10px; color:var(--navy); }
  .muted { color:var(--muted); font-size:13.5px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:12px; }
  .scale { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; color:var(--muted); margin-top:8px; }
  .scale b { color:var(--navy); }
  .bar { position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 0 8px; border-bottom:1px solid var(--line); margin-bottom:6px; }
  .track { height:8px; background:#ece8dc; border-radius:99px; overflow:hidden; }
  .fill { height:100%; width:0; background:var(--gold); transition:width .2s; }
  .bar-row { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-top:5px; }
  details.person { background:#fff; border:1px solid var(--line); border-radius:12px; margin-bottom:8px; }
  details.person > summary { list-style:none; cursor:pointer; padding:12px 14px; display:flex; align-items:center; gap:10px; font-weight:700; color:var(--navy); }
  details.person > summary::-webkit-details-marker { display:none; }
  .dot { width:11px; height:11px; border-radius:50%; background:#d9d4c4; flex:none; }
  .dot.done { background:var(--ok); }
  .state { margin-left:auto; font-size:12px; font-weight:600; color:var(--muted); }
  .body { padding:2px 14px 14px; }
  .q { padding:10px 0; border-top:1px solid #f1eee6; }
  .q-label { font-size:14px; margin-bottom:7px; }
  .opts { display:flex; flex-wrap:wrap; gap:6px; }
  .opt { min-width:44px; height:40px; padding:0 12px; border:1px solid var(--line); background:#fff; border-radius:10px; font:inherit; font-weight:700; color:var(--navy); cursor:pointer; }
  .opt[aria-pressed="true"] { background:var(--navy); color:#fff; border-color:var(--navy); }
  .opt.na[aria-pressed="true"] { background:#6b6a86; border-color:#6b6a86; }
  .reason { margin-top:8px; }
  .reason label { display:block; font-size:12.5px; font-weight:700; color:var(--bad); margin-bottom:4px; }
  textarea, select, input[type=text] { width:100%; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
  textarea { min-height:70px; resize:vertical; }
  .linkbtn { background:none; border:0; color:var(--navy); text-decoration:underline; font:inherit; font-size:13px; cursor:pointer; padding:4px 0; }
  .fb-row { display:grid; grid-template-columns: 1fr; gap:6px; padding:10px 0; border-top:1px solid #f1eee6; }
  .submit-bar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:12px 16px; }
  .submit-inner { max-width:820px; margin:0 auto; display:flex; gap:12px; align-items:center; }
  .submit-inner .msg { flex:1; font-size:13.5px; }
  .btn { background:var(--gold); color:var(--navy); font:inherit; font-weight:800; border:0; border-radius:999px; padding:12px 24px; cursor:pointer; }
  .btn[disabled] { opacity:.5; cursor:default; }
  .err { color:var(--bad); } .good { color:var(--ok); font-weight:700; }
  .notice { background:#eef2ff; border:1px solid #c7d2fe; border-radius:12px; padding:12px 14px; font-size:14px; }
</style>
</head>
<body>
<div class="wrap" id="app"><img class="logo" src="/logo.png" alt="Spectrum Squad" /><p class="muted" style="text-align:center;">Loading your peer review…</p></div>

<script>
(function () {
  "use strict";
  var token = decodeURIComponent(location.pathname.split("/").filter(Boolean)[1] || "");
  var app = document.getElementById("app");
  var data = null;
  // answers[subjectId][competencyKey] = 1..5 | "na"
  var answers = {};
  // reasons[subjectId + ":" + competencyKey] = text
  var reasons = {};
  var feedback = { shoutout: [], additional: [] };

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmtDate(s) { if (!s) return ""; var d = new Date(s.length === 10 ? s + "T12:00:00" : s); return isNaN(d) ? s : d.toLocaleDateString("en-US", { month: "long", day: "numeric" }); }

  // No cookies are sent. The link is the credential, and a CRM session in the
  // same browser has nothing to do with whose survey this is.
  function api(method, body) {
    var url = "/api/peer-review/public/survey" + (method === "GET" ? "?token=" + encodeURIComponent(token) : "");
    return fetch(url, { method: method, credentials: "omit",
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) throw new Error(d.error || "Something went wrong."); return d; }); });
  }

  function allPeople() {
    var out = [];
    data.sections.forEach(function (s) { s.people.forEach(function (p) { out.push({ p: p, s: s }); }); });
    return out;
  }
  function personDone(p, s) {
    var a = answers[p.id] || {};
    return s.competencies.every(function (c) { return a[c.key] != null; });
  }
  function personStarted(p) { var a = answers[p.id]; return !!a && Object.keys(a).length > 0; }

  function load() {
    api("GET").then(function (d) {
      data = d;
      (d.answers.ratings || []).forEach(function (r) {
        answers[r.subject_employee_id] = answers[r.subject_employee_id] || {};
        answers[r.subject_employee_id][r.competency] = Number(r.rating);
      });
      (d.answers.comments || []).forEach(function (c) {
        if (c.kind === "below3") reasons[c.subject_employee_id + ":" + (c.competency || "")] = c.body;
        else if (feedback[c.kind]) feedback[c.kind].push({ subject: c.subject_employee_id == null ? "" : String(c.subject_employee_id), body: c.body });
      });
      // A submitted survey stores no N/A rows. Anybody they were shown and
      // gave no rating to was N/A, so show it that way rather than as unanswered.
      if (d.submitted_at) {
        allPeople().forEach(function (x) {
          answers[x.p.id] = answers[x.p.id] || {};
          x.s.competencies.forEach(function (c) { if (answers[x.p.id][c.key] == null) answers[x.p.id][c.key] = "na"; });
        });
      }
      if (!feedback.shoutout.length) feedback.shoutout.push({ subject: "", body: "" });
      if (!feedback.additional.length) feedback.additional.push({ subject: "", body: "" });
      render();
    }).catch(function (e) {
      app.innerHTML = '<img class="logo" src="/logo.png" alt="Spectrum Squad" /><div class="card"><h1>Link not found</h1><p>' + esc(e.message) + "</p></div>";
    });
  }

  function personOptions(selected, allowGeneral) {
    var o = '<option value="">' + (allowGeneral ? "General, for leadership only" : "Choose a coworker") + "</option>";
    data.sections.forEach(function (s) {
      if (!s.people.length) return;
      o += '<optgroup label="' + esc(s.label) + '">' + s.people.map(function (p) {
        return '<option value="' + p.id + '"' + (String(selected) === String(p.id) ? " selected" : "") + ">" + esc(p.name) + "</option>";
      }).join("") + "</optgroup>";
    });
    return o;
  }

  function render() {
    var ro = !data.editable;
    var scale = Object.keys(data.ratings_scale).map(function (k) { return "<span><b>" + k + "</b> " + esc(data.ratings_scale[k]) + "</span>"; }).join("");
    var h = '<img class="logo" src="/logo.png" alt="Spectrum Squad" />' +
      '<div class="card"><h1>' + esc(data.cycle.name) + " Peer Review</h1>" +
      '<p style="margin:4px 0 0;">Hi ' + esc(data.reviewer_name) + ". Rate each coworker you work with. Choose <b>N/A</b> for anyone you haven't worked with." +
      (data.cycle.closes_on ? " Please finish by <b>" + esc(fmtDate(data.cycle.closes_on)) + "</b>." : "") + "</p>" +
      '<p class="muted" style="margin:8px 0 0;">Your answers are anonymous. Each person only sees combined averages from all their coworkers, never who said what. Anything below 3 needs a short reason.</p>' +
      '<div class="scale">' + scale + "</div></div>";

    if (ro) h += '<div class="notice">This review cycle is closed, so answers can no longer be changed.</div>';
    else if (data.submitted_at) h += '<div class="notice">You already submitted this. You can change your answers and submit again until the review closes.</div>';

    h += '<div class="bar"><div class="track"><div class="fill" id="fill"></div></div><div class="bar-row"><span id="count"></span><span>Tap a name to open it</span></div></div>';

    data.sections.forEach(function (s) {
      if (!s.people.length) return;
      h += "<h2>" + esc(s.label) + "s</h2>";
      s.people.forEach(function (p) {
        h += '<details class="person" data-person="' + p.id + '"><summary><span class="dot" data-dot="' + p.id + '"></span>' + esc(p.name) +
          '<span class="state" data-state="' + p.id + '"></span></summary><div class="body">' +
          (ro ? "" : '<button type="button" class="linkbtn" data-allna="' + p.id + '">I haven\'t worked with ' + esc(p.name.split(" ")[0]) + " (mark all N/A)</button>") +
          s.competencies.map(function (c) {
            var v = (answers[p.id] || {})[c.key];
            var btns = [1, 2, 3, 4, 5].map(function (n) {
              return '<button type="button" class="opt" aria-pressed="' + (v === n) + '" aria-label="' + n + " " + esc(data.ratings_scale[n]) + '" data-p="' + p.id + '" data-c="' + c.key + '" data-v="' + n + '"' + (ro ? " disabled" : "") + ">" + n + "</button>";
            }).join("") + '<button type="button" class="opt na" aria-pressed="' + (v === "na") + '" data-p="' + p.id + '" data-c="' + c.key + '" data-v="na"' + (ro ? " disabled" : "") + ">N/A</button>";
            var low = typeof v === "number" && v < 3;
            return '<div class="q"><div class="q-label">' + esc(c.label) + '</div><div class="opts">' + btns + "</div>" +
              '<div class="reason" data-reason-wrap="' + p.id + ":" + c.key + '"' + (low ? "" : ' style="display:none;"') + '><label>Why below 3? (required)</label>' +
              '<textarea data-reason="' + p.id + ":" + c.key + '"' + (ro ? " disabled" : "") + ">" + esc(reasons[p.id + ":" + c.key] || "") + "</textarea></div></div>";
          }).join("") + "</div></details>";
      });
    });

    function fbBlock(kind, title, hint, allowGeneral) {
      return '<div class="card"><h2 style="margin-top:0;">' + title + '</h2><p class="muted" style="margin:0 0 4px;">' + hint + "</p>" +
        feedback[kind].map(function (f, i) {
          return '<div class="fb-row"><select data-fb-subj="' + kind + ":" + i + '"' + (ro ? " disabled" : "") + ">" + personOptions(f.subject, allowGeneral) + "</select>" +
            '<textarea data-fb-body="' + kind + ":" + i + '" placeholder="Write here"' + (ro ? " disabled" : "") + ">" + esc(f.body) + "</textarea></div>";
        }).join("") +
        (ro ? "" : '<button type="button" class="linkbtn" data-fb-add="' + kind + '">Add another</button>') + "</div>";
    }
    h += fbBlock("shoutout", "Shout out a coworker", "Optional. Recognize someone for something they did well.", false);
    h += fbBlock("additional", "Anything we didn't ask about?", "Optional. Pick who it's about, or choose General if it's just for leadership.", true);

    app.innerHTML = h;
    if (!ro) {
      var bar = document.createElement("div");
      bar.className = "submit-bar";
      bar.innerHTML = '<div class="submit-inner"><div class="msg" id="msg"></div><button class="btn" id="submit">' + (data.submitted_at ? "Submit changes" : "Submit my review") + "</button></div>";
      document.body.appendChild(bar);
      document.getElementById("submit").addEventListener("click", submit);
    }
    wire();
    refreshProgress();
  }

  function refreshProgress() {
    var list = allPeople(), done = 0;
    list.forEach(function (x) {
      var d = personDone(x.p, x.s), st = personStarted(x.p);
      if (d) done++;
      var dot = document.querySelector('[data-dot="' + x.p.id + '"]');
      if (dot) dot.className = "dot" + (d ? " done" : "");
      var s = document.querySelector('[data-state="' + x.p.id + '"]');
      if (s) s.textContent = d ? "Done" : st ? "In progress" : "";
    });
    var pct = list.length ? Math.round(done / list.length * 100) : 0;
    var f = document.getElementById("fill"); if (f) f.style.width = pct + "%";
    var c = document.getElementById("count"); if (c) c.textContent = done + " of " + list.length + " coworkers done";
  }

  var wired = false;
  function wire() {
    // app itself survives re-renders, so its listeners are attached once.
    if (wired) return;
    wired = true;
    app.addEventListener("click", function (e) {
      var b = e.target.closest("button.opt");
      if (b && !b.disabled) {
        var p = b.getAttribute("data-p"), c = b.getAttribute("data-c"), v = b.getAttribute("data-v");
        answers[p] = answers[p] || {};
        answers[p][c] = v === "na" ? "na" : Number(v);
        b.parentNode.querySelectorAll("button.opt").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
        var wrap = app.querySelector('[data-reason-wrap="' + p + ":" + c + '"]');
        if (wrap) wrap.style.display = (v !== "na" && Number(v) < 3) ? "" : "none";
        refreshProgress();
        return;
      }
      var na = e.target.closest("[data-allna]");
      if (na) {
        var pid = na.getAttribute("data-allna");
        answers[pid] = answers[pid] || {};
        app.querySelectorAll('button.opt[data-p="' + pid + '"]').forEach(function (x) {
          answers[pid][x.getAttribute("data-c")] = "na";
          x.setAttribute("aria-pressed", String(x.getAttribute("data-v") === "na"));
        });
        app.querySelectorAll('[data-reason-wrap^="' + pid + ':"]').forEach(function (w) { w.style.display = "none"; });
        refreshProgress();
        return;
      }
      var add = e.target.closest("[data-fb-add]");
      if (add) { collectFeedback(); feedback[add.getAttribute("data-fb-add")].push({ subject: "", body: "" }); var y = window.scrollY; document.querySelector(".submit-bar") && document.querySelector(".submit-bar").remove(); render(); window.scrollTo(0, y); }
    });
    app.addEventListener("input", function (e) {
      var r = e.target.getAttribute("data-reason");
      if (r) reasons[r] = e.target.value;
    });
  }

  function collectFeedback() {
    ["shoutout", "additional"].forEach(function (k) {
      feedback[k].forEach(function (f, i) {
        var s = app.querySelector('[data-fb-subj="' + k + ":" + i + '"]');
        var b = app.querySelector('[data-fb-body="' + k + ":" + i + '"]');
        if (s) f.subject = s.value;
        if (b) f.body = b.value;
      });
    });
  }

  function submit() {
    collectFeedback();
    var msg = document.getElementById("msg");
    var ratings = [], comments = [];
    // Every rating below 3 needs its reason before anything is sent.
    for (var pid in answers) {
      for (var ck in answers[pid]) {
        var v = answers[pid][ck];
        if (v === "na" || v == null) continue;
        ratings.push({ subject_employee_id: Number(pid), competency: ck, rating: v });
        if (v < 3) {
          var why = (reasons[pid + ":" + ck] || "").trim();
          if (!why) {
            var det = app.querySelector('details[data-person="' + pid + '"]');
            if (det) { det.open = true; det.scrollIntoView({ behavior: "smooth", block: "start" }); }
            var ta = app.querySelector('[data-reason="' + pid + ":" + ck + '"]'); if (ta) setTimeout(function () { ta.focus(); }, 300);
            msg.innerHTML = '<span class="err">Add a reason for each rating below 3.</span>';
            return;
          }
          comments.push({ subject_employee_id: Number(pid), kind: "below3", competency: ck, body: why });
        }
      }
    }
    ["shoutout", "additional"].forEach(function (k) {
      feedback[k].forEach(function (f) {
        if (!f.body.trim()) return;
        comments.push({ subject_employee_id: f.subject ? Number(f.subject) : null, kind: k, body: f.body.trim() });
      });
    });
    if (feedback.shoutout.some(function (f) { return f.body.trim() && !f.subject; })) {
      msg.innerHTML = '<span class="err">Pick who your shout-out is for.</span>';
      return;
    }
    var btn = document.getElementById("submit");
    btn.disabled = true; msg.textContent = "Submitting…";
    api("POST", { token: token, ratings: ratings, comments: comments }).then(function () {
      data.submitted_at = new Date().toISOString();
      btn.disabled = false; btn.textContent = "Submit changes";
      msg.innerHTML = '<span class="good">Thank you. Your review is in.</span> You can change it until the review closes.';
    }).catch(function (e) { btn.disabled = false; msg.innerHTML = '<span class="err">' + esc(e.message) + "</span>"; });
  }

  load();
})();
</script>
</body>
</html>
