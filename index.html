              <td style="padding:9px 10px; border-top:1px solid var(--border,#eee);">${staffEsc(e.certifications || (e.credentials || []).map((c) => c.credential_type).join(", ") || "—")}</td>
              <td style="padding:9px 10px; border-top:1px solid var(--border,#eee);">${tenureFrom(e.hr_hire_date || e.hire_date)}</td>
              <td style="padding:9px 10px; border-top:1px solid var(--border,#eee);"><span class="tag">${staffEsc(e.status || "active")}</span></td>
            </tr>`; }).join("") : `<tr><td colspan="7"><div class="empty-state">No staff yet. Add one or import your Rethink sheet.</div></td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
  if (window.PeopleUI) window.PeopleUI.renderCertBanner(mount.querySelector("#cert-banner"));
  mount.querySelector("#staff-add-btn").addEventListener("click", () => openStaffModal(null, mount));
  mount.querySelector("#staff-import-btn").addEventListener("click", () => openStaffImportModal(mount));
  mount.querySelector("#payroll-import-btn").addEventListener("click", () => openPayrollImportModal(mount));
  mount.querySelectorAll("[data-staff]").forEach((tr) => tr.addEventListener("click", (ev) => { if (ev.target.closest(".staff-cb")) return; openStaffModal(tr.dataset.staff, mount); }));
  wireStaffBulk(mount);
  try {
    const oc = await api("/api/hr/documents-outstanding");
    const el = mount.querySelector("#docs-outstanding");
    if (el && oc && oc.count != null) {
      const mw = oc.milestones_this_week || 0;
      el.innerHTML = `<span class="tag" style="background:${oc.count ? "#fef3c7" : "#dcfce7"}; color:${oc.count ? "#92400e" : "#166534"}; font-size:13px; padding:6px 12px;">Documents outstanding: <strong>${oc.count}</strong></span>`
        + `<span class="tag" style="background:#eef0fb; color:#1b2a6b; font-size:13px; padding:6px 12px; margin-left:8px;">Milestone check-ins this week: <strong>${mw}</strong></span>`;
    }
  } catch (e) {}
  // Lazy-load photo thumbnails for staff who have one. Kept on the shared
  // helper so the directory, the team list and the scheduler all behave the
  // same way and there is one place to change it.
  mount.querySelectorAll('.staff-av[data-hasphoto="1"]').forEach((av) => {
    const img = new Image();
    img.alt = "";
    img.src = `/api/hr/employees/${av.dataset.av}/photo?t=${Date.now()}`;
    img.style.cssText = "width:100%;height:100%;object-fit:cover;";
    img.onload = () => { av.innerHTML = ""; av.appendChild(img); };
    img.onerror = () => { /* keep the initials */ };
  });
}

async function openStaffModal(id, pageMount) {
  let emp = { status: "active" };
  if (id) { try { emp = await api(`/api/hr/employees/${id}`); } catch (e) {} }
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  const field = (k, label, type) => `<div class="field"><label>${label}</label><input data-f="${k}" ${type ? `type="${type}"` : ""} value="${staffEsc(emp[k] || "")}" /></div>`;
  const HR_STAGES = ["Applicant", "Interviewing", "Offer Sent", "Offer Accepted", "Onboarding", "Active", "Inactive"];
  const initials = (emp.name || "?").split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  // Precompute dynamic sections defensively so a render error in any one of
  // them can never stop the whole card from appearing.
  const safe = (fn) => { try { return fn(); } catch (e) { return `<div class="empty-state">—</div>`; } };
  const availHtml = id ? safe(() => renderStaffAvailability(emp)) : "";
  const activityHtml = id ? safe(() => renderStaffActivity(emp)) : "";
  const timecardsHtml = id ? safe(() => (emp.timecards || []).length
    ? emp.timecards.map((t) => `<div class="task-row"><div class="info"><strong>${t.pay_period_start ? fmtDate(t.pay_period_start) : "Period"} – ${t.pay_period_end ? fmtDate(t.pay_period_end) : ""}</strong><div class="due">Status: ${staffEsc(t.status)}${Number(t.open_flags) ? ` · ${t.open_flags} open flag(s)` : ""}</div></div><button class="btn small secondary" data-req-sig="${t.id}">Request signature</button></div>`).join("")
    : `<div class="empty-state">No timecards yet. Import a payroll export to create them.</div>`) : "";
  backdrop.innerHTML = `
    <div class="modal" style="width:620px;">
      <div class="modal-header"><h2>${id ? staffEsc(emp.name) : "Add Staff"}</h2><button class="close-btn">✕</button></div>
      ${id ? `<div style="text-align:center; margin-bottom:10px;">
        <div id="staff-avatar" style="width:84px;height:84px;border-radius:50%;margin:0 auto;background:#eef0fb;color:#1b2a6b;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;overflow:hidden;">${staffEsc(initials)}</div>
      </div>` : ""}
      <div class="form-grid" style="gap:10px;">
        ${field("name", "Full name")}
        ${field("role_title", "Title / role")}
        ${field("email", "Email", "email")}
        ${field("phone", "Phone")}
        <div class="field full"><label>Address</label><input data-f="address" value="${staffEsc(emp.address || "")}" /></div>
        <div class="field full"><label>Certification(s)</label><input data-f="certifications" value="${staffEsc(emp.certifications || "")}" placeholder="e.g. RBT, CPR/BLS" /></div>
        <div class="field"><label>Preferred hours</label><input data-f="hr_pref_hours" value="${staffEsc(emp.hr_pref_hours || "")}" placeholder="e.g. 25–30/wk, mornings" /></div>
        <div class="field"><label>Preferred location</label><input data-f="hr_pref_location" value="${staffEsc(emp.hr_pref_location || "")}" placeholder="e.g. In-clinic, in-home, NW valley" /></div>
        <div class="field"><label>Language(s)</label><input data-f="hr_pref_language" value="${staffEsc(emp.hr_pref_language || "")}" placeholder="e.g. English, Spanish" /></div>
        <div class="field full"><label>Other schedule preferences</label><input data-f="hr_pref_notes" value="${staffEsc(emp.hr_pref_notes || "")}" placeholder="Anything else about their ideal schedule" /></div>
        <div class="field"><label>HR stage</label><select data-f="hr_stage">
          <option value="">—</option>
          ${HR_STAGES.map((s) => `<option value="${s}" ${emp.hr_stage === s ? "selected" : ""}>${s}</option>`).join("")}
        </select></div>
        <div class="field"><label>Hire date (start)</label><input data-f="hr_hire_date" type="date" value="${staffEsc((emp.hr_hire_date || emp.hire_date || "").slice(0,10))}" /></div>
        <div class="field"><label>Employment status</label><select data-f="status" id="staff-status">
          ${["active", "onboarding", "leave", "terminated"].map((s) => `<option value="${s}" ${emp.status === s ? "selected" : ""}>${s}</option>`).join("")}
        </select></div>
        <div class="field"><label>Termination date</label><input data-f="termination_date" id="staff-term-date" type="date" value="${staffEsc((emp.termination_date || "").slice(0, 10))}" /></div>
        <div class="field"><label>Termination type</label><select data-f="termination_type" id="staff-term-type">
          <option value="">—</option>
          ${[["voluntary", "Voluntary"], ["involuntary", "Involuntary"], ["unknown", "Unknown"]].map(([v, l]) => `<option value="${v}" ${emp.termination_type === v ? "selected" : ""}>${l}</option>`).join("")}
        </select></div>
        <div class="field full"><label>Termination reason</label><input data-f="termination_reason" id="staff-term-reason" value="${staffEsc(emp.termination_reason || "")}" placeholder="Optional — kept on the record" /></div>
      </div>
      <div id="staff-term-note" style="font-size:12px; color:var(--text-muted); margin-top:4px;"></div>
      ${id ? `<div style="font-size:12.5px; color:var(--text-muted); margin-top:6px;">Length of employment: <strong>${tenureFrom(emp.hr_hire_date || emp.hire_date)}</strong></div>` : ""}
      <div style="margin-top:16px; display:flex; gap:8px;">
        <button class="btn" id="staff-save">${id ? "Save" : "Add"}</button>
        <span id="staff-save-status" style="font-size:12.5px; color:var(--text-muted); align-self:center;"></span>
      </div>
      ${id ? `<div class="section-title">Emergency Contacts</div><div id="staff-emergency"></div>` : ""}
      ${id ? `<div class="section-title">Certifications &amp; Renewals</div><div id="staff-certs"></div>` : ""}
      ${id ? `<div class="section-title">Onboarding Paperwork</div><div id="staff-packet"></div>` : ""}
      ${id ? `<div class="section-title">Documents</div><div id="staff-docs"></div>` : ""}
      ${id ? `<div class="section-title">Timecards</div><div id="staff-timecards">${timecardsHtml}</div>` : ""}
      ${id ? `<div class="section-title">Supervision</div><div id="staff-supervision"></div>` : ""}
      ${id ? `<div class="section-title">Attendance</div><div id="staff-attendance"></div>` : ""}
      ${id ? `<div class="section-title">Availability (submitted by staff)</div><div id="staff-availability">${availHtml}</div>` : ""}
      ${id ? `<div class="section-title">Activity log</div><div id="staff-activity">${activityHtml}</div>` : ""}
    </div>`;
  document.body.appendChild(backdrop);
  const close = () => backdrop.remove();
  backdrop.querySelector(".close-btn").addEventListener("click", close);
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) close(); });
  // Only show the termination fields when they mean something, and say what
  // will happen if the date is left blank. Terminated staff are never deleted:
  // the record, its documents, attendance and supervision history all stay.
  const termFields = ["staff-term-date", "staff-term-type", "staff-term-reason"];
  const syncTermFields = () => {
    const statusEl = backdrop.querySelector("#staff-status");
    if (!statusEl) return;
    const terminated = statusEl.value === "terminated";
    termFields.forEach((fid) => {
      const el = backdrop.querySelector("#" + fid);
      if (el && el.closest(".field")) el.closest(".field").style.display = terminated ? "" : "none";
    });
    const note = backdrop.querySelector("#staff-term-note");
    if (note) {
      const dateEl = backdrop.querySelector("#staff-term-date");
      note.textContent = !terminated
        ? ""
        : (dateEl && dateEl.value)
          ? "The record is kept in full — documents, attendance and supervision history all stay on file."
          : "No date entered: today's date will be recorded so this separation is counted in the turnover rate.";
    }
  };
  const statusSel = backdrop.querySelector("#staff-status");
  if (statusSel) statusSel.addEventListener("change", syncTermFields);
  const termDateEl = backdrop.querySelector("#staff-term-date");
  if (termDateEl) termDateEl.addEventListener("change", syncTermFields);
  syncTermFields();

  backdrop.querySelector("#staff-save").addEventListener("click", async () => {
    const body = {};
    backdrop.querySelectorAll("[data-f]").forEach((el) => { body[el.dataset.f] = el.value || null; });
    if (!body.name) { backdrop.querySelector("#staff-save-status").textContent = "Name is required."; return; }
    try {
      if (id) await api(`/api/hr/employees/${id}`, { method: "PATCH", body });
      else await api("/api/hr/employees", { method: "POST", body });
      close();
      renderStaff(pageMount);
    } catch (e) { backdrop.querySelector("#staff-save-status").textContent = e.message || "Could not save."; }
  });
  backdrop.querySelectorAll("[data-req-sig]").forEach((btn) => btn.addEventListener("click", async () => {
    btn.disabled = true; btn.textContent = "Sending…";
    try { const r = await api(`/api/hr/timecards/${btn.dataset.reqSig}/request-verification`, { method: "POST" }); btn.textContent = r.sent ? "Sent ✓" : "Link created"; }
    catch (e) { btn.textContent = "Failed"; alert(e.message); }
  }));

  // When the HR stage is switched to "Offer Accepted", offer to fire the
  // onboarding bundle (welcome emails + tasks) before saving.
  if (id) {
    const stageSel = backdrop.querySelector('[data-f="hr_stage"]');
    const priorStage = emp.hr_stage || "";
    if (stageSel) stageSel.addEventListener("change", () => {
      if (stageSel.value === "Offer Accepted" && priorStage !== "Offer Accepted") {
        openOfferAcceptedModal(id, emp, () => { close(); if (pageMount) renderStaff(pageMount); });
      }
    });
  }

  // Photo avatar
  if (id && emp.hr_photo) {
    const av = backdrop.querySelector("#staff-avatar");
    if (av) {
      const img = new Image();
      img.src = `/api/hr/employees/${id}/photo?t=${Date.now()}`;
      img.style.cssText = "width:100%;height:100%;object-fit:cover;";
      img.onload = () => { av.innerHTML = ""; av.appendChild(img); };
    }
  }

  if (id && window.PeopleUI) {
    const ecEl = backdrop.querySelector("#staff-emergency");
    if (ecEl) window.PeopleUI.renderEmergencyContacts(ecEl, "staff", id);
    const certEl = backdrop.querySelector("#staff-certs");
    if (certEl) window.PeopleUI.renderCertifications(certEl, id);
    const packetEl = backdrop.querySelector("#staff-packet");
    if (packetEl) window.PeopleUI.renderNewHirePacket(packetEl, id);
  }
  if (id) renderStaffDocs(backdrop, id, emp.documents || []);
  if (id && window.HRAttendance) {
    const attEl = backdrop.querySelector("#staff-attendance");
    if (attEl) window.HRAttendance.renderSection(attEl, id, emp.name);
  }
  if (id && window.HRSupervision) {
    const supEl = backdrop.querySelector("#staff-supervision");
    if (supEl) window.HRSupervision.renderStaffSection(supEl, id);
  }
}

function renderStaffDocs(backdrop, id, docs) {
  const box = backdrop.querySelector("#staff-docs");
  if (!box) return;
  const esc = (s) => { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; };
  const STATUSES = ["Not Requested", "Requested", "Received", "Verified", "Expired"];
  const stColor = (s) => ({ "Not Requested": "#eee", "Requested": "#fef3c7", "Received": "#dbeafe", "Verified": "#dcfce7", "Expired": "#fee2e2" }[s] || "#eee");
  const overdueReq = (d) => d.status === "Requested" && d.date_requested && (Date.now() - new Date(d.date_requested).getTime() > 3 * 86400000);
  const rbtSoon = (d) => d.expires && d.expiration_date && ((new Date(d.expiration_date).getTime() - Date.now()) / 86400000 <= 60);
  box.innerHTML = docs.map((d) => {
    const warn = overdueReq(d) ? "border-left:4px solid #dc2626;" : (rbtSoon(d) ? "border-left:4px solid #e0a430;" : "border-left:4px solid transparent;");
    return `<div class="doc-track-row" data-key="${d.doc_key}" style="${warn} padding:8px 10px; border:1px solid var(--border,#eee); border-radius:8px; margin-bottom:8px;">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
        <strong style="font-size:13px;">${esc(d.label)}</strong>
        <span class="tag" style="background:${stColor(d.status)};">${esc(d.status)}</span>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:6px;">
        <select data-dk-status style="min-width:130px;">${STATUSES.map((s) => `<option ${s === d.status ? "selected" : ""}>${s}</option>`).join("")}</select>
        <button class="btn small secondary" data-dk-request>Request</button>
        ${d.expires ? `<label style="font-size:12px;">Expires <input type="date" data-dk-exp value="${(d.expiration_date || "").slice(0,10)}" /></label>` : ""}
        ${d.file_allowed ? `<input type="file" data-dk-file style="font-size:12px; max-width:160px;" />` : `<span style="font-size:11.5px; color:var(--text-muted);">status only (scan stays in secure folder)</span>`}
        ${d.has_file ? `<a class="btn small secondary" href="/api/hr/employees/${id}/doc-tracker/${d.doc_key}/file" target="_blank" rel="noopener">View</a>` : ""}
        <button class="btn small" data-dk-save>Save</button>
      </div>
      <input data-dk-notes placeholder="Notes (optional)" value="${esc(d.notes || "")}" style="margin-top:6px; width:100%; font-size:12.5px;" />
    </div>`;
  }).join("");

  const reload = async () => {
    try { const fresh = await api(`/api/hr/employees/${id}/doc-tracker`); renderStaffDocs(backdrop, id, fresh); } catch (e) {}
  };
  const postRow = async (row, extra) => {
    const key = row.dataset.key;
    const body = Object.assign({
      doc_key: key,
      status: row.querySelector("[data-dk-status]").value,
      notes: row.querySelector("[data-dk-notes]").value || null,
    }, extra || {});
    const exp = row.querySelector("[data-dk-exp]"); if (exp) body.expiration_date = exp.value || null;
    if (body.status === "Received" && !body.date_received) body.date_received = new Date().toISOString().slice(0, 10);
    await api(`/api/hr/employees/${id}/doc-tracker`, { method: "POST", body });
  };

  box.querySelectorAll(".doc-track-row").forEach((row) => {
    row.querySelector("[data-dk-request]").addEventListener("click", async () => {
      await api(`/api/hr/employees/${id}/doc-tracker`, { method: "POST", body: { doc_key: row.dataset.key, action: "request" } });
      reload();
    });
    row.querySelector("[data-dk-save]").addEventListener("click", async () => { await postRow(row); reload(); });
    const fileInp = row.querySelector("[data-dk-file]");
    if (fileInp) fileInp.addEventListener("change", async () => {
      const f = fileInp.files[0]; if (!f) return;
      if (f.size > 15 * 1024 * 1024) { alert("File too large (15MB max)."); return; }
      const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
      await postRow(row, { content_base64: String(dataUrl).split(",")[1], filename: f.name, mime_type: f.type || "application/octet-stream", status: "Received", date_received: new Date().toISOString().slice(0, 10) });
      reload();
    });
  });
}

function wireStaffBulk(mount) {
  const bar = mount.querySelector("#staff-bulk-bar");
  const countEl = mount.querySelector("#staff-bulk-count");
  const selectAll = mount.querySelector("#staff-select-all");
  const cbs = () => Array.from(mount.querySelectorAll(".staff-cb"));
  const selectedIds = () => cbs().filter((c) => c.checked).map((c) => Number(c.dataset.cb));
  const refresh = () => {
    const n = selectedIds().length;
    bar.style.display = n ? "flex" : "none";
    countEl.textContent = n + " selected";
    if (selectAll) selectAll.checked = n > 0 && n === cbs().length;
  };
  cbs().forEach((c) => c.addEventListener("change", refresh));
  cbs().forEach((c) => c.addEventListener("click", (e) => e.stopPropagation()));
  if (selectAll) selectAll.addEventListener("change", () => { cbs().forEach((c) => (c.checked = selectAll.checked)); refresh(); });

  const status = mount.querySelector("#staff-bulk-status");
  mount.querySelector("#staff-bulk-apply").addEventListener("click", async () => {
    const ids = selectedIds();
    if (!ids.length) return;
    const fields = {};
    const st = mount.querySelector("#bulk-status").value; if (st) fields.status = st;
    const stg = mount.querySelector("#bulk-stage").value; if (stg) fields.hr_stage = stg;
    const loc = mount.querySelector("#bulk-location").value.trim(); if (loc) fields.hr_pref_location = loc;
    if (!Object.keys(fields).length) { status.textContent = "Pick a field to change first."; return; }
    status.textContent = "Applying…";
    try {
      const r = await api("/api/hr/employees/bulk", { method: "POST", body: { ids, fields } });
      status.textContent = `Updated ${r.updated}.`;
      renderStaff(mount);
    } catch (e) { status.textContent = e.message || "Failed."; }
  });
  mount.querySelector("#staff-bulk-delete").addEventListener("click", async () => {
    const ids = selectedIds();
    if (!ids.length) return;
    if (!confirm(`Delete ${ids.length} staff member(s)? This cannot be undone.`)) return;
    status.textContent = "Deleting…";
    try {
      const r = await api("/api/hr/employees/bulk", { method: "POST", body: { ids, delete: true } });
      status.textContent = `Deleted ${r.deleted}.`;
      renderStaff(mount);
    } catch (e) { status.textContent = e.message || "Failed."; }
  });
}

function renderStaffAvailability(emp) {
  let av = null, st = null;
  try { av = emp.hr_availability ? (typeof emp.hr_availability === "string" ? JSON.parse(emp.hr_availability) : emp.hr_availability) : null; } catch (e) {}
  try { st = emp.hr_stipulations ? (typeof emp.hr_stipulations === "string" ? JSON.parse(emp.hr_stipulations) : emp.hr_stipulations) : null; } catch (e) {}
  if ((!av || !Object.keys(av).length) && (!st || !Object.keys(st).length)) {
    return `<div class="empty-state">No availability submitted yet. Sending the scheduling email (via Offer Accepted) invites the new hire to fill this out.</div>`;
  }
  const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
  const BLOCKS = [["morning", "Morning"], ["afternoon", "Afternoon"], ["evening", "Evening"]];
  let grid = "";
  if (av && Object.keys(av).length) {
    grid = `<div style="overflow-x:auto;"><table style="border-collapse:collapse;font-size:12px;width:100%;">
      <tr><th style="border:1px solid var(--border,#eee);padding:4px;">Day</th>${BLOCKS.map((b) => `<th style="border:1px solid var(--border,#eee);padding:4px;">${b[1]}</th>`).join("")}</tr>
      ${DAYS.map((d) => `<tr><td style="border:1px solid var(--border,#eee);padding:4px;font-weight:600;">${d}</td>${BLOCKS.map((b) => {
        const on = av[d] && av[d][b[0]];
        return `<td style="border:1px solid var(--border,#eee);padding:4px;text-align:center;${on ? "background:#5fa8a0;color:#fff;font-weight:700;" : ""}">${on ? "✓" : ""}</td>`;
      }).join("")}</tr>`).join("")}
    </table></div>`;
  }
  let notes = "";
  if (st && Object.keys(st).length) {
    const row = (k, label) => st[k] ? `<div style="font-size:12.5px;margin-top:4px;"><strong>${label}:</strong> ${staffEsc(st[k])}</div>` : "";
    notes = `<div style="margin-top:8px;">
      ${row("transport", "Transportation")}${row("earliest", "Earliest start")}${row("restrictions", "Cannot work")}${row("hours", "Preferred hours")}${row("notes", "Notes")}
    </div>`;
  }
  return grid + notes;
}

function renderStaffActivity(emp) {
  let arr = [];
  try { arr = emp.hr_activity ? (typeof emp.hr_activity === "string" ? JSON.parse(emp.hr_activity) : emp.hr_activity) : []; } catch (e) {}
  if (!Array.isArray(arr) || !arr.length) return `<div class="empty-state">No activity logged yet.</div>`;
  return arr.slice(0, 30).map((a) => `<div class="task-row"><div class="info"><div style="font-size:12.5px;">${staffEsc(a.text || "")}</div><div class="due">${a.at ? fmtDate(a.at) : ""}</div></div></div>`).join("");
}

// Offer-accepted onboarding bundle: pick which welcome emails/tasks to fire,
// then POST to /offer-accepted. Each action is a checkbox that starts checked.
function openOfferAcceptedModal(id, emp, onDone) {
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  const today = new Date().toISOString().slice(0, 10);
  const hire = (emp.hr_hire_date || emp.hire_date || "").slice(0, 10) || today;
  backdrop.innerHTML = `
    <div class="modal" style="width:560px;">
      <div class="modal-header"><h2>Offer accepted — start onboarding</h2><button class="close-btn">✕</button></div>
      <p style="font-size:13px; color:var(--text-muted); margin-top:0;">Choose what to send <strong>${staffEsc(emp.name)}</strong> now. Uncheck anything you'd rather handle later.</p>
      <div class="field"><label>Start / hire date</label><input id="oa-hire" type="date" value="${staffEsc(hire)}" /></div>
      <div class="opt-grid" style="margin-top:12px;">
        <label class="opt-card"><input type="checkbox" data-oa="newhire_packet" checked /><span><strong>New hire employment packet (SignNow)</strong><br><span style="font-size:12px; color:var(--text-muted);">Sends their packet to sign. If they already received it when they accepted online, it won't be sent twice.</span></span></label>
        <label class="opt-card"><input type="checkbox" data-oa="dojo" checked /><span><strong>Class Dojo welcome email</strong><br><span style="font-size:12px; color:var(--text-muted);">Warm welcome + start date.</span></span></label>
        <label class="opt-card"><input type="checkbox" data-oa="rethink" checked /><span><strong>Rethink credentials email</strong><br><span style="font-size:12px; color:var(--text-muted);">Username only — send the password by a separate secure channel.</span></span></label>
        <label class="opt-card"><input type="checkbox" data-oa="scheduling" checked /><span><strong>Availability / scheduling email</strong><br><span style="font-size:12px; color:var(--text-muted);">Sends a personal link to submit their weekly availability.</span></span></label>
        <label class="opt-card"><input type="checkbox" data-oa="task_homebase" checked /><span><strong>Task: add to Homebase</strong></span></label>
        <label class="opt-card"><input type="checkbox" data-oa="task_rethink" checked /><span><strong>Task: add to Rethink</strong></span></label>
      </div>
      <div class="form-grid" style="margin-top:10px;">
        <div class="field"><label>Class Dojo invite link (optional)</label><input id="oa-dojo-link" placeholder="https://…" /></div>
        <div class="field"><label>Rethink username (optional)</label><input id="oa-rethink-user" placeholder="jsmith" /></div>
      </div>
      <div style="margin-top:16px; display:flex; gap:8px;">
        <button class="btn" id="oa-go">Confirm &amp; send</button>
        <button class="btn secondary" id="oa-skip">Just set the stage</button>
        <span id="oa-status" style="font-size:12.5px; color:var(--text-muted); align-self:center;"></span>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  const close = () => backdrop.remove();
  backdrop.querySelector(".close-btn").addEventListener("click", close);
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) close(); });
  const run = async (fireActions) => {
    const status = backdrop.querySelector("#oa-status");
    status.textContent = "Working…";
    backdrop.querySelector("#oa-go").disabled = true;
    backdrop.querySelector("#oa-skip").disabled = true;
    try {
      if (fireActions) {
        const actions = {};
        backdrop.querySelectorAll("[data-oa]").forEach((c) => { actions[c.dataset.oa] = c.checked; });
        const body = {
          actions,
          hire_date: backdrop.querySelector("#oa-hire").value || null,
          class_dojo_link: backdrop.querySelector("#oa-dojo-link").value || null,
          rethink_username: backdrop.querySelector("#oa-rethink-user").value || null,
        };
        const r = await api(`/api/hr/employees/${id}/offer-accepted`, { method: "POST", body });
        status.textContent = "Sent: " + ((r.fired && r.fired.length) ? r.fired.join(", ") : "stage updated") + " ✓";
      } else {
        await api(`/api/hr/employees/${id}`, { method: "PATCH", body: { hr_stage: "Offer Accepted", hr_hire_date: backdrop.querySelector("#oa-hire").value || null } });
        status.textContent = "Stage updated ✓";
      }
      setTimeout(() => { close(); if (onDone) onDone(); }, 800);
    } catch (e) {
      status.textContent = e.message || "Failed.";
      backdrop.querySelector("#oa-go").disabled = false;
      backdrop.querySelector("#oa-skip").disabled = false;
    }
  };
  backdrop.querySelector("#oa-go").addEventListener("click", () => run(true));
  backdrop.querySelector("#oa-skip").addEventListener("click", () => run(false));
}

function openStaffImportModal(pageMount) {
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML = `
    <div class="modal" style="width:640px;">
      <div class="modal-header"><h2>Import Rethink Payroll Sheet</h2><button class="close-btn">✕</button></div>
      <p style="font-size:13px; color:var(--text-muted); margin-top:0;">Upload the Rethink sheet as a <strong>CSV</strong> (in Excel/Sheets: File → Save As / Download → CSV). Pay/wage columns are ignored — only contact info, certifications, and hire dates are imported.</p>
      <input type="file" id="staff-csv" accept=".csv,text/csv" />
      <div id="staff-map" style="margin-top:14px;"></div>
      <div id="staff-import-status" style="font-size:12.5px; margin-top:8px; color:var(--text-muted);"></div>
    </div>`;
  document.body.appendChild(backdrop);
  const close = () => backdrop.remove();
  backdrop.querySelector(".close-btn").addEventListener("click", close);
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) close(); });

  let headers = [], dataRows = [];
  backdrop.querySelector("#staff-csv").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const rows = parseCSV(String(reader.result));
      if (rows.length < 2) { backdrop.querySelector("#staff-map").innerHTML = `<div class="empty-state">That file has no data rows.</div>`; return; }
      headers = rows[0].map((h) => h.trim());
      dataRows = rows.slice(1);
      const guess = (field) => {
        const lc = headers.map((h) => h.toLowerCase());
        const patterns = {
          name: ["name", "employee", "staff"], email: ["email", "e-mail"], phone: ["phone", "mobile", "cell"],
          address: ["address", "street"], certifications: ["cert", "credential", "license"],
          role_title: ["title", "role", "position", "job"], hire_date: ["hire", "start date", "hired"], rethink_id: ["rethink", "employee id", "emp id", "id"],
        }[field] || [];
        const idx = lc.findIndex((h) => patterns.some((p) => h.includes(p)));
        return idx;
      };
      const opts = (sel) => `<option value="-1">— none —</option>` + headers.map((h, i) => `<option value="${i}" ${i === sel ? "selected" : ""}>${staffEsc(h)}</option>`).join("");
      backdrop.querySelector("#staff-map").innerHTML = `
        <div style="font-size:12.5px; font-weight:600; margin-bottom:8px;">Match your columns (${dataRows.length} rows found):</div>
        <div class="form-grid" style="gap:8px;">
          ${STAFF_IMPORT_FIELDS.map((f) => `<div class="field"><label>${f.label}${f.required ? " *" : ""}</label><select data-map="${f.key}">${opts(guess(f.key))}</select></div>`).join("")}
        </div>
        <div style="margin-top:12px;"><button class="btn" id="staff-do-import">Import ${dataRows.length} staff</button></div>`;
      backdrop.querySelector("#staff-do-import").addEventListener("click", async () => {
        const map = {};
        backdrop.querySelectorAll("[data-map]").forEach((s) => { map[s.dataset.map] = Number(s.value); });
        if (map.name == null || map.name < 0) { backdrop.querySelector("#staff-import-status").textContent = "Please map the Full name column."; return; }
        const out = dataRows.map((r) => {
          const rec = {};
          STAFF_IMPORT_FIELDS.forEach((f) => { const idx = map[f.key]; if (idx != null && idx >= 0) rec[f.key] = (r[idx] || "").trim(); });
          return rec;
        }).filter((r) => r.name);
        const btn = backdrop.querySelector("#staff-do-import");
        btn.disabled = true;
        backdrop.querySelector("#staff-import-status").textContent = "Importing…";
        try {
          const res = await api("/api/hr/employees/import", { method: "POST", body: { rows: out } });
          backdrop.querySelector("#staff-import-status").textContent = `Done — ${res.created} added, ${res.updated} updated.`;
          setTimeout(() => { close(); renderStaff(pageMount); }, 900);
        } catch (err) { btn.disabled = false; backdrop.querySelector("#staff-import-status").textContent = err.message || "Import failed."; }
      });
    };
    reader.readAsText(file);
  });
}

// Upload a Rethink bi-weekly payroll export (.xlsx) → auto-create a timecard
// per employee, preview matches, then send each staff member a signature link.
function openPayrollImportModal(pageMount) {
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML = `
    <div class="modal" style="width:680px;">
      <div class="modal-header"><h2>Import Payroll Export → Timecards</h2><button class="close-btn">✕</button></div>
      <p style="font-size:13px; color:var(--text-muted); margin-top:0;">Upload the bi-weekly <strong>Rethink payroll export</strong> (the <code>.xlsx</code> file). A timecard is built for each staff member from their shifts — <strong>hours only, no pay</strong> — then you can send everyone a link to review, edit, and sign.</p>
      <input type="file" id="payroll-file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
      <div id="payroll-status" style="font-size:12.5px; margin-top:10px; color:var(--text-muted);"></div>
      <div id="payroll-preview" style="margin-top:12px;"></div>
    </div>`;
  document.body.appendChild(backdrop);
  const close = () => backdrop.remove();
  backdrop.querySelector(".close-btn").addEventListener("click", close);
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) close(); });

  const statusEl = backdrop.querySelector("#payroll-status");
  const previewEl = backdrop.querySelector("#payroll-preview");

  backdrop.querySelector("#payroll-file").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    statusEl.textContent = "Reading & parsing the export…";
    previewEl.innerHTML = "";
    const reader = new FileReader();
    reader.onload = async () => {
      const b64 = String(reader.result).split(",")[1];
      try {
        const res = await api("/api/hr/payroll/import", { method: "POST", body: { filename: file.name, content_base64: b64 } });
        renderPreview(res);
      } catch (err) { statusEl.textContent = err.message || "Could not import."; }
    };
    reader.readAsDataURL(file);
  });

  function renderPreview(res) {
    statusEl.textContent = "";
    const split = res.has_appt_type;
    const rows = (res.employees || []).map((emp) => {
      const badge = !emp.matched
        ? `<span class="tag" style="background:#fee2e2; color:#991b1b;">no staff match</span>`
        : (!emp.has_email ? `<span class="tag" style="background:#fef3c7; color:#92400e;">no email</span>` : `<span class="tag" style="background:#dcfce7; color:#166534;">ready</span>`);
      const splitCells = split
        ? `<td style="padding:6px 8px; border-top:1px solid var(--border,#eee); text-align:right; color:#1b2a6b;">${emp.billable_hours ?? 0}</td>
           <td style="padding:6px 8px; border-top:1px solid var(--border,#eee); text-align:right; color:#92400e;">${emp.non_billable_hours ?? 0}</td>`
        : "";
      return `<tr>
        <td style="padding:6px 8px; border-top:1px solid var(--border,#eee);">${staffEsc(emp.name)}</td>
        ${splitCells}
        <td style="padding:6px 8px; border-top:1px solid var(--border,#eee); text-align:right;"><strong>${emp.total_hours}</strong></td>
        <td style="padding:6px 8px; border-top:1px solid var(--border,#eee); text-align:right;">${emp.shifts}</td>
        <td style="padding:6px 8px; border-top:1px solid var(--border,#eee);">${badge}</td>
      </tr>`;
    }).join("");
    const warn = [];
    if (res.unmatched && res.unmatched.length) warn.push(`<div style="color:#991b1b; font-size:12.5px; margin-top:6px;">⚠ ${res.unmatched.length} employee(s) had no matching staff record (import them first / set their Rethink ID): ${staffEsc(res.unmatched.join(", "))}</div>`);
    if (res.no_email && res.no_email.length) warn.push(`<div style="color:#92400e; font-size:12.5px; margin-top:6px;">⚠ ${res.no_email.length} matched staff have no email on file and won't receive a link: ${staffEsc(res.no_email.join(", "))}</div>`);
    if (!split) warn.push(`<div style="color:#92400e; font-size:12.5px; margin-top:6px;">⚠ This export has no <strong>Appt Type</strong> column, so billable and non-billable hours can't be separated. Re-export from Rethink with that column included if you need the split.</div>`);
    if (split && res.unclassified_hours) warn.push(`<div style="color:#92400e; font-size:12.5px; margin-top:6px;">⚠ ${res.unclassified_hours} hour(s) have an appointment type that's neither Billable nor Non-Billable. They're shown separately as "not labeled" — you can relabel them on the review screen.</div>`);
    const totalsStrip = split
      ? `<div style="display:flex; gap:8px; margin-bottom:10px;">
           ${miniStat("Billable", res.billable_hours, "#1b2a6b", "#eef1fb")}
           ${miniStat("Non-billable", res.non_billable_hours, "#92400e", "#fdf4e6")}
           ${res.unclassified_hours ? miniStat("Not labeled", res.unclassified_hours, "#6b6a86", "#f1f1f4") : ""}
           ${miniStat("Total", res.total_hours ?? (res.employees || []).reduce((s, e) => s + (Number(e.total_hours) || 0), 0), "#166534", "#e9f9ee")}
         </div>` : "";
    previewEl.innerHTML = `
      <div style="font-size:13px; margin-bottom:8px;">Pay period <strong>${staffEsc(res.pay_period_start || "")} – ${staffEsc(res.pay_period_end || "")}</strong> · ${res.matched}/${res.total_employees} matched to staff. Timecards created — <strong>nothing has been emailed yet</strong>.</div>
      ${totalsStrip}
      <div style="max-height:240px; overflow:auto; border:1px solid var(--border,#eee); border-radius:8px;">
        <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
          <thead><tr style="text-align:left; color:var(--text-muted); text-transform:uppercase; font-size:11px;">
            <th style="padding:6px 8px;">Staff</th>
            ${split ? `<th style="padding:6px 8px; text-align:right;">Billable</th><th style="padding:6px 8px; text-align:right;">Non-bill.</th>` : ""}
            <th style="padding:6px 8px; text-align:right;">Total</th><th style="padding:6px 8px; text-align:right;">Shifts</th><th style="padding:6px 8px;">Status</th>
          </tr></thead><tbody>${rows}</tbody>
        </table>
      </div>
      ${warn.join("")}
      <div style="margin-top:14px; display:flex; gap:8px; align-items:center;">
        <button class="btn" id="payroll-review" ${res.matched ? "" : "disabled"}>Preview &amp; send ${res.matched} timecard(s) →</button>
        <button class="btn secondary" id="payroll-done">Close</button>
      </div>`;
    previewEl.querySelector("#payroll-done").addEventListener("click", () => { close(); renderStaff(pageMount); });
    previewEl.querySelector("#payroll-review").addEventListener("click", () => {
      close();
      openTimecardReviewModal({
        ids: res.timecard_ids || (res.employees || []).filter((e) => e.timecard_id).map((e) => e.timecard_id),
        payPeriodEnd: res.pay_period_end,
        pageMount,
      });
    });
  }
}

function miniStat(label, value, color, bg) {
  return `<div style="flex:1; background:${bg}; border-radius:10px; padding:8px 10px; text-align:center;">
    <div style="font-size:18px; font-weight:700; color:${color}; line-height:1.15;">${Math.round((Number(value) || 0) * 100) / 100}</div>
    <div style="font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.4px;">${label}</div>
  </div>`;
}

// Review every timecard before a single email goes out: expand anyone to see
// their shifts split into billable / non-billable, fix hours or a mislabeled
// appointment type in place, uncheck whoever isn't ready, then send only the
// ones still checked. Nothing here sends until the Send button is pressed.
async function openTimecardReviewModal({ ids, payPeriodEnd, pageMount }) {
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML = `
    <div class="modal" style="width:860px;">
      <div class="modal-header">
        <div>
          <h2>Review timecards before sending</h2>
          <p style="font-size:12.5px; color:var(--text-muted); margin:4px 0 0;">Nothing is emailed until you press Send. Uncheck anyone who isn't ready.</p>
        </div>
        <button class="close-btn">✕</button>
      </div>
      <div id="tcr-body" style="font-size:13px; color:var(--text-muted);">Loading timecards…</div>
    </div>`;
  document.body.appendChild(backdrop);
  const close = () => backdrop.remove();
  backdrop.querySelector(".close-btn").addEventListener("click", close);
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) close(); });
  const bodyEl = backdrop.querySelector("#tcr-body");

  let data = null;
  const picked = new Set();
  const openRows = new Set();
  const dirty = new Map(); // timecard id -> Map(entryIndex -> {hours?, appt_type?})

  try {
    data = await api("/api/hr/timecards/preview-batch", {
      method: "POST",
      body: ids && ids.length ? { ids } : { pay_period_end: payPeriodEnd },
    });
  } catch (e) {
    bodyEl.innerHTML = `<div style="color:#991b1b;">${staffEsc(e.message || "Could not load the preview.")}</div>`;
    return;
  }
  (data.timecards || []).forEach((tc) => { if (tc.has_email && tc.status !== "accepted") picked.add(tc.id); });
  render();

  function hoursOf(tc, entryIndex, fallback) {
    const d = dirty.get(tc.id);
    const patch = d && d.get(entryIndex);
    return patch && patch.hours !== undefined ? patch.hours : fallback;
  }
  function typeOf(tc, entryIndex, fallback) {
    const d = dirty.get(tc.id);
    const patch = d && d.get(entryIndex);
    return patch && patch.appt_type !== undefined ? patch.appt_type : fallback;
  }
  // Recompute a person's split from what's on screen, so subtotals move as you
  // type instead of waiting for a save.
  function liveTotals(tc) {
    const t = { billable: 0, non_billable: 0, unclassified: 0, total: 0 };
    (tc.entries || []).forEach((e, i) => {
      const h = Number(hoursOf(tc, i, e.hours)) || 0;
      const cls = classifyBillableClient(typeOf(tc, i, e.appt_type));
      t.total += h;
      if (cls === true) t.billable += h; else if (cls === false) t.non_billable += h; else t.unclassified += h;
    });
    Object.keys(t).forEach((k) => { t[k] = Math.round(t[k] * 100) / 100; });
    return t;
  }

  function render() {
    const list = data.timecards || [];
    const grand = list.reduce((acc, tc) => {
      const t = liveTotals(tc);
      return { b: acc.b + t.billable, n: acc.n + t.non_billable, u: acc.u + t.unclassified, tot: acc.tot + t.total };
    }, { b: 0, n: 0, u: 0, tot: 0 });
    const anySplit = list.some((tc) => tc.has_split);

    bodyEl.innerHTML = `
      <div style="display:flex; gap:8px; margin-bottom:12px;">
        ${anySplit ? miniStat("Billable", grand.b, "#1b2a6b", "#eef1fb") : ""}
        ${anySplit ? miniStat("Non-billable", grand.n, "#92400e", "#fdf4e6") : ""}
        ${grand.u ? miniStat("Not labeled", grand.u, "#6b6a86", "#f1f1f4") : ""}
        ${miniStat("Total hours", grand.tot, "#166534", "#e9f9ee")}
        ${miniStat("Staff", list.length, "#334155", "#f1f5f9")}
      </div>
      <div style="display:flex; gap:10px; align-items:center; margin-bottom:8px; font-size:12.5px;">
        <label style="display:flex; gap:6px; align-items:center; cursor:pointer;">
          <input type="checkbox" id="tcr-all" ${picked.size === sendableIds().length && picked.size ? "checked" : ""}/> Select all sendable
        </label>
        <span style="color:var(--text-muted);">${picked.size} of ${list.length} selected</span>
      </div>
      <div id="tcr-list" style="max-height:400px; overflow:auto; border:1px solid var(--border,#eee); border-radius:10px;">
        ${list.map(rowHtml).join("") || `<div style="padding:16px; color:var(--text-muted);">No timecards found for this pay period.</div>`}
      </div>
      <div style="margin-top:14px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <button class="btn" id="tcr-send" ${picked.size ? "" : "disabled"}>Send ${picked.size} timecard(s)</button>
        <button class="btn secondary" id="tcr-close">Close without sending</button>
        <span id="tcr-status" style="font-size:12.5px; color:var(--text-muted);"></span>
      </div>`;
    wire();
  }

  function sendableIds() {
    return (data.timecards || []).filter((tc) => tc.has_email && tc.status !== "accepted").map((tc) => tc.id);
  }

  function rowHtml(tc) {
    const t = liveTotals(tc);
    const sendable = tc.has_email && tc.status !== "accepted";
    const badges = [];
    if (!tc.has_email) badges.push(`<span class="tag" style="background:#fee2e2; color:#991b1b;">no email</span>`);
    if (tc.status === "accepted") badges.push(`<span class="tag" style="background:#dcfce7; color:#166534;">already signed</span>`);
    if (tc.already_sent_at && tc.status !== "accepted") badges.push(`<span class="tag" style="background:#e0e7ff; color:#3730a3;">already sent — this resends</span>`);
    if (tc.open_flags) badges.push(`<span class="tag" style="background:#fef3c7; color:#92400e;">⚠ ${tc.open_flags} flag(s)</span>`);
    if (t.unclassified) badges.push(`<span class="tag" style="background:#f1f1f4; color:#4b5563;">${t.unclassified}h not labeled</span>`);
    if (dirty.get(tc.id) && dirty.get(tc.id).size) badges.push(`<span class="tag" style="background:#fef9c3; color:#854d0e;">unsaved edits</span>`);
    const open = openRows.has(tc.id);
    return `
      <div data-tcrow="${tc.id}" style="border-bottom:1px solid var(--border,#eee);">
        <div style="display:flex; align-items:center; gap:10px; padding:9px 12px;">
          <input type="checkbox" class="tcr-pick" data-id="${tc.id}" ${picked.has(tc.id) ? "checked" : ""} ${sendable ? "" : "disabled"}/>
          <div style="flex:1; min-width:0;">
            <div style="font-size:13px; font-weight:600;">${staffEsc(tc.employee_name || "Unknown")}</div>
            <div style="font-size:11.5px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${staffEsc(tc.employee_email || "no email on file")} · ${tc.shifts} shift(s)</div>
          </div>
          <div style="text-align:right; font-size:12px; white-space:nowrap;">
            ${tc.has_split || t.unclassified ? `<span style="color:#1b2a6b; font-weight:600;">${t.billable}</span> <span style="color:var(--text-muted);">bill</span> · <span style="color:#92400e; font-weight:600;">${t.non_billable}</span> <span style="color:var(--text-muted);">non</span> · ` : ""}
            <strong>${t.total}</strong> <span style="color:var(--text-muted);">hrs</span>
          </div>
          <button class="btn secondary" data-tctoggle="${tc.id}" style="padding:4px 10px; font-size:12px;">${open ? "Hide" : "Details"}</button>
        </div>
        <div style="padding:0 12px 8px 40px;">${badges.join(" ")}</div>
        ${open ? detailHtml(tc) : ""}
      </div>`;
  }

  function detailHtml(tc) {
    const groups = { b: [], n: [], u: [] };
    (tc.entries || []).forEach((e, i) => {
      const cls = classifyBillableClient(typeOf(tc, i, e.appt_type));
      groups[cls === true ? "b" : cls === false ? "n" : "u"].push({ e, i });
    });
    const t = liveTotals(tc);
    const section = (title, rows, subtotal, color) => {
      if (!rows.length) return "";
      return `
        <div style="margin:10px 0 0;">

            <thead><tr style="color:var(--text-muted); text-align:left; font-size:10.5px; text-transform:uppercase;">
              <th style="padding:4px 6px;">Date</th><th style="padding:4px 6px;">Scheduled</th><th style="padding:4px 6px;">Clocked</th>
              <th style="padding:4px 6px; width:80px;">Hours</th><th style="padding:4px 6px; width:130px;">Type</th>
            </tr></thead>
            <tbody>${rows.map(({ e, i }) => entryRow(tc, e, i)).join("")}</tbody>
            <tfoot><tr><td colspan="3" style="padding:6px; text-align:right; color:var(--text-muted); font-size:11px; text-transform:uppercase;">Subtotal</td>
              <td style="padding:6px; font-weight:700; color:${color};">${subtotal}</td><td></td></tr></tfoot>
          </table>
        </div>`;
    };
    const isDirty = dirty.get(tc.id) && dirty.get(tc.id).size;
    return `
      <div style="padding:2px 12px 14px 40px; background:#fbfbfd;">
        ${section("Billable", groups.b, t.billable, "#1b2a6b")}
        ${section("Non-billable", groups.n, t.non_billable, "#92400e")}
        ${section("Not labeled", groups.u, t.unclassified, "#6b6a86")}
        <div style="margin-top:10px; display:flex; gap:8px; align-items:center;">

          <button class="btn secondary" data-tcemail="${tc.id}" style="padding:5px 12px; font-size:12px;">✉ Preview their email</button>

  function entryRow(tc, e, i) {
    const h = hoursOf(tc, i, e.hours);
    const type = typeOf(tc, i, e.appt_type) || "";
    const clocked = `${prettyTimeClient(e.clock_in)} – ${prettyTimeClient(e.clock_out)}`;

    return `<tr>
      <td style="padding:4px 6px; border-top:1px solid var(--border,#eee);"><strong>${staffEsc(e.date || "—")}</strong>${alert}</td>
      <td style="padding:4px 6px; border-top:1px solid var(--border,#eee); color:var(--text-muted);">${staffEsc(e.scheduled || "—")}</td>
      <td style="padding:4px 6px; border-top:1px solid var(--border,#eee); color:var(--text-muted);">${staffEsc(clocked)}</td>
      <td style="padding:4px 6px; border-top:1px solid var(--border,#eee);">
        <input type="number" step="0.01" min="0" max="24" value="${h}" data-tchours="${tc.id}" data-i="${i}" style="width:70px; padding:3px 5px; font-size:12px;"/>
      </td>
      <td style="padding:4px 6px; border-top:1px solid var(--border,#eee);">
        <select data-tctype="${tc.id}" data-i="${i}" style="width:120px; padding:3px 5px; font-size:12px;">
          <option value="Billable" ${classifyBillableClient(type) === true ? "selected" : ""}>Billable</option>
          <option value="Non-Billable" ${classifyBillableClient(type) === false ? "selected" : ""}>Non-Billable</option>
          <option value="${staffEsc(type)}" ${classifyBillableClient(type) === null ? "selected" : ""}>${type ? staffEsc(type) : "— not labeled —"}</option>
        </select>
      </td>
    </tr>`;
  }

  function markDirty(id, i, patch) {
    if (!dirty.has(id)) dirty.set(id, new Map());
    const m = dirty.get(id);
    m.set(i, Object.assign({}, m.get(i) || {}, patch));
  }

  function wire() {
    const all = bodyEl.querySelector("#tcr-all");
    if (all) all.addEventListener("change", () => {
      picked.clear();
      if (all.checked) sendableIds().forEach((id) => picked.add(id));
      render();
    });
    bodyEl.querySelectorAll(".tcr-pick").forEach((cb) => cb.addEventListener("change", () => {
      const id = Number(cb.getAttribute("data-id"));
      if (cb.checked) picked.add(id); else picked.delete(id);
      render();
    }));
    bodyEl.querySelectorAll("[data-tctoggle]").forEach((b) => b.addEventListener("click", () => {
      const id = Number(b.getAttribute("data-tctoggle"));
      if (openRows.has(id)) openRows.delete(id); else openRows.add(id);
      render();
    }));
    bodyEl.querySelectorAll("[data-tchours]").forEach((inp) => inp.addEventListener("change", () => {
      const id = Number(inp.getAttribute("data-tchours"));
      markDirty(id, Number(inp.getAttribute("data-i")), { hours: Math.round((parseFloat(inp.value) || 0) * 100) / 100 });
      render();
    }));
    bodyEl.querySelectorAll("[data-tctype]").forEach((sel) => sel.addEventListener("change", () => {
      const id = Number(sel.getAttribute("data-tctype"));
      markDirty(id, Number(sel.getAttribute("data-i")), { appt_type: sel.value });
      render();
    }));
    bodyEl.querySelectorAll("[data-tcsave]").forEach((b) => b.addEventListener("click", () => saveEdits(Number(b.getAttribute("data-tcsave")))));
    bodyEl.querySelectorAll("[data-tcemail]").forEach((b) => b.addEventListener("click", () => previewEmail(Number(b.getAttribute("data-tcemail")))));
    const closeBtn = bodyEl.querySelector("#tcr-close");
    if (closeBtn) closeBtn.addEventListener("click", () => { close(); if (pageMount) renderStaff(pageMount); });
    const sendBtn = bodyEl.querySelector("#tcr-send");
    if (sendBtn) sendBtn.addEventListener("click", doSend);
  }

  async function saveEdits(id) {
    const m = dirty.get(id);
    const statusEl2 = bodyEl.querySelector(`[data-tcsavestatus="${id}"]`);
    if (!m || !m.size) return;
    const updates = Array.from(m.entries()).map(([i, patch]) => Object.assign({ i }, patch));
    if (statusEl2) statusEl2.textContent = "Saving…";
    try {
      const r = await api(`/api/hr/timecards/${id}/entries`, { method: "POST", body: { updates } });
      const tc = (data.timecards || []).find((x) => x.id === id);
      if (tc && r.entries) {
        tc.entries = r.entries;
        tc.has_split = r.has_split;
        tc.open_flags = r.flag_count || 0;
      }
      dirty.delete(id);
      render();
      const after = bodyEl.querySelector(`[data-tcsavestatus="${id}"]`);
      if (after) after.textContent = `Saved ${r.changed} change(s) ✓`;
    } catch (e) {
      if (statusEl2) statusEl2.textContent = e.message || "Save failed.";
    }
  }

  async function previewEmail(id) {
    const host = bodyEl.querySelector(`[data-tcemailframe="${id}"]`);
    if (!host) return;
    if (host.dataset.loaded === "1") { host.innerHTML = ""; host.dataset.loaded = ""; return; }
    host.innerHTML = `<div style="font-size:12px; color:var(--text-muted); margin-top:8px;">Loading email preview…</div>`;
    try {
      const p = await api(`/api/hr/timecards/${id}/preview`);
      host.innerHTML = `
        <div style="margin-top:10px; border:1px solid var(--border,#eee); border-radius:8px; overflow:hidden;">
          <div style="padding:6px 10px; background:#f8fafc; font-size:11.5px; color:var(--text-muted);">
            To: <strong>${staffEsc(p.employee_email || "—")}</strong> · Subject: ${staffEsc(p.subject || "")}
          </div>
          <iframe style="width:100%; height:340px; border:none;"></iframe>
        </div>`;
      const frame = host.querySelector("iframe");
      frame.contentDocument.open();
      frame.contentDocument.write(p.email_html || "");
      frame.contentDocument.close();
      host.dataset.loaded = "1";
    } catch (e) {
      host.innerHTML = `<div style="font-size:12px; color:#991b1b; margin-top:8px;">${staffEsc(e.message || "Could not load the email preview.")}</div>`;
    }
  }

  async function doSend() {
    const unsaved = Array.from(dirty.entries()).filter(([id, m]) => m.size && picked.has(id));
    if (unsaved.length && !confirm(`${unsaved.length} selected timecard(s) have unsaved edits. Those edits will NOT be included. Send anyway?`)) return;
    const ids = Array.from(picked);
    if (!ids.length) return;
    if (!confirm(`Email ${ids.length} timecard(s) for signature? Each person gets their own private link.`)) return;
    const btn = bodyEl.querySelector("#tcr-send");
    const st = bodyEl.querySelector("#tcr-status");
    btn.disabled = true;
    st.textContent = "Sending…";
    try {
      const r = await api("/api/hr/timecards/send", { method: "POST", body: { ids } });
      st.textContent = `Sent ${r.sent}${r.skipped && r.skipped.length ? ` · ${r.skipped.length} skipped (no email): ${r.skipped.join(", ")}` : ""} ✓`;
      btn.textContent = "Sent ✓";
    } catch (e) {
      btn.disabled = false;
      st.textContent = e.message || "Send failed.";
    }
  }
}

// Same rule as classifyBillable() on the server: "Non-Billable" is tested
// before "Billable" so it can't be swallowed by the looser match.
function classifyBillableClient(apptType) {
  const s = String(apptType == null ? "" : apptType).trim();
  if (!s) return null;
  if (/non[-_\s]*billable/i.test(s)) return false;
  if (/billable/i.test(s)) return true;
  return null;
}

function prettyTimeClient(v) {
  if (!v) return "—";
  const d = new Date(v);
  if (isNaN(d.getTime())) return String(v);
  let h = d.getHours();
  const m = d.getMinutes();
  const ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2, "0")} ${ap}`;
}

function adminEsc(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

        sn.innerHTML = `<strong style="color:#b91c1c;">SignNow isn't connected on the server yet, so the packet can't send.</strong>`;
      } else if (!settings.signnow_newhire_template_id && !settings.signnow_newhire_env_default) {
        sn.innerHTML = `<strong style="color:#92400e;">No template set yet — the automation is off until you add one.</strong>`;
      } else {
        sn.innerHTML = `<strong style="color:#166534;">Connected and ready.</strong>`;
      }
    }
  } catch (e) {}
  const wireSetting = (btnId, inputId, key) => {
    const btn = mount.querySelector("#" + btnId);
    if (!btn) return;
    btn.addEventListener("click", async () => {
      const val = mount.querySelector("#" + inputId).value.trim();
      btn.disabled = true;
      try {
        await api("/api/admin/settings", { method: "PATCH", body: { [key]: val } });
        btn.textContent = "Saved ✓";
        setTimeout(() => (btn.textContent = "Save"), 1500);
      } catch (e) { alert(e.message || "Could not save."); }
      finally { btn.disabled = false; }
    });
  };
  wireSetting("save-elig-email", "elig-email", "eligibility_check_email");
  wireSetting("save-screener-email", "screener-email", "screener_completed_recipient");
  wireSetting("save-owner-email", "owner-email", "owner_notification_email");
  wireSetting("save-cd-email", "cd-email", "clinical_director_email");
  wireSetting("save-digest-to", "digest-to", "completion_digest_recipients");
  wireSetting("save-att-review-to", "att-review-to", "attendance_review_recipients");
  wireSetting("save-sched-req-to", "sched-req-to", "schedule_request_recipients");
  wireSetting("save-digest-hour", "digest-hour", "completion_digest_hour");
  wireSetting("save-newhire-template", "newhire-template", "signnow_newhire_template_id");
  wireSetting("save-cred-bcba", "cred-bcba", "credentialing_link_bcba");
  wireSetting("save-cred-rbt", "cred-rbt", "credentialing_link_rbt");
  wireSetting("save-dress-code", "dress-code", "first_day_dress_code");
  wireSetting("save-dojo-link", "dojo-link", "class_dojo_link");
  wireSetting("save-rethink-url", "rethink-url", "rethink_app_url");
  const shirtBtn = mount.querySelector("#save-shirts");
  if (shirtBtn) shirtBtn.addEventListener("click", async () => {
    shirtBtn.disabled = true;
    try {
      await api("/api/admin/settings", { method: "PATCH", body: {
        shirt_count_full_time: mount.querySelector("#shirt-ft").value.trim(),
        shirt_count_part_time: mount.querySelector("#shirt-pt").value.trim(),
      }});
      shirtBtn.textContent = "Saved ✓";
      setTimeout(() => (shirtBtn.textContent = "Save"), 1500);
    } catch (e) { alert(e.message || "Could not save."); }
    finally { shirtBtn.disabled = false; }
  });
  wireBipImport(mount);

  // The sidebar's own order. Started from here rather than from a button
  // living under the navigation itself; the drag bar still appears in the
  // sidebar once it is on, because that is the thing being dragged.
  const reorderBtn = mount.querySelector("#admin-nav-reorder");
  if (reorderBtn) reorderBtn.addEventListener("click", () => {
    state.navReorder = true;
    location.hash = "#/dashboard";
    route();
  });

  await renderTeamSection(mount);
}

// ---- BIP import: preview, confirm each match, then commit -------------
// Extraction happens outside the CRM (the CRM holds no Google credentials).
// This takes the resulting file, asks the server to match each plan against
// real client records, and shows every match for confirmation before saving.
function wireBipImport(mount) {
  const btn = mount.querySelector("#bip-import-btn");
  if (!btn) return;
  const status = mount.querySelector("#bip-import-status");
  const panel = mount.querySelector("#bip-import-preview");
  let previewed = [];

  btn.addEventListener("click", () => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".json,application/json";
    inp.addEventListener("change", async () => {
      const f = inp.files[0]; if (!f) return;
      status.textContent = "Reading " + f.name + "…";
      try {
        const text = await f.text();
        const parsed = JSON.parse(text);
        const imports = Array.isArray(parsed) ? parsed : parsed.imports;
        if (!Array.isArray(imports) || !imports.length) throw new Error("That file has no plans in it.");
        const r = await api("/api/bip/import/preview", { method: "POST", body: { imports } });
        previewed = r.items;
        status.textContent = `${r.summary.total} plan(s): ${r.summary.would_create} ready to import, ${r.summary.needs_match} need a client, ${r.summary.would_skip} already have a BIP.`;
        drawPreview();
      } catch (e) { status.textContent = e.message; panel.innerHTML = ""; }
    });
    inp.click();
  });

  function drawPreview() {
    if (!previewed.length) { panel.innerHTML = ""; return; }
    panel.innerHTML = previewed.map((it, i) => {
      const m = it.match;
      const tone = it.existing_bip ? "#946213" : m && m.confidence === "confident" ? "#177a3c" : m ? "#946213" : "#a3282e";
      const label = it.existing_bip ? "Already has a BIP — will skip"
        : m && m.confidence === "confident" ? "Confident match"
        : m ? "Please confirm this match" : "No match found";
      const opts = (it.alternatives || []).map((a) =>
        `<option value="${a.client_id}" ${m && m.client_id === a.client_id ? "selected" : ""}>${adminEsc(a.child_name)} — ${a.reasons.join(", ")}</option>`).join("");
      return `<div style="border:1px solid var(--border,#e5e7eb); border-left:3px solid ${tone}; border-radius:12px; padding:12px 14px; margin-bottom:9px;">
        <div style="display:flex; gap:9px; align-items:center; flex-wrap:wrap;">
          <strong style="font-size:13.5px;">${adminEsc(it.source_name || "Untitled plan")}</strong>
          <span style="background:${tone}1a; color:${tone}; border-radius:999px; padding:2px 9px; font-size:11px; font-weight:700;">${label}</span>
        </div>
        <div style="font-size:12.5px; color:var(--text-muted); margin-top:5px;">
          Found ${it.found.target_behaviors} target behavior(s), ${it.found.operational_definitions} definition(s),
          ${it.found.prevention_strategies} prevention strateg(ies), ${it.found.response_strategies} response strateg(ies).
          ${it.found.functions ? "" : "No hypothesized functions in the source — those stay blank."}
        </div>
        ${(it.warnings || []).length ? `<div style="font-size:12px; color:#946213; margin-top:5px;">${it.warnings.map(adminEsc).join("<br>")}</div>` : ""}
        <div style="margin-top:8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <label style="font-size:12.5px;">Client:</label>
          <select data-imp="${i}" ${it.existing_bip ? "disabled" : ""} style="font-size:12.5px; min-width:280px;">
            <option value="">— choose a client —</option>${opts}
          </select>
          <button class="btn small secondary" data-imp-view="${i}">See what will be imported</button>
        </div>
        <div id="imp-detail-${i}" style="display:none; margin-top:9px; background:var(--bg,#f7f8fb); border-radius:9px; padding:10px 12px; font-size:12.5px; max-height:260px; overflow:auto;">
          ${it.behaviors.map((b) => `<div style="margin-bottom:8px;">
            <strong>${adminEsc(b.name)}</strong>
            <div style="color:var(--text-muted); white-space:pre-wrap; margin-top:2px;">${adminEsc((b.operational_definition || "Not documented").slice(0, 260))}</div>
          </div>`).join("") || "<em>Nothing readable in this document.</em>"}
        </div>
      </div>`;
    }).join("") + `<div style="display:flex; gap:8px; align-items:center; margin-top:10px;">
        <button class="btn" id="imp-commit">Import the confirmed plans</button>
        <span id="imp-commit-status" style="font-size:12.5px; color:var(--text-muted);"></span>
      </div>`;

    panel.querySelectorAll("[data-imp-view]").forEach((b) => b.addEventListener("click", () => {
      const el = panel.querySelector("#imp-detail-" + b.dataset.impView);
      el.style.display = el.style.display === "none" ? "block" : "none";
    }));
    panel.querySelector("#imp-commit").addEventListener("click", async () => {
      const payload = [];
      panel.querySelectorAll("[data-imp]").forEach((sel) => {
        const it = previewed[Number(sel.dataset.imp)];
        if (it.existing_bip || !sel.value) return;
        payload.push({ ...it, client_id: Number(sel.value) });
      });
      if (!payload.length) { panel.querySelector("#imp-commit-status").textContent = "Nothing selected to import."; return; }
      if (!confirm(`Import ${payload.length} plan(s)? Existing BIPs are never overwritten.`)) return;
      const st = panel.querySelector("#imp-commit-status");
      st.textContent = "Importing…";
      try {
        const r = await api("/api/bip/import/commit", { method: "POST", body: { imports: payload } });
        st.textContent = `Imported ${r.created.length} plan(s).` + (r.skipped.length ? ` Skipped ${r.skipped.length}.` : "");
        panel.innerHTML = `<div style="font-size:13px;">${r.created.map((c) => `Imported <strong>${adminEsc(c.client)}</strong> — ${c.behaviors} target behavior(s).`).join("<br>")}
          ${r.skipped.map((s2) => `<div style="color:#946213;">Skipped ${adminEsc(s2.client || s2.source || "")}: ${adminEsc(s2.reason)}</div>`).join("")}</div>`;
      } catch (e) { st.textContent = e.message; }
    });
  }
}

    <div style="overflow-x:auto;">

            <th style="padding:8px 10px; border-bottom:2px solid var(--border,#e5e7eb);"></th>

              <td style="padding:9px 10px; border-bottom:1px solid var(--border,#f0f0f3);">
                <div style="display:flex; align-items:center; gap:9px;">
                  ${window.StaffAvatar ? window.StaffAvatar.html(u.employee_id, u.name, { size: 30, hasPhoto: u.has_photo }) : ""}
                  <span>
                    <div><strong>${adminEsc(u.name)}</strong>${String(u.id) === String(state.user.id) ? ` <span class="tag">you</span>` : ""}</div>

              </td>
              <td style="padding:9px 10px; border-bottom:1px solid var(--border,#f0f0f3); white-space:nowrap;">

                <button class="btn small secondary" data-access-user="${u.id}">Access</button>

  body.querySelectorAll("[data-access-user]").forEach((btn) => {

      const id = btn.dataset.resetUser;

        await api(`/api/admin/users/${id}`, { method: "PATCH", body: { password: pw } });

  body.querySelectorAll("[data-viewas-user]").forEach((btn) =>
    btn.addEventListener("click", async () => {
      const id = btn.getAttribute("data-viewas-user");
      const row = body.querySelector(`[data-user-row="${id}"]`);

      btn.disabled = true;
      try {

        if (st) { st.style.color = "#b91c1c"; st.textContent = e.message; }
      }
    }));

  body.querySelectorAll("[data-delete-user]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.deleteUser;
      const row = body.querySelector(`[data-user-row="${id}"]`);
      const name = row ? row.querySelector("strong").textContent : "this user";
      if (!confirm(`Remove ${name}? They will no longer be able to sign in. This cannot be undone.`)) return;
      try {
        await api(`/api/admin/users/${id}`, { method: "DELETE" });
        await renderTeamSection(mount);
      } catch (e) {
        setStatus(e.message, false);
      }
    });
  });

  const addBtn = body.querySelector("#add-user-btn");
  addBtn.addEventListener("click", async () => {
    const name = body.querySelector("#new-user-name").value.trim();
    const email = body.querySelector("#new-user-email").value.trim();
    const password = body.querySelector("#new-user-password").value;
    const role = body.querySelector("#new-user-role").value;
    const deptVal = body.querySelector("#new-user-dept").value;
    const status = body.querySelector("#add-user-status");
    status.textContent = "";
    addBtn.disabled = true;
    try {
      await api("/api/admin/users", {
        method: "POST",
        body: { name, email, password, role, department_id: deptVal || null },
      });
      await renderTeamSection(mount);
    } catch (e) {
      status.textContent = e.message;
      status.style.color = "#b91c1c";
    } finally {
      addBtn.disabled = false;
    }
  });
}

// Granular per-user module access editor. Each module can be Default (role),
// On (granted), or Off (denied). Saves module_access to the user.
function openAccessModal(u, onDone) {
  const current = getModuleAccess(u) || {};
  const keys = Object.keys(MODULE_CATALOG);
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  const rowFor = (k) => {
    const v = current[k]; // true | false | undefined
    const sel = (val, label) => `<option value="${val}" ${String(v) === val || (val === "default" && v === undefined) ? "selected" : ""}>${label}</option>`;
    return `<div style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px solid var(--border,#f0f0f3);">
      <span style="font-size:13px;">${MODULE_CATALOG[k].icon} ${adminEsc(MODULE_CATALOG[k].label)}</span>
      <select data-mod="${k}" style="min-width:120px;">${sel("default", "Role default")}${sel("true", "On (grant)")}${sel("false", "Off (hide)")}</select>
    </div>`;
  };
  backdrop.innerHTML = `<div class="modal" style="width:520px; max-width:94vw;">
    <div class="modal-header"><h2 style="font-size:16px;">Access — ${adminEsc(u.name)}</h2><button class="close-btn">✕</button></div>
    <p style="font-size:12.5px; color:var(--text-muted); margin-top:0;">Fine-tune what <strong>${adminEsc(u.name)}</strong> can see. "Role default" uses their role's normal access; "On" grants a section; "Off" hides it. (Financials and other sensitive data still enforce their own rules server-side.)</p>
    <div style="max-height:52vh; overflow:auto;">${keys.map(rowFor).join("")}</div>
    <div style="margin-top:14px; display:flex; gap:8px;">
      <button class="btn" id="acc-save">Save access</button>
      <button class="btn secondary" id="acc-reset">Reset all to role default</button>
      <span id="acc-status" style="font-size:12.5px; color:var(--text-muted); align-self:center;"></span>
    </div>
  </div>`;
  document.body.appendChild(backdrop);
  const close = () => backdrop.remove();
  backdrop.querySelector(".close-btn").addEventListener("click", close);
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) close(); });
  const save = async (resetAll) => {
    let map = {};
    if (!resetAll) {
      backdrop.querySelectorAll("[data-mod]").forEach((sel) => {
        if (sel.value === "true") map[sel.dataset.mod] = true;
        else if (sel.value === "false") map[sel.dataset.mod] = false;
      });
    }
    backdrop.querySelector("#acc-status").textContent = "Saving…";
    try {
      await api(`/api/admin/users/${u.id}`, { method: "PATCH", body: { module_access: resetAll ? null : map } });
      backdrop.querySelector("#acc-status").textContent = "Saved ✓";
      setTimeout(() => { close(); if (onDone) onDone(); }, 700);
    } catch (e) { backdrop.querySelector("#acc-status").textContent = e.message || "Failed."; }
  };
  backdrop.querySelector("#acc-save").addEventListener("click", () => save(false));
  backdrop.querySelector("#acc-reset").addEventListener("click", () => save(true));
}
