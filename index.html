<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spectrum Squad — Client Pipeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Spectrum Squad brand palette, pulled from the logo */
  --brand-navy: #1b2a6b;
  --brand-navy-dark: #101c4d;
  --brand-navy-light: #edecf8;
  --brand-gold: #e0a430;
  --brand-gold-dark: #c98a1b;
  --brand-teal: #5fa8a0;
  --brand-teal-dark: #3f8f89;

  --brand: var(--brand-navy);
  --brand-dark: var(--brand-navy-dark);
  --brand-light: var(--brand-navy-light);
  --bg: #f7f8fb;
  --surface: #ffffff;
  --border: #e5e7eb;
  --text: #201a4d;
  --text-muted: #6b6a86;
  --success: #22c55e;
  --warning: var(--brand-gold);
  --danger: #ef4444;
  --radius: 12px;
  --shadow: 0 1px 3px rgba(41, 34, 92, 0.08), 0 1px 2px rgba(41, 34, 92, 0.05);
  --shadow-lg: 0 10px 30px rgba(41, 34, 92, 0.14);
  
}--font-header: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

* { box-sizing: border-box; }

body {
  margin: 0;
font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, .brand-word { font-family: var(--font-header); font-weight: 600; letter-spacing: -0.01em; }
a { color: inherit; }
button { font-family: inherit; cursor: pointer; }

/* ---------- Layout ---------- */
.app-shell { display: flex; min-height: 100vh; }

/* Viewing the CRM as somebody else. Deliberately loud and deliberately fixed
   to the top of the window: the failure this prevents is an owner forgetting
   whose screens they are looking at and reporting what they see as their own.
   The shell is padded down so nothing sits underneath it. */
.viewas-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  background: #7c2d12; color: #fff; font-size: 13px; font-weight: 600;
  padding: 9px 16px; display: flex; align-items: center; gap: 12px;
  flex-wrap: wrap; box-shadow: 0 2px 10px rgba(0,0,0,.18);
}
.viewas-bar .who { font-weight: 800; }
.viewas-bar .ro { font-weight: 500; opacity: .9; }
.viewas-bar button {
  margin-left: auto; background: #fff; color: #7c2d12; border: 0;
  border-radius: 999px; padding: 5px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer;
}
body.viewing-as .app-shell { padding-top: 40px; }

.sidebar {
  width: 240px;
  background: linear-gradient(180deg, var(--brand-navy) 0%, #2a3d8f 100%);
  color: #ded9f5;
  display: flex;
  flex-direction: column;
  padding: 24px 16px;
  flex-shrink: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 17px;
  color: #fff;
  padding: 0 8px 24px;
}
.brand-mark {
  width: 34px; height: 34px; border-radius: 10px;
  background: rgba(255,255,255,0.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 8px;
  color: #c7d2fe;
  font-size: 14px;
  font-weight: 500;
  text-decoration: none;
  margin-bottom: 2px;
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
}
.nav-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
/* An anchor rather than a button, so box-sizing and the flex baseline match
   the rows around it exactly. */
a.nav-item { box-sizing: border-box; }
/* The mark on an entry that LEAVES the CRM. Small, after the label, and dimmer
   than the text: it is a warning about where the click goes, not decoration. */
.nav-ext { margin-left: auto; font-size: 11px; opacity: 0.65; }
.nav-item:hover .nav-ext { opacity: 1; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
/* Reorder mode. The handle replaces the icon so the row reads as draggable
   rather than clickable, and the whole sidebar dims slightly so it is obvious
   you are arranging the menu rather than using it. */
.nav-item.nav-dragging-on { cursor: grab; opacity: 0.92; }
.nav-item.nav-drop-before { box-shadow: inset 0 2px 0 0 #fff; }
.nav-item.nav-drop-after { box-shadow: inset 0 -2px 0 0 #fff; }
.nav-reorder-open { margin: 6px 10px 0; padding: 7px 10px; width: calc(100% - 20px);
  background: rgba(255,255,255,0.08); color: #dfe4f5; border: 1px solid rgba(255,255,255,0.16);
  border-radius: 8px; font-size: 12.5px; cursor: pointer; }
.nav-reorder-open:hover { background: rgba(255,255,255,0.16); color: #fff; }
.nav-reorder-bar { margin: 8px 10px 0; padding: 9px 10px; background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.nav-reorder-hint { font-size: 11.5px; color: #cfd6ee; width: 100%; margin-bottom: 2px; line-height: 1.4; }
.nav-reorder-msg { font-size: 11.5px; color: #ffd9a8; width: 100%; }
.nav-item.active { background: rgba(255,255,255,0.18); color: #fff; }
/* Admin group. Five separate top-level entries (Settings plus four tools) now
   sit under one collapsible parent. The children are ordinary .nav-item
   buttons inside .sidebar nav, so everything that queries, restyles or
   removes nav items keeps working on them. */
.nav-chevron { margin-left: auto; font-size: 11px; opacity: .7; }
.nav-group.has-active { color: #fff; }
.nav-sub { margin: 0 0 4px 11px; padding-left: 7px; border-left: 2px solid rgba(255,255,255,0.14); }
.nav-sub .nav-item { font-size: 13.5px; padding: 8px 10px; }
.nav-count { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px;
  background: #5fa8a0; color: #fff; font-size: 11.5px; font-weight: 800; line-height: 20px; text-align: center;
  box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.nav-count.overdue { background: #ef4444; }
/* Personal Task Center */
.tc-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tc-tab { border: 1px solid var(--border,#e5e7eb); background: #fff; color: var(--text-muted,#6b7280);
  border-radius: 999px; padding: 6px 13px; font-size: 12.5px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.tc-tab:hover { border-color: #1b2a6b; color: #1b2a6b; }
.tc-tab.active { background: #1b2a6b; color: #fff; border-color: #1b2a6b; }
.tc-n { background: rgba(0,0,0,.12); border-radius: 999px; padding: 0 6px; font-size: 11px; min-width: 16px; text-align: center; }
.tc-tab.active .tc-n { background: rgba(255,255,255,.25); }
.tc-n.hot { background: #ef4444; color: #fff; }
.tc-row { display: flex; gap: 12px; align-items: flex-start; padding: 11px 12px; border: 1px solid var(--border,#e5e7eb);
  border-radius: 12px; margin-bottom: 8px; background: #fff; transition: box-shadow .12s ease; }
.tc-row:hover { box-shadow: 0 4px 14px rgba(30,35,60,.08); }
.tc-row.overdue { border-left: 4px solid #ef4444; }
.tc-check { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; border: 2px solid #cbd5e1; background: #fff;
  cursor: pointer; font-size: 14px; font-weight: 800; color: #fff; line-height: 1; transition: all .12s ease; }
.tc-check:hover { border-color: #22a565; background: #e9f7ef; }
.tc-check.done { background: #22a565; border-color: #22a565; cursor: default; }
.tc-main { flex: 1; min-width: 0; }
.tc-title { font-weight: 700; font-size: 14px; color: #201a4d; }
.tc-title.done { text-decoration: line-through; color: #9ca3af; }
.tc-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 5px; font-size: 12px; }
.tc-pill { border-radius: 999px; padding: 2px 9px; font-weight: 800; font-size: 11px; }
.tc-due { color: var(--text-muted,#6b7280); font-weight: 600; }
.tc-due.overdue { color: #b91c1c; font-weight: 800; }
.tc-client { color: #1b2a6b; text-decoration: none; font-weight: 700; }
.tc-client:hover { text-decoration: underline; }
.tc-reminded { color: #92400e; }
.tc-desc { margin-top: 5px; font-size: 12.5px; color: var(--text-muted,#6b7280); }

.sidebar-footer {
  margin-top: auto;
  padding: 12px 8px 0;
  border-top: 1px solid rgba(255,255,255,0.15);
}
.sidebar-user { font-size: 13px; color: #c7d2fe; margin-bottom: 8px; }
.sidebar-user strong { color: #fff; display: block; }
.logout-btn {
  background: rgba(255,255,255,0.1);
  border: none; color: #fff; padding: 8px 12px; border-radius: 8px;
  font-size: 13px; width: 100%;
}
.logout-btn:hover { background: rgba(255,255,255,0.2); }

.main {
  flex: 1;
  /* Without this the flex default of min-width:auto refuses to shrink below the
     widest thing inside, so a wide board (the pipeline's five columns) pushes
     the whole page wider than the window instead of scrolling inside its own
     container. Everything to the right of the fold then becomes unreachable --
     which is how the pipeline's waitlist filter, the last control in its filter
     row, went missing. */
  min-width: 0;
  padding: 28px 36px;
  max-width: 1400px;
}

.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}
.page-header h1 { font-size: 22px; margin: 0 0 4px; }
.page-header p { margin: 0; color: var(--text-muted); font-size: 14px; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--brand); color: #fff; border: none;
  padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
}
.btn:hover { background: var(--brand-dark); }
.btn.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn.secondary:hover { background: #f3f4f6; }
.btn.danger { background: var(--danger); }
.btn.small { padding: 6px 10px; font-size: 12px; }

/* ---------- Cards / Stats ---------- */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}
.stat-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.stat-card .label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
.stat-card .value { font-size: 30px; font-weight: 700; margin-top: 6px; }
.stat-card.warn .value { color: var(--warning); }
.stat-card.danger .value { color: var(--danger); }
.stat-card.clickable { cursor: pointer; }
.stat-card.clickable:hover { box-shadow: var(--shadow-lg); }

.card {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  padding: 20px;
}

/* ---------- Kanban Pipeline ---------- */
.kanban {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  padding-bottom: 12px;
}
.kanban-col {
  min-width: 260px;
  max-width: 260px;
  background: #f1f2f7;
  border-radius: var(--radius);
  padding: 12px;
  flex-shrink: 0;
  transition: background 0.12s;
}
.kanban-col.drag-over {
  background: #dfe2f5;
  outline: 2px dashed var(--brand);
  outline-offset: -2px;
}
.kanban-col-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px; padding: 0 4px;
}
.kanban-col-title { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.count-pill {
  background: rgba(0,0,0,0.06); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
}

.client-card {
  background: var(--surface);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 8px;
  box-shadow: var(--shadow);
  border-left: 4px solid var(--brand);
  cursor: pointer;
}
.client-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); transition: 0.12s; }
.client-card.dragging { opacity: 0.4; }
.client-card .name { font-weight: 700; font-size: 13.5px; }
.client-card .meta { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }
.client-card .tags { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.tag {
  font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px;
  background: var(--brand-light); color: var(--brand-dark);
}
.tag.overdue { background: #fee2e2; color: #b91c1c; }

/* ---------- Badges ---------- */
.badge {
  display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px;
  border-radius: 999px; color: #fff;
}

/* ---------- Authorization alert levels ---------- */
.alert-badge {
  display: inline-block; font-size: 10.5px; font-weight: 700; padding: 3px 9px;
  border-radius: 999px; color: #fff; text-transform: uppercase; letter-spacing: 0.02em;
}
.alert-badge.informational { background: #3f56b5; }
.alert-badge.attention { background: var(--brand-gold-dark); }
.alert-badge.urgent { background: #ea580c; }
.alert-badge.critical { background: #dc2626; }
.alert-badge.overdue { background: #7f1d1d; }
.alert-status-pill { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #eef0f5; color: var(--text-muted); }
.alert-status-pill.completed { background: #dcfce7; color: #166534; }
.alert-status-pill.renewal_started { background: #fef3c7; color: #92400e; }
.alert-status-pill.reopened { background: #fee2e2; color: #b91c1c; }

/* ---------- Tables ---------- */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--text-muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.02em; padding: 8px 10px; border-bottom: 1px solid var(--border); }
td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }

/* ---------- Forms ---------- */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
/* A set of related choices, laid out across the row instead of stacked one
   per line. Options that fit side by side sit side by side; on a narrow
   screen they wrap onto the next line rather than overflowing or squashing.
   `.opt-row` is for short labels (a handful of words); `.opt-grid` is for
   options that carry a line of explanation and therefore need a minimum
   width to stay readable. Neither changes what any option does. */
.opt-row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.opt-row > label, .opt-row > .opt { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; }
.opt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; align-items: start; }
.opt-grid > * { min-width: 0; }
/* One option inside .opt-grid: a bordered cell so a wrapped row still reads
   as a set of choices rather than loose text. */
.opt-card {
  display: flex; gap: 8px; align-items: flex-start; margin: 0;
  border: 1px solid var(--border, #e5e7eb); border-radius: 10px;
  padding: 9px 11px; font-size: 12.5px; cursor: pointer;
}
.opt-card:hover { background: var(--hover, #f8fafc); }
.opt-card input { flex: none; margin-top: 2px; width: auto; }
@media (max-width: 560px) {
  .opt-grid { grid-template-columns: 1fr; }
}
.field { display: flex; flex-direction: column; gap: 5px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
input, select, textarea {
  padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border);
  font-size: 13.5px; font-family: inherit; background: #fff;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand-light); border-color: var(--brand); }

/* ---------- Login ---------- */
.login-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--brand-navy) 0%, #2a3d8f 60%, var(--brand-teal) 100%);
}
.login-card {
  background: #fff; border-radius: 16px; padding: 40px 36px; width: 380px;
  box-shadow: var(--shadow-lg);
}
.login-card h1 { font-size: 20px; margin: 0 0 4px; }
.login-card p.sub { color: var(--text-muted); font-size: 13px; margin: 0 0 24px; }
.login-card .field { margin-bottom: 14px; }
.login-error { color: var(--danger); font-size: 12.5px; margin-bottom: 10px; }
.demo-hint { margin-top: 18px; font-size: 11.5px; color: var(--text-muted); background: var(--brand-light); padding: 10px 12px; border-radius: 8px; }

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(15,23,42,0.45); display: flex;
  align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto; z-index: 50;
}
.modal {
  background: #fff; border-radius: var(--radius); width: 720px; max-width: 100%;
  box-shadow: var(--shadow-lg); padding: 26px 28px; margin-bottom: 40px;
}
.modal-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
.modal-header h2 { margin: 0 0 4px; font-size: 19px; }
.close-btn { background: none; border: none; font-size: 20px; color: var(--text-muted); }

.section-title { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin: 20px 0 10px; }

/* Collapsible sections on the client card.
   The card had grown to eighteen sections stacked flat, every one of them
   fully expanded, so finding the BIP meant scrolling past the enrollment
   packet. These fold. Native <details> so keyboard and screen readers get the
   behaviour for free, and each closed header carries a status chip -- the
   point of collapsing is to see MORE at a glance, not less, so a section you
   have not opened still tells you where it stands. */
.cs { border: 1px solid var(--border, #e5e7eb); border-radius: 10px; margin: 8px 0; background: var(--card, #fff); }
.cs > summary {
  display: flex; align-items: center; gap: 9px; cursor: pointer; list-style: none;
  padding: 10px 13px; font-size: 13px; font-weight: 700; color: var(--text, #1f2430);
  border-radius: 10px; user-select: none;
}
.cs > summary::-webkit-details-marker { display: none; }
.cs > summary:hover { background: var(--hover, #f8fafc); }
.cs > summary::after {
  content: "⌄"; margin-left: auto; font-size: 15px; color: var(--text-muted);
  transition: transform .15s ease; line-height: 1;
}
.cs[open] > summary::after { transform: rotate(180deg); }
.cs[open] > summary { border-bottom: 1px solid var(--border, #e5e7eb); border-radius: 10px 10px 0 0; }
/* Section accent marker. Replaced the per-section emoji: same left rail and
   the same alignment, without decoration on a clinical record. */
.cs-ico {
  width: 4px; height: 14px; border-radius: 2px; flex: none;
  background: var(--brand-navy, #1b2a6b); opacity: .35;
}
.cs[open] > summary .cs-ico { opacity: .75; }
.cs-body { padding: 12px 13px 14px; }
/* Status chip on the header: state without opening the section. */
.cs-chip {
  font-size: 11px; font-weight: 700; letter-spacing: .01em; border-radius: 999px;
  padding: 2px 8px; margin-left: 2px; white-space: nowrap;
}
.cs-chip.ok   { background: #dcfce7; color: #166534; }
.cs-chip.warn { background: #fef3c7; color: #92400e; }
.cs-chip.bad  { background: #fee2e2; color: #991b1b; }
.cs-chip.none { background: #eef0f4; color: #5b6472; }
/* An explanation that used to be a paragraph. Same words, on hover, out of
   the way of somebody who already knows how the screen works. */
/* NAMED .hint-badge, NOT .hint. As ".hint" this 15px circle was styling every
   add-on that used the obvious class name for a line of explanatory text --
   the BCBA Hub's dialogs, HR, the attendance signature pad, the client forms
   page -- squashing a full sentence into a 15px box, where it wrapped one word
   per line and spilled down the side of the dialog. A generic class name in
   the shell's stylesheet reaches every bundle loaded beside it. */
.hint-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 15px; height: 15px; border-radius: 50%; font-size: 10.5px; font-weight: 700;
  background: #eef0f4; color: #5b6472; cursor: help; flex: none; margin-left: 5px;
}
.hint-badge:hover { background: #dfe3ea; color: #1f2430; }
/* And what the add-ons meant by it: a line of small print under a field. */
.hint { display: block; font-size: 11.5px; color: var(--text-muted, #6b6a86); margin-top: 3px; }

.task-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
.task-row:last-child { border-bottom: none; }
.task-row .info { font-size: 13px; }
.task-row .info .due { font-size: 11.5px; color: var(--text-muted); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.status-dot.pending { background: #cbd5e1; }
.status-dot.overdue { background: var(--danger); }
.status-dot.completed { background: var(--success); }

/* ---------- Schedule Grid ---------- */
.schedule-grid {
  display: grid;
  grid-template-columns: 70px repeat(7, 1fr);
  gap: 6px;
  margin-top: 16px;
}
.schedule-grid .day-head { font-size: 11px; font-weight: 700; text-align: center; color: var(--text-muted); padding: 6px 0; }

<body>
<div id="app"></div>
<script>
// public/js/app.js
// Vanilla JS single-page app. No build step, no framework, no CDN dependency.
"use strict";

const state = {
  user: null,
  // The admin-set sidebar order. Empty until loaded, and an empty order simply
  // means "natural order", so a failed load degrades to the built-in layout
  // rather than to an empty menu.
  navOrder: [],
  navOrderCanEdit: false,
  // Where the sidebar's Rethink shortcut points. Empty until /api/nav-order
  // answers, and an empty value draws no entry rather than a dead link.
  rethinkUrl: "",
  navReorder: false,
  clients: [],
  stages: [],
  departments: [],
  therapists: [],
};

const root = document.getElementById("app");

// ---------------- API helper ----------------
async function api(path, opts = {}) {
  const res = await fetch(path, {
    method: opts.method || "GET",
    headers: { "Content-Type": "application/json" },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401) {
    state.user = null;
    location.hash = "#/login";
    throw new Error("Not authenticated");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    // A write refused because the owner is looking at somebody else's account.
    // The server's message already says so; this keeps it from being mistaken
    // for a permission problem with the account being viewed, which is what a
    // bare 403 would look like.
    if (data.view_as_read_only) throw new Error(data.error);
    throw new Error(data.error || "Request failed");
  }
  return data;
}

const stageMap = () => Object.fromEntries(state.stages.map((s) => [s.key, s]));

function fmtDate(d) {
  if (!d) return "—";
  const date = new Date(d);
  if (isNaN(date)) return d;
  return date.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}

function initials(name) {
  return (name || "?").split(" ").map((p) => p[0]).slice(0, 2).join("").toUpperCase();
}

// Can this logged-in role see/edit authorization + insurance data at all?
function canViewAuth() {
  return state.user && ["owner", "super_admin", "admin", "billing", "clinical"].includes(state.user.role);
}
function canEditAuth() {
  return state.user && ["owner", "super_admin", "admin", "billing"].includes(state.user.role);
}

// Can this role see what the family owes and what their plan covers -- the
// Financial Obligation form and the Benefits & Eligibility Check?
//
// Mirrors BENEFITS_VIEW_ROLES on the server, which is where the actual control
// is: both routes refuse a request from anyone outside this list regardless of
// what the browser does. This only decides whether to draw the sections, so a
// BCBA or a scheduler isn't shown two panels that would 403 the moment they
// touched them.
function canViewBenefits() {
  return !!state.user && ["owner", "super_admin", "admin", "intake", "billing"].includes(state.user.role);
}

// ---------------- Small in-app prompt (replaces native window.prompt/confirm,
// which can hang or be blocked in some browser contexts) ----------------
function askReason(title, placeholder) {
  return new Promise((resolve) => {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = `
      <div class="modal" style="width:420px;">
        <div class="modal-header"><h2>${title}</h2><button class="close-btn">✕</button></div>
        <div class="field full">
          <label>${placeholder || "Notes (optional)"}</label>
          <textarea id="reason-input" rows="3" placeholder="Add a note..."></textarea>
        </div>
        <div style="margin-top:18px; display:flex; gap:8px; justify-content:flex-end;">
          <button type="button" class="btn secondary" id="reason-cancel">Cancel</button>
          <button type="button" class="btn" id="reason-confirm">Confirm</button>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);
    const input = backdrop.querySelector("#reason-input");
    input.focus();
    const finish = (val) => {
      backdrop.remove();
      resolve(val);
    };
    backdrop.querySelector(".close-btn").addEventListener("click", () => finish(null));
    backdrop.querySelector("#reason-cancel").addEventListener("click", () => finish(null));
    backdrop.querySelector("#reason-confirm").addEventListener("click", () => finish(input.value || ""));
    backdrop.addEventListener("click", (e) => {
      if (e.target === backdrop) finish(null);
    });
  });
}
function askPassword(title) {
  return new Promise((resolve) => {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = `
      <div class="modal" style="width:420px;">
        <div class="modal-header"><h2>${title}</h2><button class="close-btn">✕</button></div>
        <div class="field full">
          <label>Password</label>
          <input id="password-input" type="password" autocomplete="off" />
        </div>
        <div style="margin-top:18px; display:flex; gap:8px; justify-content:flex-end;">
          <button type="button" class="btn secondary" id="password-cancel">Cancel</button>
          <button type="button" class="btn" id="password-confirm">Confirm</button>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);
    const input = backdrop.querySelector("#password-input");
    input.focus();
    const finish = (val) => { backdrop.remove(); resolve(val); };
    backdrop.querySelector(".close-btn").addEventListener("click", () => finish(null));
    backdrop.querySelector("#password-cancel").addEventListener("click", () => finish(null));
    backdrop.querySelector("#password-confirm").addEventListener("click", () => finish(input.value || null));
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") finish(input.value || null); });
    backdrop.addEventListener("click", (e) => { if (e.target === backdrop) finish(null); });
  });
}
// ---------------- Router ----------------
window.addEventListener("hashchange", route);
window.addEventListener("DOMContentLoaded", boot);

async function loadNavOrder() {
  try {
    const d = await api("/api/nav-order");
    state.navOrder = Array.isArray(d.order) ? d.order : [];
    state.navOrderCanEdit = !!d.can_edit;
    state.rethinkUrl = /^https:\/\//.test(d.rethink_url || "") ? d.rethink_url : "";
  } catch (e) {
    // Never fatal. The sidebar is how you get anywhere; it renders in its
    // natural order rather than not at all.
    state.navOrder = [];
    state.navOrderCanEdit = false;
    state.rethinkUrl = "";
  }
}

// ---------------- Sidebar reordering ----------------
// Admin-only, and one shared order for everyone. The list being dragged has
// already been filtered by role, and only KEYS are ever sent, so this can
// rearrange the menu but can never widen what anybody may reach.
//
// ADD-ON BUTTONS. Supply Requests and Occupational Therapy live in separate
// bundles that append their own button to this same <nav> AFTER the shell has
// drawn it. They used to be left out of the order and pinned to the end for
// that reason. They are ordinary entries now, and the property that keeps that
// safe is unchanged: THE SHELL NEVER CREATES ONE OF THOSE BUTTONS FROM THE
// STORED ORDER. The add-on's own role check decides whether its button exists
// at all; the saved order only says where an existing button sits. A key
// naming a tab you may not see still matches nothing and still shows nothing.
let navDragged = null;

// The draggable rows at the top level: loose entries and group HEADINGS. A
// group's members are not here -- they live inside its .nav-sub and are dragged
// within it, because membership is structural and dragging a page out of its
// group would mean nothing.
function navEntries(list) {
  return Array.from(list.children).filter(
    (el) => el.nodeType === 1 && (el.hasAttribute("data-nav") || el.hasAttribute("data-nav-group")));
}

// Every draggable row on the page, in either scope.
function navDraggables(list) {
  return navEntries(list).concat(
    Array.from(list.querySelectorAll(".nav-sub > [data-nav]")));
}

// The key a row carries, whichever kind it is.
const navKeyOf = (el) => el.dataset.nav || el.dataset.navGroup || "";

function navClearMarks(list) {
  navDraggables(list).forEach((b) => b.classList.remove("nav-drop-before", "nav-drop-after"));
}

// Put the sidebar's buttons into the saved order, in the DOM. The shell already
// does this when it renders its own entries; this exists for the ones that
// arrive afterwards, and applies exactly the same rule -- keys that are in the
// order first, in its sequence, then everything it does not mention, in the
// order it already had. An entry the saved order has never heard of therefore
// still appears, which is what stops a nav item added in a later release from
// vanishing for everyone who saved an order before it existed.
function applyNavOrderToDom() {
  const list = document.getElementById("nav-list");
  if (!list) return;
  const rank = new Map((state.navOrder || []).map((k, i) => [k, i]));

  // An add-on's button arrives after the render. If its key belongs to a group,
  // it belongs INSIDE that group -- otherwise Supply Requests and Occupational
  // Therapy would sit alone below every heading, which is the clutter this
  // change exists to remove. The shell only ever MOVES a button the add-on
  // itself decided to create; it never creates one, so a key in a group still
  // shows nothing to a user whose add-on did not draw it.
  Array.from(list.children).forEach((el) => {
    if (el.nodeType !== 1 || !el.hasAttribute("data-nav")) return;
    const groupKey = NAV_GROUP_OF.get(el.dataset.nav);
    if (!groupKey) return;
    const sub = document.getElementById("nav-sub-" + groupKey);
    if (sub) sub.appendChild(el);
  });

  // Then order each scope by the saved list, using the same rule the render
  // uses: named keys first in their sequence, everything else after, in the
  // order it already had.
  const sortWithin = (parent) => {
    const rows = Array.from(parent.children).filter(
      (el) => el.nodeType === 1 && (el.hasAttribute("data-nav") || el.hasAttribute("data-nav-group")));
    if (!rows.length) return;
    const key = (el) => el.dataset.nav || el.dataset.navGroup || "";
    const known = rows.filter((b) => rank.has(key(b))).sort((a, b) => rank.get(key(a)) - rank.get(key(b)));
    const want = known.concat(rows.filter((b) => !rank.has(key(b))));
    if (want.every((b, i) => b === rows[i])) return;
    // A group heading and its sub-list move together, or the list comes apart.
    want.forEach((b) => {
      parent.appendChild(b);
      if (b.dataset && b.dataset.navGroup) {
        const sub = document.getElementById("nav-sub-" + b.dataset.navGroup);
        if (sub) parent.appendChild(sub);
      }
    });
  };
  sortWithin(list);
  list.querySelectorAll(".nav-sub").forEach(sortWithin);
}

// Idempotent: makes every top-level entry draggable and gives it a handle,
// including buttons that appeared after reorder mode was switched on.
function decorateNavForReorder() {
  if (!state.navReorder) return;
  const list = document.getElementById("nav-list");
  if (!list) return;
  navDraggables(list).forEach((btn) => {
    btn.setAttribute("draggable", "true");
    btn.classList.add("nav-dragging-on");
    if (!btn.querySelector(".nav-drag-handle")) {
      const handle = document.createElement("span");
      handle.className = "nav-drag-handle";
      handle.textContent = "⣿ ";
      btn.insertBefore(handle, btn.firstChild);
    }
    if (btn.dataset.navDragWired === "1") return;
    btn.dataset.navDragWired = "1";
    btn.addEventListener("dragstart", (e) => {
      navDragged = btn;
      e.dataTransfer.effectAllowed = "move";
      // Firefox will not start a drag without data on the transfer.
      try { e.dataTransfer.setData("text/plain", navKeyOf(btn)); } catch (err) { /* older browsers */ }
    });
    btn.addEventListener("dragend", () => { navDragged = null; navClearMarks(list); });
    btn.addEventListener("dragover", (e) => {
      if (!navDragged || btn === navDragged || navDragged.parentNode !== btn.parentNode) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      const r = btn.getBoundingClientRect();
      const after = e.clientY > r.top + r.height / 2;
      navClearMarks(list);
      btn.classList.add(after ? "nav-drop-after" : "nav-drop-before");
    });
    btn.addEventListener("drop", (e) => {
      if (!navDragged || btn === navDragged) return;
      // Same scope only. A page dragged out of its group would be put straight
      // back by the next render, because membership is structural rather than
      // positional -- so the drop simply does not happen.
      if (navDragged.parentNode !== btn.parentNode) return;
      e.preventDefault();
      const r = btn.getBoundingClientRect();
      const after = e.clientY > r.top + r.height / 2;
      btn.parentNode.insertBefore(navDragged, after ? btn.nextSibling : btn);
      navClearMarks(list);
    });
  });
}

// Called by an add-on bundle straight after it appends its nav button, so the
// button lands in the saved position instead of on the end, and picks up the
// drag handle if the menu is being rearranged at that moment.
window.__navPlace = function (btn) {
  if (!btn || !btn.dataset || !btn.dataset.nav) return;
  applyNavOrderToDom();
  decorateNavForReorder();
};

function wireNavReorder() {
  const open = document.getElementById("nav-reorder-open");
  if (open) open.addEventListener("click", () => { state.navReorder = true; route(); });

  const cancel = document.getElementById("nav-reorder-cancel");
  if (cancel) cancel.addEventListener("click", () => { state.navReorder = false; route(); });

  const save = document.getElementById("nav-reorder-save");
  if (save) {
    save.addEventListener("click", async () => {
      const msg = document.getElementById("nav-reorder-msg");
      const list = document.getElementById("nav-list");
      if (!list) return;
      // Every row in the order it is now sitting in: each top-level unit, and
      // straight after a group heading, that group's members. Keys only -- no
      // labels, no routes, no permissions -- so there is nothing in the saved
      // order that could contradict a role check. Membership itself is NOT
      // saved: it comes from NAV_GROUPS, so this is a list of positions and
      // nothing else.
      const order = [];
      navEntries(list).forEach((el) => {
        order.push(navKeyOf(el));
        if (el.dataset.navGroup) {
          const sub = document.getElementById("nav-sub-" + el.dataset.navGroup);
          if (sub) sub.querySelectorAll("[data-nav]").forEach((m) => order.push(m.dataset.nav));
        }
      });
      save.disabled = true;
      try {
        const d = await api("/api/nav-order", { method: "PUT", body: { order } });
        state.navOrder = d.order || order;
        state.navReorder = false;
        route();
      } catch (e) {
        save.disabled = false;
        if (msg) msg.textContent = e.message;
      }
    });
  }

  if (!state.navReorder) return;
  const list = document.getElementById("nav-list");
  if (!list) return;
  // A click during reorder is the tail end of a drag. The shell's own handler
  // already checks for that, but an add-on button carries a click listener the
  // shell did not write, so this stops the event before it reaches any of them.
  list.addEventListener("click", (e) => {
    if (!state.navReorder) return;
    e.preventDefault();
    e.stopPropagation();
  }, true);
  decorateNavForReorder();
}

async function boot() {
  try {
    const { user } = await api("/api/auth/me");
    state.user = user;
    await loadNavOrder();
  } catch (e) {
    state.user = null;
  }
  route();
}

async function route() {
  const hash = location.hash || "#/dashboard";

  // The two password screens are reachable WITHOUT a session, which is the
  // whole point of them -- the person using them cannot sign in. They are
  // checked before the signed-in test below, which otherwise sends every hash
  // to the login card.
  if (hash.startsWith("#/forgot-password")) {
    renderForgotPassword();
    return;
  }
  if (hash.startsWith("#/reset-password")) {
    await renderResetPassword(hash);
    return;
  }

  if (!state.user) {
    renderLogin();
    return;
  }
  if (hash === "#/login") {
    location.hash = "#/dashboard";
    return;
  }

  // OT-only users get a locked-down shell: ONLY the Occupational Therapy
  // section. No ABA data is ever loaded or rendered for them.
  const OT_ONLY = ["ot_admin", "ot_staff"].includes(state.user.role);
  if (OT_ONLY) {
    renderShell("ot");
    if (!hash.startsWith("#/ot")) { location.hash = "#/ot"; return; }
    if (window.__otRender) window.__otRender();
    return;
  }

  await Promise.all([
    loadStages(),
    loadDepartments(),
    loadClients(),
    loadTherapists(),
  ]);

  const [, rawView, param] = hash.split("/");
  // The milestone pipeline lives at #/pipeline-v2 but is the same nav section
  // (and the same permission key) as "pipeline".
  const view = rawView === "pipeline-v2" ? "pipeline" : rawView;

  // Enforce per-user module access on direct hash navigation.
  const maGuard = getModuleAccess(state.user);
  if (maGuard && view && maGuard[view] === false) { location.hash = "#/dashboard"; return; }
  // Role check for the client pipeline / client records themselves.
  if (view === "pipeline" && !canAccessClients() && !(maGuard && maGuard.pipeline === true)) {
    location.hash = "#/dashboard";
    return;
  }

  // Scheduling is switched off at Quiana's request -- both the Scheduling
  // Center and the older weekly Therapy Schedule. The code and the tables are
  // still here and untouched; only the way in is closed, so turning it back on
  // is this guard, the nav entry, the MODULE_CATALOG entry and the script tag.
  // This sits above renderShell deliberately: anyone landing on an old
  // #/schedule bookmark goes straight to the dashboard rather than flashing a
  // shell with a nav section that no longer exists.
  if (hash.startsWith("#/schedule")) { location.hash = "#/dashboard"; return; }

  renderShell(view || "dashboard");

  const mount = document.getElementById("view-mount");
  if (hash.startsWith("#/hr")) {
    // HR & Recruiting add-on owns these routes; it renders directly into the
    // mount here so there is no race with the client dashboard below.
    const handled = window.__renderHR ? await window.__renderHR(mount) : false;
    if (!handled) await renderDashboard(mount);
  }
  else if (hash.startsWith("#/dashboard") || !rawView) {
    // A BCBA's landing screen is their caseload, not the administrative
    // overview. Same route, same nav entry -- the role decides which one draws.
    // If the bundle failed to load, the generic dashboard still appears rather
    // than an empty page.
    if (window.__isBcbaDashboardUser && window.__isBcbaDashboardUser() && window.__renderBcbaDashboard) {
      await window.__renderBcbaDashboard(mount);
    } else await renderDashboard(mount);
  }
  // pipeline-v2.js owns the milestone view and renders into the mount itself.
  // Claiming the route here (instead of letting it fall through to the old
  // pipeline view) is what stops the two from overwriting each other.
  else if (hash.startsWith("#/pipeline-v2")) { /* rendered by pipeline-v2.js */ }
  else if (hash.startsWith("#/pipeline")) await renderPipeline(mount);
  else if (hash.startsWith("#/tasks")) await renderTasks(mount);
  else if (hash.startsWith("#/outbox")) await renderOutbox(mount);
  else if (hash.startsWith("#/staff")) await renderStaff(mount);
  else if (hash.startsWith("#/attendance")) { if (window.__renderAttendance) await window.__renderAttendance(mount); else await renderDashboard(mount); }
  else if (hash.startsWith("#/billable")) { if (window.__renderBillable) await window.__renderBillable(mount); else await renderDashboard(mount); }
  else if (hash.startsWith("#/pto")) { if (window.__renderPto) await window.__renderPto(mount); else await renderDashboard(mount); }
  else if (hash.startsWith("#/supervision")) { if (window.__renderSupervision) await window.__renderSupervision(mount); else await renderDashboard(mount); }
  else if (hash.startsWith("#/client-behavior")) { if (window.__renderClientBehavior) await window.__renderClientBehavior(mount); else await renderDashboard(mount); }
  else if (hash.startsWith("#/bcba-hub")) { if (window.__renderBcbaHub) await window.__renderBcbaHub(mount); else await renderDashboard(mount); }
  else if (hash.startsWith("#/rethink-clients")) { if (window.__renderRethinkMatch) await window.__renderRethinkMatch(mount); else await renderDashboard(mount); }
  else if (hash.startsWith("#/leads")) { if (window.__renderLeads) await window.__renderLeads(mount); else await renderDashboard(mount); }
  else if (hash.startsWith("#/events")) { if (window.__renderEvents) await window.__renderEvents(mount); else await renderDashboard(mount); }
  else if (hash.startsWith("#/grants")) { if (window.__renderGrants) await window.__renderGrants(mount); else await renderDashboard(mount); }
  else if (hash.startsWith("#/policies")) { if (window.__renderPolicies) await window.__renderPolicies(mount); else await renderDashboard(mount); }
  else if (hash.startsWith("#/map")) { if (window.__renderMap) await window.__renderMap(mount); else await renderDashboard(mount); }
  else if (hash.startsWith("#/financial-center")) { if (window.__renderFinancialCenter) await window.__renderFinancialCenter(mount); else await renderDashboard(mount); }
  else if (hash.startsWith("#/signnow-import")) { if (window.__renderSignNowImport) await window.__renderSignNowImport(mount); else await renderDashboard(mount); }
  else if (hash.startsWith("#/email-templates")) { if (window.__renderEmailTemplates) await window.__renderEmailTemplates(mount); else await renderDashboard(mount); }
  else if (hash.startsWith("#/failed-emails")) { if (window.__renderFailedEmails) await window.__renderFailedEmails(mount); else await renderDashboard(mount); }
  else if (hash.startsWith("#/auth-alerts")) await renderAuthAlerts(mount, param);
  else if (hash.startsWith("#/bcba-migration")) {
    if (window.__renderBcbaMigration) await window.__renderBcbaMigration(mount);
    else await renderAdmin(mount);
  }
  else if (hash.startsWith("#/drive-notes-import")) {
    if (window.__renderDriveNotesImport) await window.__renderDriveNotesImport(mount);
    else await renderAdmin(mount);
  }
  else if (hash.startsWith("#/admin")) await renderAdmin(mount);
  else await renderDashboard(mount);

  if (param && hash.startsWith("#/pipeline/")) openClientModal(param);
}

async function loadStages() {
  state.stages = await api("/api/stages");
}
async function loadDepartments() {
  state.departments = await api("/api/departments");
}
async function loadClients() {
  state.clients = await api("/api/clients");
}
async function loadTherapists() {
  state.therapists = await api("/api/therapists");
}

// Catalog of grantable nav modules (for per-user granular access).
// ---------------- Sidebar groups ----------------
// The sidebar had grown to about twenty-five top-level entries, which is a list
// you scan rather than a menu you use. Related pages fold into collapsible
// groups now.
//
// GROUPING IS PURELY PRESENTATIONAL, and that is what keeps it safe. Membership
// is a list of KEYS; navItems is still built exactly as before, so every role
// check and every per-user module-access override still decides what exists. A
// key naming a page this user may not see simply matches nothing, a group whose
// members are all hidden is not drawn at all, and no page, route or permission
// changes because an entry moved under a heading.
const NAV_GROUPS = [
  { key: "grp-clients", label: "Clients",
    members: ["pipeline", "client-behavior", "auth-alerts", "outbox", "leads"] },
  { key: "grp-staff", label: "Staff",
    members: ["staff", "attendance", "supervision", "billable", "pto", "hr"] },
  // Map is deliberately NOT in here. Grouping put it behind a heading that
  // renders collapsed, and from the outside that is indistinguishable from the
  // Map having been removed -- which is exactly how it was reported. It goes
  // back to the top level, where it was before the sidebar was grouped.
  { key: "grp-practice", label: "Practice",
    members: ["events", "policies", "financial-center", "grants", "supply", "ot"] },
  { key: "grp-admin", label: "Admin",
    members: ["admin", "rethink-clients", "signnow-import", "email-templates", "failed-emails"] },
];
const NAV_GROUP_OF = new Map();
NAV_GROUPS.forEach((g) => g.members.forEach((k) => NAV_GROUP_OF.set(k, g.key)));
// Where each top-level unit sits before an admin rearranges anything. The
// entries that stay loose are the ones you reach for constantly and would not
// want to open a group to find.
// "rethink" sits beside BCBA Hub, at the TOP LEVEL and not inside the Staff
// group next to Supervision, which is where it was asked for. The point of the
// entry is jumping straight out to Rethink mid-task, and a group that renders
// collapsed is how Map came to be reported as missing -- twice. A shortcut you
// have to expand a heading to reach is not a shortcut.
const NAV_UNIT_ORDER = ["dashboard", "grp-clients", "bcba-hub", "rethink", "tasks", "map", "grp-staff", "grp-practice", "grp-admin"];

const MODULE_CATALOG = {
  dashboard: { label: "Dashboard", icon: "◧" },
  pipeline: { label: "Clients", icon: "▤", hash: "#/pipeline-v2" },
  tasks: { label: "Tasks & Alerts", icon: "✓" },
  staff: { label: "Staff", icon: "◉" },
  attendance: { label: "Staff Attendance", icon: "◷" },
  billable: { label: "Billable Requirements", icon: "◵" },
  pto: { label: "PTO Balances", icon: "◇" },
  supervision: { label: "RBT Supervision", icon: "▥" },
  "client-behavior": { label: "Programming", icon: "◑", hash: "#/client-behavior" },
  "bcba-hub": { label: "BCBA Hub", icon: "◑", hash: "#/bcba-hub" },
  // A SHORTCUT, not a page: it opens the real Rethink application in a new tab.
  // `external` is what stops the router being handed a "#/rethink" that does
  // not exist -- including down the module_access path below, which builds an
  // entry straight out of this catalogue.
  rethink: { label: "Rethink", icon: "⧉", external: true },
  "rethink-clients": { label: "Rethink Client Matching", icon: "⧉", hash: "#/rethink-clients" },
  leads: { label: "Lead Management", icon: "◎" },
  events: { label: "Events", icon: "▽" },
  policies: { label: "Policies & SOPs", icon: "▦" },
  map: { label: "Map", icon: "◈" },
  hr: { label: "HR & Recruiting", icon: "◐" },
  outbox: { label: "Message Outbox", icon: "✉" },
  "financial-center": { label: "Financial Center", icon: "▧" },
  "signnow-import": { label: "SignNow Import", icon: "⇩" },
  "email-templates": { label: "Email Templates", icon: "✎" },
  "failed-emails": { label: "Failed Emails", icon: "⚠" },
  grants: { label: "Grant Finder", icon: "▨" },
  "auth-alerts": { label: "Authorization Alerts", icon: "⧗" },
  admin: { label: "Admin Settings", icon: "⚙" },
};
// Roles allowed to see client (family) records at all. HR-side roles such as
// hiring_manager and interviewer are deliberately excluded -- they have no
// reason to see a child's PHI. Mirrors CLIENT_ACCESS_ROLES on the server.
const CLIENT_ACCESS_ROLES = ["owner", "super_admin", "admin", "intake", "clinical", "billing", "scheduling"];
function canAccessClients() {
  return !!state.user && CLIENT_ACCESS_ROLES.includes(state.user.role);
}
function getModuleAccess(user) {
  if (!user || !user.module_access) return null;
  try { return typeof user.module_access === "string" ? JSON.parse(user.module_access) : user.module_access; }
  catch (e) { return null; }
}

// ---------------- Shell (sidebar + layout) ----------------
// Live "Tasks & Alerts (N)" nav badge. Counts the logged-in user's own open
// tasks, and turns red when any are overdue. Exposed globally so any task
// mutation (create / complete / reassign / delete) can refresh it immediately.
async function refreshTaskBadge() {
  const el = document.getElementById("nav-task-count");
  if (!el) return;
  try {
    const s = await api("/api/staff-tasks/summary");
    const n = Number(s.open || 0);
    if (n > 0) {
      el.textContent = n > 99 ? "99+" : String(n);
      el.title = `${n} open task${n === 1 ? "" : "s"}${s.overdue ? ` · ${s.overdue} overdue` : ""}`;
      el.classList.toggle("overdue", Number(s.overdue || 0) > 0);
      el.style.display = "";
    } else {
      el.style.display = "none";
    }
  } catch (e) { /* badge is best-effort; never break the shell */ }
}
window.refreshTaskBadge = refreshTaskBadge;

function renderShell(active) {
  // OT-only users see no ABA navigation at all (their OT button is injected by
  // ot-frontend.js). Everyone else gets the normal ABA navigation.
  const OT_ONLY = ["ot_admin", "ot_staff"].includes(state.user.role);
  const navItems = OT_ONLY ? [] : [
    { key: "dashboard", label: "Dashboard", icon: "◧" },
  ];
  // Client Pipeline: previously this button was injected into the sidebar by
  // pipeline-v2.js for every logged-in user with no role check at all, so HR
  // roles could see the whole client pipeline and the Access toggle for it did
  // nothing. It is a normal nav item now, with a role check like everything else.
  if (!OT_ONLY && canAccessClients())
    navItems.push({ key: "pipeline", label: "Clients", icon: "▤", hash: "#/pipeline-v2" });
  // Sits with the client sections, not with the staff ones: it is client
  // clinical information. Same access rule the BIP API enforces
  // (CLIENT_ACCESS_ROLES / canViewBip) -- the nav entry hides it, bip.js is
  // what actually enforces it.
  if (!OT_ONLY && canAccessClients())
    navItems.push({ key: "client-behavior", label: "Programming", icon: "◑", hash: "#/client-behavior" });
  // The BCBA Hub: payer requirements and blank forms. It holds NO client
  // information, so its access rule is about who does clinical and
  // authorization work rather than who may see a child's record -- billing is
  // included because submitting the authorization request is their job.
  // Same list bcba-hub.js enforces; the nav entry only hides it.
  if (!OT_ONLY && ["owner", "super_admin", "admin", "clinical", "billing"].includes(state.user.role))
    navItems.push({ key: "bcba-hub", label: "BCBA Hub", icon: "◑", hash: "#/bcba-hub" });
  // Rethink: A SHORTCUT OUT OF THE CRM, and nothing more. It opens the real
  // application in a new tab -- not in a frame, and not over the top of the
  // page somebody is working on. Nothing here reimplements any part of it.
  //
  // The address is a setting rather than a constant, because the one thing
  // worse than no shortcut is a shortcut to the wrong page: an admin fixes it
  // in Admin Settings without a deploy. No URL recorded, no entry drawn.
  if (!OT_ONLY && CLIENT_ACCESS_ROLES.includes(state.user.role) && state.rethinkUrl)
    navItems.push({ key: "rethink", label: "Rethink", icon: "⧉", external: state.rethinkUrl });
  if (!OT_ONLY) {
    navItems.push({ key: "tasks", label: "Tasks & Alerts", icon: "✓" });
  }
  // Message Outbox: owner/super_admin/admin see everything; other client-access
  // staff see only messages for the clients they're assigned to (scoped by the
  // server). Roles with no client access don't see it at all.
  if (!OT_ONLY && canAccessClients())
    navItems.push({ key: "outbox", label: "Message Outbox", icon: "✉" });
  if (canViewAuth()) navItems.push({ key: "auth-alerts", label: "Authorization Alerts", icon: "⧗" });
  if (["owner", "admin", "super_admin", "hr_admin", "hiring_manager", "interviewer"].includes(state.user.role))
    navItems.push({ key: "hr", label: "HR & Recruiting", icon: "◐" });
  if (["owner", "admin", "super_admin", "hr_admin"].includes(state.user.role))
    navItems.push({ key: "staff", label: "Staff", icon: "◉" });
  // Staff attendance points, discipline levels and bonus eligibility. Same
  // roles the /api/attendance routes accept -- the nav entry hides it, the
  // module's own canManage() is what enforces it.
  if (["owner", "admin", "super_admin", "hr_admin"].includes(state.user.role))
    navItems.push({ key: "attendance", label: "Staff Attendance", icon: "◷" });
  // Per-BCBA monthly billable requirements and the monthly summary email. Same
  // roles the /api/billable routes accept -- the nav entry hides it, the
  // module's own canManage() is what enforces it.
  if (["owner", "admin", "super_admin", "hr_admin"].includes(state.user.role))
    navItems.push({ key: "billable", label: "Billable Requirements", icon: "◵" });
  // PTO accrual and balances. Same roles the /api/pto routes accept.
  if (["owner", "admin", "super_admin", "hr_admin"].includes(state.user.role))
    navItems.push({ key: "pto", label: "PTO Balances", icon: "◇" });
  if (["owner", "admin", "super_admin", "hr_admin", "clinical"].includes(state.user.role))
    navItems.push({ key: "supervision", label: "RBT Supervision", icon: "▥" });
  // Rethink client matching. Owner/admin only, matching the server-side role
  // check on /api/rethink/client-match -- the nav entry hides it, the route
  // guard is what actually enforces it.
  if (["owner", "admin", "super_admin"].includes(state.user.role))
    navItems.push({ key: "rethink-clients", label: "Rethink Client Matching", icon: "⧉", hash: "#/rethink-clients" });
  if (["owner", "super_admin", "admin", "intake", "scheduling"].includes(state.user.role))
    navItems.push({ key: "leads", label: "Lead Management", icon: "◎" });
  // Events: the reusable community-event system. The nav entry is deliberately
  // generic -- an individual event (the Halloween Palooza) is a row inside it,
  // never a permanent menu item of its own.
  if (["owner", "super_admin", "admin", "intake", "scheduling"].includes(state.user.role))
    navItems.push({ key: "events", label: "Events", icon: "▽" });
  navItems.push({ key: "policies", label: "Policies & SOPs", icon: "▦" });
  if (["owner", "super_admin", "admin", "scheduling"].includes(state.user.role))
    navItems.push({ key: "map", label: "Map", icon: "◈" });
  if (["owner", "super_admin"].includes(state.user.role))
    navItems.push({ key: "financial-center", label: "Financial Center", icon: "▧" });
  // Grant Finder. Same roles the /api/grants/* routes accept -- the nav entry
  // hides it, the route guard is what actually enforces it.
  if (["owner", "super_admin", "admin"].includes(state.user.role))
    navItems.push({ key: "grants", label: "Grant Finder", icon: "▨" });
  if (["owner", "admin", "super_admin"].includes(state.user.role)) {
    navItems.push({ key: "signnow-import", label: "SignNow Import", icon: "⇩" });
    navItems.push({ key: "email-templates", label: "Email Templates", icon: "✎" });
    navItems.push({ key: "failed-emails", label: "Failed Emails", icon: "⚠" });
    navItems.push({ key: "admin", label: "Admin Settings", icon: "⚙" });
  }

  // Per-user granular access overrides: an explicit false hides a module; an
  // explicit true adds one the role wouldn't normally see. Absent = role default.
  const ma = getModuleAccess(state.user);
  if (ma) {
    for (let i = navItems.length - 1; i >= 0; i--) if (ma[navItems[i].key] === false) navItems.splice(i, 1);
    Object.keys(ma).forEach((k) => {
      if (ma[k] === true && !navItems.some((n) => n.key === k) && MODULE_CATALOG[k]) {
        const m = MODULE_CATALOG[k];
        // `external` carries the URL, not a flag, so it has to be resolved
        // here too -- otherwise switching Rethink on for one person gives them
        // a button that routes to "#/rethink", which is not a page.
        if (m.external && !state.rethinkUrl) return;
        navItems.push({ key: k, label: m.label, icon: m.icon, hash: m.hash,
          external: m.external ? state.rethinkUrl : undefined });
      }
    });
  }

  // ---- assemble the sidebar: loose entries and groups, in order -----------
  //
  // Grouping happens HERE, at render time, and nowhere else. navItems above has
  // already been filtered by role and by the per-user access overrides, so a
  // group can only ever contain entries this user was already allowed to see.
  const reordering = !!state.navReorder;

  const groups = NAV_GROUPS
    .map((g) => ({ ...g, children: g.members.map((k) => navItems.find((n) => n.key === k)).filter(Boolean) }))
    .filter((g) => g.children.length);
  const drawn = new Set();
  groups.forEach((g) => g.children.forEach((c) => drawn.add(c.key)));
  const loose = navItems.filter((n) => !drawn.has(n.key));

  // The admin-set order, applied as a LAYOUT OVER that already-filtered list.
  // Reordering moves things and can never reveal one. A key the order does not
  // mention falls back to the built-in position, and anything neither knows
  // about keeps its natural place at the end -- so a nav entry added in a later
  // release still appears instead of vanishing for everyone who saved an order
  // before it existed.
  const rank = new Map((Array.isArray(state.navOrder) ? state.navOrder : []).map((k, i) => [k, i]));
  const builtIn = new Map(NAV_UNIT_ORDER.map((k, i) => [k, i]));
  const seat = (key, natural) =>
    rank.has(key) ? rank.get(key)
    : builtIn.has(key) ? 10000 + builtIn.get(key)
    : 20000 + natural;

  let units = loose.map((n) => ({ type: "item", key: n.key, item: n }))
    .concat(groups.map((g) => ({ type: "group", key: g.key, group: g })));
  units = units
    .map((u, i) => ({ u, i }))
    .sort((a, b) => seat(a.u.key, a.i) - seat(b.u.key, b.i))
    .map((x) => x.u);
  // Members are ordered by the same saved list, within their own group.
  groups.forEach((g) => {
    g.children = g.children
      .map((c, i) => ({ c, i }))
      .sort((a, b) => seat(a.c.key, a.i) - seat(b.c.key, b.i))
      .map((x) => x.c);
  });

  // Open when you are on one of its pages, otherwise whatever you left it as,
  // and always while reordering so every entry can be dragged. Storage is a
  // convenience only: without it a group still works, it just starts closed.
  const groupIsOpen = (g) => {
    if (reordering) return true;
    if (g.children.some((c) => c.key === active)) return true;
    let stored = null;
    try { stored = localStorage.getItem("ss-nav-group:" + g.key); } catch (e) { /* private mode */ }
    if (stored !== null) return stored === "1";
    // Nothing stored yet. Clients starts OPEN because it is the everyday work
    // and a sidebar of four closed headings tells a new person nothing about
    // what is in the application. The rest start closed, which is the point of
    // grouping them.
    return g.key === "grp-clients";
  };

  const navItemHtml = (n, cls) => {
    // AN ANCHOR, NOT A BUTTON, for anything that leaves the CRM. The browser's
    // own handling is what makes ctrl-click, middle-click and "open in new tab"
    // behave, and target="_blank" without rel="noopener" hands the page it
    // opens a live reference back to this one. It is never marked active: it is
    // not a page of this application and cannot be the one you are on.
    if (n.external) {
      return `<a class="nav-item ${cls}${reordering ? " nav-dragging-on" : ""}" data-nav="${n.key}" data-nav-external="1"
              href="${adminEsc(n.external)}" target="_blank" rel="noopener noreferrer"${reordering ? ' draggable="true"' : ""}>
              ${reordering ? `<span class="nav-drag-handle">⣿ </span>` : ""}${n.label}<span class="nav-ext" aria-hidden="true">↗</span><span class="sr-only">opens in a new tab</span></a>`;
    }
    return `<button class="nav-item ${cls} ${active === n.key && !reordering ? "active" : ""}${reordering ? " nav-dragging-on" : ""}" data-nav="${n.key}"${n.hash ? ` data-nav-hash="${n.hash}"` : ""}${reordering ? ' draggable="true"' : ""}>
              ${reordering ? `<span class="nav-drag-handle">⣿ </span>` : ""}${n.label}${n.key === "tasks" && !reordering ? `<span class="nav-count" id="nav-task-count" style="display:none;"></span>` : ""}</button>`;
  };

  // A group heading is a heading, not a page: it expands and never navigates.
  // That is the behaviour the Admin group already had, kept so the whole
  // sidebar works one way rather than two.
  const navGroupHtml = (g) => {
    const open = groupIsOpen(g);
    const hasActive = g.children.some((c) => c.key === active);
    return `<button class="nav-item nav-group ${hasActive ? "has-active" : ""}${reordering ? " nav-dragging-on" : ""}"
              data-nav-group="${g.key}" aria-expanded="${open ? "true" : "false"}" aria-controls="nav-sub-${g.key}"${reordering ? ' draggable="true"' : ""}>
              ${reordering ? `<span class="nav-drag-handle">⣿ </span>` : ""}${g.label}<span class="nav-chevron">${open ? "▾" : "▸"}</span></button>
            <div class="nav-sub" id="nav-sub-${g.key}" data-nav-sub="${g.key}"${open ? "" : " hidden"}>
              ${g.children.map((n) => navItemHtml(n, "")).join("")}
            </div>`;
  };

  const va = state.user && state.user.view_as;
  document.body.classList.toggle("viewing-as", !!(va && va.active));
  root.innerHTML = `
    ${va && va.active ? `<div class="viewas-bar" id="viewas-bar">
      <span>Viewing as <span class="who">${adminEsc(va.viewing_name)}</span> (${adminEsc(va.viewing_role)})</span>
      <span class="ro">Read only &mdash; nothing can be changed from here.</span>
      <button id="viewas-stop">Back to my account</button>
    </div>` : ""}
    <div class="app-shell">
      <div class="sidebar">
        <div class="brand"><img src="/logo.png" alt="Spectrum Squad" style="max-width:170px; width:100%; height:auto;" /></div>
        <nav id="nav-list">
          ${units.map((u) => (u.type === "group" ? navGroupHtml(u.group) : navItemHtml(u.item, ""))).join("")}
        </nav>
        ${/* "Reorder menu" sat here under the navigation, on every admin's screen,
              every day, to be used about twice a year. It is started from Admin
              Settings now instead; the drag bar still appears here while
              reordering, because that is where the dragging happens. */
          state.navOrderCanEdit && reordering
          ? `<div class="nav-reorder-bar">
               <div class="nav-reorder-hint">Drag to reorder — headings among themselves, entries within their own group. This sets the menu for everyone.</div>
               <button class="btn small" id="nav-reorder-save">Save order</button>
               <button class="btn small secondary" id="nav-reorder-cancel">Cancel</button>
               <div id="nav-reorder-msg" class="nav-reorder-msg"></div>
             </div>`
          : ""}
        <div class="sidebar-footer">
          <div class="sidebar-user"><strong>${state.user.name}</strong>${state.user.role}</div>
          <button class="logout-btn" id="logout-btn">Log out</button>
        </div>
      </div>
      <div class="main">
        <img src="/logo.png" alt="" aria-hidden="true" style="position:fixed; top:14px; right:20px; width:120px; height:auto; opacity:0.07; pointer-events:none; z-index:0;" />
        <div id="view-mount"></div>
      </div>
    </div>
  `;
  root.querySelectorAll("[data-nav]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      // While reordering, a click is the tail end of a drag. Navigating here
      // would throw away an arrangement somebody was halfway through -- and on
      // an external entry it would open a tab mid-drag, hence preventDefault.
      if (state.navReorder) { e.preventDefault(); return; }
      // An external shortcut is a real link. Let the browser open its own tab;
      // routing it would send somebody to a page this application does not have
      // AND would take them off whatever they were working on.
      if (btn.hasAttribute("data-nav-external")) return;
      location.hash = btn.dataset.navHash || "#/" + btn.dataset.nav;
    });
  });
  wireNavReorder();
  applyNavOrderToDom();
  // A group heading opens and closes its own section. It is not a page, so it
  // deliberately carries no data-nav and never navigates.
  root.querySelectorAll("[data-nav-group]").forEach((toggle) => {
    toggle.addEventListener("click", () => {
      if (state.navReorder) return;   // mid-drag: not a click
      const sub = document.getElementById("nav-sub-" + toggle.dataset.navGroup);
      if (!sub) return;
      const open = sub.hasAttribute("hidden");
      if (open) sub.removeAttribute("hidden"); else sub.setAttribute("hidden", "");
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
      const chev = toggle.querySelector(".nav-chevron");
      if (chev) chev.textContent = open ? "▾" : "▸";
      try { localStorage.setItem("ss-nav-group:" + toggle.dataset.navGroup, open ? "1" : "0"); } catch (e) { /* private mode */ }
    });
  });
  refreshTaskBadge();
  const stopBtn = document.getElementById("viewas-stop");
  if (stopBtn) stopBtn.addEventListener("click", async () => {
    stopBtn.disabled = true;
    stopBtn.textContent = "Switching back…";
    try {
      await api("/api/auth/view-as/stop", { method: "POST" });
      // Re-read who we are from the server rather than assuming: the session
      // is what decides, and guessing here is how a stale banner survives.
      const me = await api("/api/auth/me");
      state.user = me.user;
      location.hash = "#/dashboard";
      route();
    } catch (e) {
      stopBtn.disabled = false;
      stopBtn.textContent = "Back to my account";
      alert(e.message);
    }
  });
  document.getElementById("logout-btn").addEventListener("click", async () => {
    await api("/api/auth/logout", { method: "POST" });
    state.user = null;
    location.hash = "#/login";
    route();
  });
}

// ---------------- Login ----------------
function renderLogin() {
  root.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <img src="/logo.png" alt="Spectrum Squad" style="display:block; max-width:220px; width:70%; height:auto; margin:0 auto 10px;" />
        <p class="sub" style="text-align:center;">Client Pipeline & Scheduling CRM</p>
        <div id="login-error" class="login-error"></div>
        <form id="login-form">
          <div class="field">
            <label>Email</label>
            <input type="email" name="email" required autocomplete="username" />
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" name="password" required autocomplete="current-password" />
          </div>
          <button class="btn" type="submit" style="width:100%; justify-content:center; margin-top:8px;">Log in</button>
        </form>
        <p style="text-align:center; margin:16px 0 0; font-size:12.5px;">
          <a href="#/forgot-password" id="forgot-password-link" style="color:var(--brand-navy); text-decoration:underline;">Forgot your password?</a>
        </p>
      </div>
    </div>
  `;
  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    try {
      const { user } = await api("/api/auth/login", {
        method: "POST",
        body: { email: fd.get("email"), password: fd.get("password") },
      });
      state.user = user;
      await loadNavOrder();
      location.hash = "#/dashboard";
      route();
    } catch (err) {
      document.getElementById("login-error").textContent = err.message;
    }
  });
}

// ---------------- Forgotten password ----------------
// Two screens, both reachable without a session.
//
// The confirmation is the SAME SENTENCE whether or not the address has an
// account, because the server gives the same answer either way. Saying "no such
// user" here would undo that in one line: this page is served to anybody, and
// the addresses are staff addresses at a named practice.
function passwordCardHtml(inner) {
  return `
    <div class="login-wrap">
      <div class="login-card">
        <img src="/logo.png" alt="Spectrum Squad" style="display:block; max-width:220px; width:70%; height:auto; margin:0 auto 10px;" />
        ${inner}
      </div>
    </div>
  `;
}

function renderForgotPassword() {
  root.innerHTML = passwordCardHtml(`
    <p class="sub" style="text-align:center;">Reset your password</p>
    <p style="font-size:13px; color:var(--text-muted); margin:0 0 16px;">Enter the email address you sign in with and we will send you a link to choose a new password. The link works once and expires in an hour.</p>
    <div id="forgot-error" class="login-error"></div>
    <div id="forgot-done" style="display:none; font-size:13px; background:var(--brand-light); padding:12px 14px; border-radius:8px; margin-bottom:12px;"></div>
    <form id="forgot-form">
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" required autocomplete="username" />
      </div>
      <button class="btn" type="submit" id="forgot-submit" style="width:100%; justify-content:center; margin-top:8px;">Send the link</button>
    </form>
    <p style="text-align:center; margin:16px 0 0; font-size:12.5px;">
      <a href="#/login" style="color:var(--brand-navy); text-decoration:underline;">Back to sign in</a>
    </p>
  `);

  document.getElementById("forgot-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("forgot-submit");
    const err = document.getElementById("forgot-error");
    const done = document.getElementById("forgot-done");
    err.textContent = "";
    btn.disabled = true;
    btn.textContent = "Sending...";
    try {
      const data = await api("/api/auth/forgot-password", {
        method: "POST",
        body: { email: new FormData(e.target).get("email") },
      });
      // Replace the form rather than leaving it usable: a second press sends a
      // second link and invalidates the first, which is exactly the confusion
      // somebody in this position does not need.
      done.textContent = data.message || "If that address has an account, we have sent it a link to reset the password.";
      done.style.display = "block";
      e.target.style.display = "none";
    } catch (ex) {
      err.textContent = ex.message;
      btn.disabled = false;
      btn.textContent = "Send the link";
    }
  });
}

async function renderResetPassword(hash) {
  const token = (hash.split("?")[1] || "")
    .split("&")
    .map((p) => p.split("="))
    .filter((p) => p[0] === "token")
    .map((p) => decodeURIComponent(p[1] || ""))[0] || "";

  // THE TOKEN TRAVELS IN THE FRAGMENT, not the path or the query string. A
  // fragment is never sent to the server, so the link cannot end up in an HTTP
  // access log, a proxy log or a Referer header on the way in. It reaches the
  // server only in the body of the POST below.
  root.innerHTML = passwordCardHtml(`<p class="sub" style="text-align:center;">Checking your link...</p>`);

  let state_ = { valid: false, reason: "invalid", email_hint: "" };
  try {
    state_ = await api("/api/auth/reset-password/check", { method: "POST", body: { token } });
  } catch (e) { /* falls through to the invalid card below */ }

  if (!state_.valid) {
    const why = {
      expired: "That link has expired. Reset links are good for one hour.",
      used: "That link has already been used.",
      superseded: "A newer reset link was sent to you. Please open the most recent email.",
    };
    root.innerHTML = passwordCardHtml(`
      <p class="sub" style="text-align:center;">This link cannot be used</p>
      <div class="login-error" style="margin-bottom:14px;">${why[state_.reason] || "That reset link is not valid."}</div>
      <p style="font-size:13px; color:var(--text-muted);">You can ask for a new one, and your password has not been changed.</p>
      <p style="text-align:center; margin:16px 0 0; font-size:12.5px;">
        <a href="#/forgot-password" style="color:var(--brand-navy); text-decoration:underline;">Send a new link</a>
      </p>
    `);
    return;
  }

  root.innerHTML = passwordCardHtml(`
    <p class="sub" style="text-align:center;">Choose a new password</p>
    <p style="font-size:13px; color:var(--text-muted); margin:0 0 16px;">For ${state_.email_hint || "your account"}. It needs to be at least 8 characters.</p>
    <div id="reset-error" class="login-error"></div>
    <form id="reset-form">
      <div class="field">
        <label>New password</label>
        <input type="password" name="password" required minlength="8" autocomplete="new-password" />
      </div>
      <div class="field">
        <label>Confirm new password</label>
        <input type="password" name="confirm" required minlength="8" autocomplete="new-password" />
      </div>
      <button class="btn" type="submit" id="reset-submit" style="width:100%; justify-content:center; margin-top:8px;">Save the new password</button>
    </form>
  `);

  document.getElementById("reset-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const err = document.getElementById("reset-error");
    const btn = document.getElementById("reset-submit");
    err.textContent = "";
    if (fd.get("password") !== fd.get("confirm")) {
      err.textContent = "Those two passwords do not match.";
      return;
    }
    btn.disabled = true;
    btn.textContent = "Saving...";
    try {
      await api("/api/auth/reset-password", {
        method: "POST",
        body: { token, password: fd.get("password") },
      });
      // Every session for the account was just ended server-side, this browser's
      // included, so there is nothing to do but sign in again.
      state.user = null;
      root.innerHTML = passwordCardHtml(`
        <p class="sub" style="text-align:center;">Password updated</p>
        <p style="font-size:13px; background:var(--brand-light); padding:12px 14px; border-radius:8px;">You can now sign in with your new password. Anyone who was signed in to this account has been signed out.</p>
        <p style="text-align:center; margin:16px 0 0; font-size:12.5px;">
          <a href="#/login" style="color:var(--brand-navy); text-decoration:underline;">Go to sign in</a>
        </p>
      `);
    } catch (ex) {
      err.textContent = ex.message;
      btn.disabled = false;
      btn.textContent = "Save the new password";
    }
  });
}
