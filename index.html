// ---------------- Personal Task Center (item 9) ----------------
// Extracted so it can be mounted on more than one dashboard. The BCBA landing
// screen replaces the generic dashboard for the clinical role, and rebuilding a
// simpler task list there would have left BCBAs with the only task interface in
// the CRM that has no Completed tab and no way to reopen something ticked by
// mistake. One Task Center, mounted in two places.
function taskCenterHtml(opts) {
  const o = opts || {};
  return `
    <div class="card" id="task-center" style="margin-top:${o.marginTop || "20px"};">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
        <div class="section-title" style="margin:0; display:flex; align-items:center; gap:8px;">My Task Center</div>
        <div class="tc-tabs" id="tc-tabs">
          <button class="tc-tab active" data-tc="today">Today <span class="tc-n" data-tc-n="today"></span></button>
          <button class="tc-tab" data-tc="upcoming">Upcoming <span class="tc-n" data-tc-n="upcoming"></span></button>
          <button class="tc-tab" data-tc="overdue">Overdue <span class="tc-n" data-tc-n="overdue"></span></button>
          <button class="tc-tab" data-tc="completed">Completed</button>
        </div>
      </div>
      <div id="task-center-body" style="margin-top:12px;"><div class="empty-state">Loading your tasks…</div></div>
    </div>`;
}

// Shows ONLY the logged-in user's own tasks (the server scopes /scope=mine to
// the current user and refuses to hand a normal staffer anyone else's list).
// Tabs: Today / Upcoming / Overdue / Completed. Each row has a priority pill,
// an overdue flag, a quick-complete button, and a link into the client record.
const TC_PRIORITY = {
  urgent: { label: "Urgent", bg: "#fdeaea", fg: "#991b1b" },
  high:   { label: "High",   bg: "#fef3e0", fg: "#946213" },
  normal: { label: "Normal", bg: "#eef2f7", fg: "#475569" },
  low:    { label: "Low",    bg: "#e9f9ee", fg: "#177a3c" },
};
let _tcTasks = [];
let _tcFilter = "today";
// Tasks & Alerts hides completed rows by default. Kept outside the render so
// the choice survives the re-render that ticking a task triggers.
let _stShowDone = false;
// "Completed 3 Aug, reopened by Quiana 5 Aug" -- the trail a task keeps when it
// is ticked by mistake and put back. Shared by the Task Center and the Tasks &
// Alerts table so both read the same way.
function taskHistoryLine(t) {
  if (!t || !t.reopened_at) return "";
  const was = t.last_completed_at ? `Completed ${fmtDate(t.last_completed_at)} · ` : "";
  const times = t.reopen_count > 1 ? ` (reopened ${t.reopen_count}×)` : "";
  return `<div style="font-size:11.5px; color:#946213; margin-top:3px;">↩ ${was}reopened by ${staffEsc(t.reopened_by || "staff")} ${fmtDate(t.reopened_at)}${times}</div>`;
}
function _tcBucket(t) {
  const today = new Date().toLocaleDateString("en-CA");
  if (t.status === "done") return "completed";
  const d = t.due_date ? String(t.due_date).slice(0, 10) : null;
  if (d && d < today) return "overdue";
  if (d && d === today) return "today";
  return "upcoming"; // includes no-due-date tasks
}
// Both halves are exposed so the BCBA dashboard bundle can mount the real Task
// Center. It is the same markup and the same filler -- not a copy that will
// drift the first time either is changed.
window.__taskCenterHtml = (o) => taskCenterHtml(o);
window.__fillTaskCenter = (mount) => fillTaskCenter(mount);

async function fillTaskCenter(mount) {
  const body = (mount || document).querySelector("#task-center-body");
  if (!body) return;
  try {
    _tcTasks = await api("/api/staff-tasks?scope=mine");
  } catch (e) {
    body.innerHTML = `<div class="empty-state">Couldn't load your tasks.</div>`;
    return;
  }
  const root = document.getElementById("task-center");
  if (root) {
    root.querySelectorAll("[data-tc]").forEach((tab) => {
      tab.onclick = () => {
        _tcFilter = tab.dataset.tc;
        root.querySelectorAll(".tc-tab").forEach((t) => t.classList.toggle("active", t === tab));
        _tcRenderList(body);
      };
    });
  }
  _tcUpdateCounts();
  _tcRenderList(body);
}
function _tcUpdateCounts() {
  const counts = { today: 0, upcoming: 0, overdue: 0 };
  _tcTasks.forEach((t) => { const b = _tcBucket(t); if (b in counts) counts[b]++; });
  document.querySelectorAll("[data-tc-n]").forEach((el) => {
    const k = el.dataset.tcN, n = counts[k] || 0;
    el.textContent = n ? String(n) : "";
    el.style.display = n ? "" : "none";
    el.classList.toggle("hot", k === "overdue" && n > 0);
  });
}
function _tcRenderList(body) {
  const rows = _tcTasks.filter((t) => _tcBucket(t) === _tcFilter);
  if (!rows.length) {
    const msg = _tcFilter === "completed" ? "No completed tasks yet." :
      _tcFilter === "overdue" ? "Nothing overdue — nice. " :
      _tcFilter === "today" ? "Nothing due today. You're clear. " : "Nothing coming up.";
    body.innerHTML = `<div class="empty-state">${msg}</div>`;
    return;
  }
  body.innerHTML = rows.map((t) => {
    const pr = TC_PRIORITY[(t.priority || "normal")] || TC_PRIORITY.normal;
    const overdue = _tcBucket(t) === "overdue";
    const due = t.due_date ? fmtDate(t.due_date) : "No due date";
    const done = t.status === "done";
    return `<div class="tc-row${overdue ? " overdue" : ""}">
      <button class="tc-check${done ? " done" : ""}" data-tc-complete="${t.id}" title="${done ? "Completed" : "Mark complete"}" ${done ? "disabled" : ""}>${done ? "✓" : ""}</button>
      <div class="tc-main">
        <div class="tc-title${done ? " done" : ""}">${staffEsc(t.title)}</div>
        <div class="tc-meta">
          <span class="tc-pill" style="background:${pr.bg}; color:${pr.fg};">${pr.label}</span>
          <span class="tc-due${overdue ? " overdue" : ""}">${overdue ? "⚠ " : ""}${staffEsc(due)}</span>
          ${t.child_name ? `<a href="#" class="tc-client" data-tc-client="${t.client_id}">${staffEsc(t.child_name)}</a>` : ""}
          ${t.reminder_sent_at ? `<span class="tc-reminded" title="A reminder was emailed to you">reminded</span>` : ""}
        </div>
        ${t.description ? `<div class="tc-desc">${staffEsc(t.description)}</div>` : ""}
        ${taskHistoryLine(t)}
      </div>
      ${done ? `<button class="btn small secondary" data-tc-reopen="${t.id}" title="Ticked by mistake? Put it back on your open list">Reopen</button>` : ""}
    </div>`;
  }).join("");
  body.querySelectorAll("[data-tc-complete]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      try {
        await api(`/api/staff-tasks/${btn.dataset.tcComplete}`, { method: "PATCH", body: { status: "done" } });
        const t = _tcTasks.find((x) => String(x.id) === String(btn.dataset.tcComplete));
        if (t) { t.status = "done"; t.completed_at = new Date().toISOString(); }
        _tcUpdateCounts();
        _tcRenderList(body);
        refreshTaskBadge();
      } catch (e) { btn.disabled = false; alert(e.message || "Could not complete the task."); }
    });
  });
  // Undo an accidental tick. The same task goes back on the open list -- it is
  // never re-created -- and keeps a note of having been completed and reopened.
  body.querySelectorAll("[data-tc-reopen]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      try {
        const updated = await api(`/api/staff-tasks/${btn.dataset.tcReopen}`, { method: "PATCH", body: { status: "open" } });
        const t = _tcTasks.find((x) => String(x.id) === String(btn.dataset.tcReopen));
        if (t) {
          t.status = "open";
          t.completed_at = null;
          t.last_completed_at = (updated && updated.last_completed_at) || t.last_completed_at;
          t.reopened_at = (updated && updated.reopened_at) || new Date().toISOString();
          t.reopened_by = (updated && updated.reopened_by) || (state.user && (state.user.name || state.user.email));
          t.reopen_count = (updated && updated.reopen_count) || (t.reopen_count || 0) + 1;
        }
        _tcUpdateCounts();
        _tcRenderList(body);
        refreshTaskBadge();
      } catch (e) { btn.disabled = false; alert(e.message || "Could not reopen the task."); }
    });
  });
  body.querySelectorAll("[data-tc-client]").forEach((a) => {
    a.addEventListener("click", (ev) => { ev.preventDefault(); openClientModal(a.dataset.tcClient); });
  });
}

// BCBA caseloads, straight from current client/BCBA assignments. Sorted
// heaviest first so the board is scannable, with the two numbers that change
// what the count means (in therapy now, waiting) shown underneath rather than
// folded into it.
function renderBcbaCaseloads(d) {
  const list = (d && d.bcbas) || [];
  if (!list.length) {
    return `<div class="empty-state">No BCBA is assigned to any client in the pipeline yet.${
      d && d.unassigned ? ` ${d.unassigned} client${d.unassigned === 1 ? " has" : "s have"} no BCBA assigned.` : ""
    }</div>`;
  }
  const max = Math.max(...list.map((b) => b.active_cases), 1);
  return `
    <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px;">
      ${list.map((b) => `
        <div style="border:1px solid var(--border,#e5e7eb); border-radius:10px; padding:11px 13px; min-width:0;">
          <div style="display:flex; align-items:baseline; justify-content:space-between; gap:10px;">
            <strong style="font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${ea(b.name)}">${ea(b.name)}</strong>
            <span style="font-size:20px; font-weight:800; color:var(--brand-navy,#1b2a6b); line-height:1;">${b.active_cases}</span>
          </div>
          <div style="background:#eef0f5; border-radius:999px; height:5px; margin:7px 0 6px;">
            <div style="width:${Math.round((b.active_cases / max) * 100)}%; background:#3f56b5; height:5px; border-radius:999px;"></div>
          </div>
          <div style="font-size:11.5px; color:var(--text-muted);">
            ${b.active_cases} active case${b.active_cases === 1 ? "" : "s"}${b.in_therapy ? ` · ${b.in_therapy} in therapy` : ""}${b.waitlisted ? ` · ${b.waitlisted} waitlisted` : ""}
          </div>
        </div>`).join("")}
    </div>
    <div style="font-size:11.5px; color:var(--text-muted); border-top:1px solid var(--border,#e5e7eb); padding-top:8px; margin-top:10px;">
      Counts clients in the live pipeline. Discharged and not-moving-forward clients are not counted.${
        d.unassigned ? ` <strong>${d.unassigned}</strong> pipeline client${d.unassigned === 1 ? " has" : "s have"} no BCBA assigned.` : ""
      }
    </div>`;
}

// Staff turnover, computed from real termination dates. Shown only to roles
// that are allowed it -- the server omits the whole key otherwise, so this
// never renders for anyone else.
function renderTurnover(t) {
  const gaps = [];
  if ((t.terminated_missing_date || []).length) {
    gaps.push(`${t.terminated_missing_date.length} terminated staff member${t.terminated_missing_date.length === 1 ? " has" : "s have"} no termination date on file and ${t.terminated_missing_date.length === 1 ? "is" : "are"} not counted — add the date on their profile.`);
  }
  if ((t.no_hire_date || []).length) {
    gaps.push(`${t.no_hire_date.length} current staff member${t.no_hire_date.length === 1 ? " has" : "s have"} no hire date, so ${t.no_hire_date.length === 1 ? "they are" : "they are"} left out of the headcount.`);
  }
  const byType = t.separations_by_type || {};
  const typeBits = ["voluntary", "involuntary", "unknown"]
    .filter((k) => byType[k])
    .map((k) => `${byType[k]} ${k}`)
    .join(" · ");
  return `
    <div class="stat-grid" style="margin-bottom:10px;">
      <div class="stat-card">
        <div class="label">Turnover — last ${t.window_months} months</div>
        <div class="value">${t.computable && t.rate_pct != null ? t.rate_pct + "%" : "—"}</div>
        ${t.computable ? "" : `<div style="font-size:11px; color:var(--text-muted); margin-top:2px;">Not enough staffing history yet</div>`}
      </div>
      <div class="stat-card">
        <div class="label">Separations</div>

// "Just completed" -- the same rows the evening digest will carry, visible any
// time without waiting for an email. Owner/admin only server-side; for anyone
// else the fetch 403s and the card removes itself rather than showing an error
// for something they were never meant to see.
async function fillCompletionsFeed(mount) {
  const box = mount.querySelector("#dash-completions");
  if (!box) return;
  let d;
  try { d = await api("/api/completions?limit=15"); }
  catch (e) {
    const card = box.closest(".card");
    if (card) card.remove();
    return;
  }
  const rows = d.completions || [];
  if (!rows.length) {
    box.innerHTML = `<div class="empty-state">Nothing finished yet today. Signed forms, submitted schedules and completed tasks land here.</div>`;
    return;
  }
  const esc = (s) => { const el = document.createElement("div"); el.textContent = s == null ? "" : String(s); return el.innerHTML; };
  const when = (iso) => {
    try {
      const dt = new Date(iso);
      const mins = Math.round((Date.now() - dt.getTime()) / 60000);
      if (mins < 1) return "just now";
      if (mins < 60) return mins + "m ago";
      const hrs = Math.round(mins / 60);
      if (hrs < 24) return hrs + "h ago";
      return dt.toLocaleDateString();
    } catch (e) { return ""; }
  };
  box.innerHTML = rows.map((r) => `<div class="task-row">
      <div class="info">
        <strong>${esc(r.title)}</strong>${r.subject ? ` — ${esc(r.subject)}` : ""}
        <div class="due">${esc(when(r.occurred_at))}${r.detail ? " · " + esc(r.detail) : ""}</div>
      </div>
      ${r.link ? `<a class="btn small secondary" href="${esc(r.link)}">Open</a>` : ""}
    </div>`).join("")
    + ((d.recipients || []).length
        // A digest with nowhere to go fails quietly every night, which is the
        // one failure mode that looks exactly like "nothing happened today".
        // Say it loudly rather than in grey footnote text.
        ? `<div style="font-size:12px; color:var(--text-muted); margin-top:10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
             <span>${d.pending_digest
               ? `${d.pending_digest} waiting for tonight's ${d.digest_hour}:00 summary email to ${esc(d.recipients.join(", "))}`
               : `Everything here has been emailed to ${esc(d.recipients.join(", "))}`}</span>
             ${d.pending_digest ? `<button class="btn small secondary" id="send-digest-now">Email me now</button>` : ""}
           </div>`
        : `<div style="margin-top:10px; background:#fffbeb; border:1px solid #fde68a; color:#92400e; border-radius:8px; padding:9px 11px; font-size:12.5px;">
             <strong>No one is getting the daily summary.</strong> This list still fills up, but nothing is emailed until you set an address under
             Admin Settings → Daily "what finished today" email.
           </div>`);
  const btn = box.querySelector("#send-digest-now");
  if (btn) {
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      btn.textContent = "Sending…";
      try {
        const r = await api("/api/completions/digest", { method: "POST" });
        btn.textContent = r.sent
          ? `Sent (${r.count})`
          : r.reason === "no_recipient" ? "No recipient set in Admin Settings" : "Couldn't send";
      } catch (e) { btn.textContent = e.message || "Couldn't send"; }
    });
  }
}

function renderInsuranceChart(rows) {
  if (!rows.length) return `<div class="empty-state">No active clients yet.</div>`;
  const palette = ["#1b2a6b", "#e0a430", "#5fa8a0", "#3f56b5", "#c98a1b", "#3f8f89", "#6f86e0", "#22c55e", "#ef4444", "#64748b"];
  const total = rows.reduce((s, r) => s + r.n, 0);
  const esc = (s) => { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; };
  const r = 62, cx = 80, cy = 80, sw = 26, C = 2 * Math.PI * r;
  let acc = 0;
  const arcs = rows.map((row, i) => {
    const frac = total ? row.n / total : 0;
    const dash = frac * C;
    const offset = -acc * C;
    acc += frac;
    const color = palette[i % palette.length];
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-dasharray="${dash.toFixed(2)} ${(C - dash).toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
  }).join("");
  const legend = rows.map((row, i) => {
    const share = total ? Math.round((row.n / total) * 100) : 0;
    const color = palette[i % palette.length];
    return `<div style="display:flex; align-items:center; gap:8px; font-size:12.5px; margin-bottom:7px;">
      <span style="width:11px; height:11px; border-radius:3px; background:${color}; flex:0 0 auto;"></span>
      <span style="flex:1;">${esc(row.provider)}</span>
      <strong>${row.n} <span style="color:var(--text-muted); font-weight:400;">(${share}%)</span></strong>
    </div>`;
  }).join("");
  return `<div style="display:flex; gap:24px; align-items:center; flex-wrap:wrap;">
    <div style="position:relative; width:160px; height:160px; flex:0 0 auto;">
      <svg viewBox="0 0 160 160" width="160" height="160">${arcs}</svg>
      <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none;">
        <div style="font-size:28px; font-weight:800; color:var(--brand-navy,#1b2a6b); line-height:1;">${total}</div>
        <div style="font-size:11px; color:var(--text-muted);">clients</div>
      </div>
    </div>
    <div style="flex:1; min-width:220px;">${legend}</div>
  </div>`;
}

// ---------------- Pipeline (Kanban) ----------------
// The five primary pipeline phases the board displays. Each phase groups one
// or more of the underlying `stage` keys (which are unchanged -- every task,
// email, reminder, due date and automation still keys off those raw stages).
// `entry` is the stage a card moves INTO when dropped onto that phase column.
// This is display + grouping only; it does not alter how `stage` is stored.
const PIPELINE_PHASES = [
  {
    key: "intake_eligibility",
    label: "Intake & Eligibility",
    color: "#3f56b5",
    stages: ["new_submission", "clinical_screener", "insurance_verification", "intake_packet"],
    entry: "new_submission",
  },
  { key: "assessment", label: "Assessment", color: "#1b2a6b", stages: ["assessment_scheduling"], entry: "assessment_scheduling" },
  { key: "authorization", label: "Authorization", color: "#c98a1b", stages: ["authorization"], entry: "authorization" },
  { key: "ready_to_start", label: "Ready to Start", color: "#e0a430", stages: ["first_day_scheduled"], entry: "first_day_scheduled" },
  { key: "active", label: "Active", color: "#22c55e", stages: ["active"], entry: "active" },
];

// Terminal states -- kept OFF the primary board and reached via the Discharged
// toggle, so the main pipeline reads cleanly.
const TERMINAL_COLUMNS = [
  { key: "discharged", label: "Discharged", color: "#64748b", stages: ["discharged"], entry: "discharged" },
  { key: "not_moving_forward", label: "Not Moving Forward", color: "#ef4444", stages: ["not_moving_forward"], entry: "not_moving_forward" },
];

// Stages a closed-out client can be restored into. Mirrors REACTIVATABLE_STAGES
// in server.js, which is the copy that is actually enforced -- this one only
// decides what the dropdown offers.
const REACTIVATABLE_STAGES = [
  "new_submission", "clinical_screener", "insurance_verification",
  "assessment_scheduling", "authorization", "first_day_scheduled",
];

function stageLabelOf(key) {
  const s = (state.stages || []).find((x) => x.key === key);
  return s ? s.label : key;
}

async function renderPipeline(mount) {
  const TERMINAL_KEYS = ["discharged", "not_moving_forward"];
  const waitlistCount = state.clients.filter((c) => c.waitlisted && !TERMINAL_KEYS.includes(c.stage)).length;
  const dischargedCount = state.clients.filter((c) => TERMINAL_KEYS.includes(c.stage)).length;
  const view = state.pipelineView || "active"; // "active" | "waitlist" | "discharged"
  const waitlistOnly = view === "waitlist";
  const columns = view === "discharged" ? TERMINAL_COLUMNS : PIPELINE_PHASES;

  mount.innerHTML = `
    <div class="page-header">
      <div><h1>Client Pipeline ${hint("Where every client sits: Intake & Eligibility → Assessment → Authorization → Ready to Start → Active. Click a card for full details and tasks, or drag it to move it to another phase.")}</h1></div>
      <button class="btn" id="new-client-btn">+ New Enrollment</button>
    </div>
    <div style="display:flex; gap:8px; margin-bottom:14px;">
      <button class="btn ${view === "active" ? "" : "secondary"} small" id="filter-all-btn">All clients</button>
      <button class="btn ${view === "waitlist" ? "" : "secondary"} small" id="filter-waitlist-btn">Waitlist (${waitlistCount})</button>
      <button class="btn ${view === "discharged" ? "" : "secondary"} small" id="filter-discharged-btn">Discharged (${dischargedCount})</button>
    </div>
    <div class="kanban" id="kanban"></div>
  `;
  // Null-safe: two views define this id, and a fast second nav click can
  // replace the mount between the innerHTML write above and this line.
  // Without the guard the rest of the render (staffing panel, click
  // handlers) was silently skipped.
  const newClientBtn = mount.querySelector("#new-client-btn") || document.getElementById("new-client-btn");
  if (newClientBtn) newClientBtn.addEventListener("click", openNewClientModal);
  document.getElementById("filter-all-btn").addEventListener("click", () => {
    state.pipelineView = "active";
    renderPipeline(mount);
  });
  document.getElementById("filter-waitlist-btn").addEventListener("click", () => {
    state.pipelineView = "waitlist";
    renderPipeline(mount);
  });
  document.getElementById("filter-discharged-btn").addEventListener("click", () => {
    state.pipelineView = "discharged";
    renderPipeline(mount);
  });

  const kanban = document.getElementById("kanban");

  kanban.innerHTML = columns
    .map((phase) => {
      const clients = state.clients.filter(
        (c) => phase.stages.includes(c.stage) && (!waitlistOnly || c.waitlisted)
      );
      const multi = phase.stages.length > 1;
      return `
      <div class="kanban-col" data-phase="${phase.key}">
        <div class="kanban-col-header">
          <div class="kanban-col-title"><span class="dot" style="background:${phase.color}"></span>${phase.label}</div>
          <span class="count-pill">${clients.length}</span>
        </div>
        ${clients
          .map(
            (c) => `<div class="client-card" draggable="true" style="border-left-color:${phase.color}" data-client="${c.id}">
              <div class="name">${c.child_name} ${c.waitlisted ? `<span class="tag" style="background:#fef3c7; color:#92400e;">Waitlist</span>` : ""}${c.intake_chasing_paused_at ? `<span class="tag" title="Automatic intake reminders are on hold for this family." style="background:#e5e7eb; color:#374151;">On hold</span>` : ""}</div>
              <div class="meta">${c.parent_name || "—"} · ${c.service_location || "—"}</div>
              <div class="tags">
                ${multi ? `<span class="tag" style="background:#eef2ff; color:#3f56b5;">${stageLabelOf(c.stage)}</span>` : ""}
                ${c.desired_schedule ? `<span class="tag">${c.desired_schedule}</span>` : ""}
                ${c.insurance_provider ? `<span class="tag">${c.insurance_provider.split(",")[0]}</span>` : ""}
              </div>
            </div>`
          )
          .join("") || `<div class="empty-state" style="padding:16px 4px;">Empty</div>`}
      </div>`;
    })
    .join("");

  let draggedClientId = null;

  kanban.querySelectorAll("[data-client]").forEach((el) => {
    el.addEventListener("click", () => {
      if (el.classList.contains("dragging")) return;
      openClientModal(el.dataset.client);
    });
    el.addEventListener("dragstart", (e) => {
      draggedClientId = el.dataset.client;
      el.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", el.dataset.client);
    });
    el.addEventListener("dragend", () => {
      el.classList.remove("dragging");
      draggedClientId = null;
    });
  });

  kanban.querySelectorAll(".kanban-col").forEach((col) => {
    col.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      col.classList.add("drag-over");
    });
    col.addEventListener("dragleave", () => {
      col.classList.remove("drag-over");
    });
    col.addEventListener("drop", async (e) => {
      e.preventDefault();
      col.classList.remove("drag-over");
      const clientId = e.dataTransfer.getData("text/plain") || draggedClientId;
      const targetPhase = columns.find((p) => p.key === col.dataset.phase);
      if (!clientId || !targetPhase) return;
      const client = state.clients.find((c) => String(c.id) === String(clientId));
      if (!client) return;
      // Already somewhere inside this phase -> no-op. This prevents a card
      // sitting in (e.g.) Insurance Verification from being reset back to the
      // phase's entry stage and re-firing that stage's milestone email.
      if (targetPhase.stages.includes(client.stage)) return;
      try {
        await api(`/api/clients/${clientId}/advance`, { method: "POST", body: { stage: targetPhase.entry } });
        await loadClients();
        route();
      } catch (err) {
        alert(err.message || "Could not move client.");
      }
    });
  });
}

}

// ---------------- Authorization helpers (client-side) ----------------
// "Approved" is what the milestone checklist has always tested for
// (server.js: __authorization_approved) but it was missing from this list, so
// the box could never be ticked. Selecting it now also emails the parent that
// they're approved and it's time to schedule a first day.
const AUTH_STATUS_OPTIONS = ["Active", "Renewal in Progress", "Pending", "Approved", "Expired", "Not Required"];

function daysUntilClient(dateStr) {
  if (!dateStr) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const exp = new Date(dateStr);
  if (isNaN(exp)) return null;
  exp.setHours(0, 0, 0, 0);
  return Math.round((exp - today) / 86400000);
}

// Treatment-plan deadline banner: due 14 calendar days after the in-person
// assessment. Green once submitted (reminders have stopped), amber inside 3
// days, red once overdue.
function treatmentPlanDeadlineHtml(client) {
  if (!client.treatment_plan_due_date) return "";
  if (client.treatment_plan_submitted_date) {
    return `<div style="margin-top:10px; padding:8px 12px; border-radius:10px; background:#e9f7ef; color:#166534; font-size:12.5px; font-weight:700;">✓ Treatment plan submitted ${fmtDate(client.treatment_plan_submitted_date)} — reminders stopped.</div>`;
  }
  const due = String(client.treatment_plan_due_date).slice(0, 10);
  const days = daysUntilClient(due);
  let bg = "#eff6ff", fg = "#1e40af", label = `${days} day(s) remaining`;
  if (days < 0) { bg = "#fdecec"; fg = "#a3282e"; label = `${Math.abs(days)} day(s) OVERDUE`; }
  else if (days <= 3) { bg = "#fef3e0"; fg = "#946213"; }
  return `<div style="margin-top:10px; padding:10px 12px; border-radius:10px; background:${bg}; color:${fg}; font-size:13px; font-weight:700;">
    Treatment plan due ${fmtDate(due)} — ${label}
    <div style="font-weight:500; font-size:12px; margin-top:2px; opacity:.9;">14 days after the in-person assessment. The assigned BCBA${client.assigned_bcba_name ? " (" + staffEsc(client.assigned_bcba_name) + ")" : ""} gets escalating reminders until it's submitted.</div>
  </div>`;
}

function authSectionHtml(client) {
  if (!canViewAuth()) return "";
  const days = daysUntilClient(client.auth_expiration_date);
  const daysLabel =
    client.auth_expiration_date == null
      ? "—"
      : days < 0
      ? `${Math.abs(days)} day(s) overdue`
      : `${days} day(s) remaining`;
  const editable = canEditAuth();

  // The status chip lets somebody see where authorization stands without
  // opening the longest block on the card.
  const authChip = client.authorization_status
    ? [client.authorization_status,

function wireAuthSection(backdrop, clientId) {
  const saveBtn = backdrop.querySelector("#auth-save-btn");
  if (!saveBtn) return;
  saveBtn.addEventListener("click", async () => {
    const body = {};
    if (canEditAuth()) {
      [
        "insurance_payer",
        "authorization_status",
        "auth_start_date",
        "auth_expiration_date",
        "treatment_plan_submitted_date",
        "authorization_approved_date",
        "assigned_bcba_name",
        "assigned_bcba_email",
        "assigned_billing_name",
        "assigned_billing_email",
        "auth_notes",
      ].forEach((f) => {
        const el = backdrop.querySelector(`#auth-${f}`);
        if (el) body[f] = el.value;
      });
    } else {
      const el = backdrop.querySelector("#auth-auth_notes");
      if (el) body.auth_notes = el.value;
    }
    const resultEl = backdrop.querySelector("#auth-save-result");
    try {
      const saved = await api(`/api/clients/${clientId}/authorization`, { method: "PATCH", body });
      // Say out loud when a save emailed a family, so it is never a surprise.
      resultEl.textContent = saved && saved.approval_email
        ? (saved.approval_email.sent
            ? `Saved ✓ — approval email sent to ${saved.approval_email.to}`
            : "Saved ✓ — approved, but no parent email on file so nothing was sent")
        : "Saved ✓";
      await loadClients();
    } catch (err) {
      resultEl.textContent = err.message || "Save failed";
    }
  });

  // Item 4: Authorization -> Scheduling. Confirms, then moves the client into
  // First Day Scheduling (notifies the scheduling team + creates their task).
  const moveBtn = backdrop.querySelector("#move-to-scheduling-btn");
  if (moveBtn) {
    moveBtn.addEventListener("click", async () => {
      if (!confirm("Move this client into First Day Scheduling?\n\nThis notifies the scheduling team and creates their scheduling task. The authorization you entered is preserved. You can't undo this from here.")) return;
      const resEl = backdrop.querySelector("#move-sched-result");
      moveBtn.disabled = true;
      resEl.textContent = "Moving…";
      try {
        await api(`/api/clients/${clientId}/move-to-scheduling`, { method: "POST" });
        resEl.textContent = "Moved to First Day Scheduling ✓";
        await loadClients();
        if (backdrop && backdrop.remove) backdrop.remove();
      } catch (err) {
        resEl.textContent = err.message || "Could not move to scheduling.";
        moveBtn.disabled = false;
      }
    });
  }
}

// A generic "preview this email, then send it" modal. Shows To / Subject and
// the rendered body in a sandboxed iframe, with Send / Cancel. onSend is an
// async callback that performs the actual send.
function openEmailPreviewModal({ title, to, subject, html, onSend }) {
  const bd = document.createElement("div");
  bd.className = "modal-backdrop";
  bd.innerHTML = `<div class="modal" style="max-width:640px;">
    <div class="modal-header">
      <div><h2 style="font-size:18px; margin:0;">${staffEsc(title)}</h2>
      <div style="font-size:12.5px; color:var(--text-muted);">To: ${staffEsc(to)}</div></div>
      <button class="close-btn">✕</button>
    </div>
    <div style="padding:2px 4px;">
      <div style="font-size:13px; margin:6px 0;"><strong>Subject:</strong> ${staffEsc(subject)}</div>
      <iframe sandbox="" style="width:100%; height:340px; border:1px solid var(--border,#e5e7eb); border-radius:10px; background:#fff;"></iframe>
      <div id="ep-err" style="color:#b91c1c; font-size:12.5px; margin-top:6px;"></div>
      <div style="display:flex; gap:10px; margin:12px 0;">
        <button class="btn" id="ep-send">Send email</button>
        <button class="btn secondary" id="ep-cancel">Cancel</button>
      </div>
    </div></div>`;
  document.body.appendChild(bd);
  bd.querySelector("iframe").srcdoc = html;
  const close = () => bd.remove();
  bd.querySelector(".close-btn").addEventListener("click", close);
  bd.querySelector("#ep-cancel").addEventListener("click", close);
  bd.addEventListener("click", (e) => { if (e.target === bd) close(); });
  bd.querySelector("#ep-send").addEventListener("click", async () => {
    const btn = bd.querySelector("#ep-send");
    btn.disabled = true; btn.textContent = "Sending…";
    try { await onSend(); close(); }
    catch (e) { bd.querySelector("#ep-err").textContent = e.message || "Send failed."; btn.disabled = false; btn.textContent = "Send email"; }
  });
}

// Asks what date the treatment plan actually went out for authorization.
// Resolves to "YYYY-MM-DD", or "" if the user chose to record no date, or
// null if they backed out entirely (in which case the task is left alone).
function askTreatmentPlanDate(client) {
  return new Promise((resolve) => {
    const today = new Date();
    const iso = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;
    const childName = (client && client.child_name) || "this client";
    const parentName = (client && client.parent_name) || "the parent";
    // null = we're on a screen that doesn't load the parent's contact details,
    // so don't claim either way whether an email will go out.
    const hasEmail = client && "parent_email" in client ? !!client.parent_email : null;
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = `
      <div class="modal" style="width:470px;">
        <div class="modal-header"><h2>Treatment plan submitted</h2><button class="close-btn">✕</button></div>
        <p style="font-size:13px; color:var(--text-muted); margin-top:0;">
          What date did ${staffEsc(childName)}'s treatment plan go out for authorization?
        </p>
        <div class="field">
          <label>Date submitted</label>
          <input type="date" id="tp-date" value="${iso}" max="${iso}" />
        </div>
        <div id="tp-warn" style="font-size:12px; color:#92400e; margin-top:6px; display:none;"></div>
        <div style="font-size:12.5px; color:var(--text-muted); margin-top:12px; background:#f8fafc; border-radius:8px; padding:10px 12px;">
          ${hasEmail === false
            ? `No parent email is on file, so nothing will be emailed. The date is still recorded.`
            : `${hasEmail ? staffEsc(parentName) : "The parent"} will be emailed to say the plan is with their insurance and that the clinical director will be in touch to schedule a first day. <strong>They are not told they're approved</strong> — that email goes out separately when you set the status to Approved.`}
        </div>
        <div style="display:flex; gap:8px; align-items:center; margin-top:16px;">
          <button class="btn" id="tp-confirm">Mark done</button>
          <button class="btn secondary" id="tp-cancel">Cancel</button>
        </div>
      </div>`;
    document.body.appendChild(backdrop);
    const finish = (value) => { backdrop.remove(); resolve(value); };
    backdrop.querySelector(".close-btn").addEventListener("click", () => finish(null));
    backdrop.querySelector("#tp-cancel").addEventListener("click", () => finish(null));
    backdrop.addEventListener("click", (e) => { if (e.target === backdrop) finish(null); });
    const input = backdrop.querySelector("#tp-date");
    const warn = backdrop.querySelector("#tp-warn");
    const check = () => {
      const v = input.value;
      if (v && v > iso) { warn.style.display = "block"; warn.textContent = "That date is in the future — did you mean an earlier day?"; }
      else warn.style.display = "none";
    };
    input.addEventListener("change", check);
    backdrop.querySelector("#tp-confirm").addEventListener("click", () => {
      const v = input.value;
      if (!v) { input.focus(); return; }
      finish(v);
    });
    input.focus();
  });
}

async function wireCaseNotes(backdrop, clientId) {
  const listEl = backdrop.querySelector("#case-notes-list");
  const input = backdrop.querySelector("#case-note-input");
  const addBtn = backdrop.querySelector("#add-case-note-btn");
  const statusEl = backdrop.querySelector("#case-note-status");
  if (!listEl || !addBtn) return;

  const esc = (s) => {
    const d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  };
  const fmtWhen = (iso) => {
    try {
      return new Date(iso).toLocaleString();
    } catch (e) {
      return iso || "";
    }
  };

  async function loadNotes() {
    let notes;
    try {
      notes = await api(`/api/clients/${clientId}/notes`);
    } catch (e) {
      listEl.innerHTML = `<div class="empty-state">Couldn't load notes: ${esc(e.message)}</div>`;
      return;
    }
    if (!notes.length) {
      listEl.innerHTML = `<div class="empty-state">No case notes yet.</div>`;
      return;
    }
    const myId = state.user && state.user.id;
    const canManage = state.user && ["owner", "admin", "super_admin"].includes(state.user.role);
    listEl.innerHTML = notes
      .map(
        (n) => `
        <div class="task-row" style="align-items:flex-start;">
          <div class="info" style="flex:1;">
            <div style="white-space:pre-wrap;">${esc(n.body)}</div>
            <div class="due">${esc(n.author_name || "Staff")} · ${fmtWhen(n.created_at)}</div>
          </div>
          ${
            String(n.author_id) === String(myId) || canManage
              ? `<button class="btn small secondary" data-del-note="${n.id}" style="color:#b91c1c;">Delete</button>`
              : ""
          }
        </div>`
      )
      .join("");
    listEl.querySelectorAll("[data-del-note]").forEach((b) => {
      b.addEventListener("click", async () => {
        if (!confirm("Delete this note?")) return;
        try {
          await api(`/api/clients/${clientId}/notes/${b.dataset.delNote}`, { method: "DELETE" });
          await loadNotes();
        } catch (e) {
          alert("Could not delete: " + e.message);
        }
      });
    });
  }

  addBtn.addEventListener("click", async () => {
    const text = (input.value || "").trim();
    if (!text) {
      statusEl.textContent = "Type a note first.";
      return;
    }
    addBtn.disabled = true;
    statusEl.textContent = "Saving…";
    try {
      await api(`/api/clients/${clientId}/notes`, { method: "POST", body: { body: text } });
      input.value = "";
      statusEl.textContent = "Added ✓";
      await loadNotes();
      setTimeout(() => (statusEl.textContent = ""), 1500);
    } catch (e) {
      statusEl.textContent = e.message;
    } finally {
      addBtn.disabled = false;
    }
  });

  await loadNotes();
}

async function wireScheduleRequest(backdrop, clientId, client) {
  const section = backdrop.querySelector("#schedule-req-section");
  if (!section) return;
  const esc = (s) => { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; };
  const fmtWhen = (iso) => { try { return new Date(iso).toLocaleString(); } catch (e) { return iso || ""; } };
  const DAYN = { 1: "Mon", 2: "Tue", 3: "Wed", 4: "Thu", 5: "Fri" };
  const hourLabel = (h) => { const ap = h < 12 ? "am" : "pm"; let hh = h % 12; if (hh === 0) hh = 12; return hh + ap; };

  async function load() {
    let reqs = [];
    try { reqs = await api(`/api/client-forms/schedule/${clientId}`); } catch (e) {}
    const pill = (s) => {
      const map = { sent: ["#fef3c7", "#92400e", "Sent"], viewed: ["#e0e7ff", "#3730a3", "Viewed"], submitted: ["#dcfce7", "#166534", "Submitted ✓"] };
      const m = map[s] || ["#eee", "#555", s];
      return `<span class="tag" style="background:${m[0]}; color:${m[1]};">${m[2]}</span>`;
    };
    const summary = (r) => {
      if (r.status !== "submitted" || !r.selected_slots) return "";
      let slots = [];
      try { slots = JSON.parse(r.selected_slots); } catch (e) { return ""; }
      const byDay = {};
      slots.forEach((s) => { const [d, h] = s.split("-").map(Number); (byDay[d] = byDay[d] || []).push(h); });
      const parts = Object.keys(byDay).sort().map((d) => `${DAYN[d]}: ${byDay[d].sort((a, b) => a - b).map(hourLabel).join(", ")}`);
      return `<div style="font-size:12px; color:var(--text-muted); margin-top:4px;">${r.total_hours} hrs/wk — ${parts.join(" · ")}</div>`;
    };
    const list = reqs.length
      ? reqs.map((r) => `<div class="task-row" style="align-items:flex-start;">
          <div class="info" style="flex:1;"><strong>Schedule request</strong> ${pill(r.status)}
            <div class="due">Sent ${fmtWhen(r.sent_at)}${r.status === "submitted" ? ` · submitted ${fmtWhen(r.submitted_at)}` : ""}</div>
            ${summary(r)}
          </div>
          <a class="btn small secondary" href="/schedule-request/?token=${encodeURIComponent(r.token)}" target="_blank" rel="noopener">Open</a>
        </div>`).join("")
      : `<div class="empty-state">No schedule request sent yet.</div>`;

    section.innerHTML = `${list}
      <div style="margin-top:8px;">
        <button class="btn small" id="send-sched-btn">${reqs.some((r) => r.status !== "submitted") ? "Re-send schedule form" : "Send schedule form"}</button>
        <span id="sched-status" style="font-size:12.5px; margin-left:8px; color:var(--text-muted);"></span>
        <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">Sent automatically once the clinical screener is completed. Parents pick Mon–Fri 8am–7pm (min 15 hrs, max 8/day).</div>
      </div>`;

    section.querySelector("#send-sched-btn").addEventListener("click", async () => {
      const btn = section.querySelector("#send-sched-btn");
      const statusEl = section.querySelector("#sched-status");
      btn.disabled = true;
      statusEl.textContent = "Sending…";
      try {
        const result = await api("/api/client-forms/schedule", { method: "POST", body: { client_id: clientId } });
        statusEl.textContent = result.emailed ? "Sent to parent ✓" : "Created ✓ (no parent email on file)";
        await load();
      } catch (e) {
        statusEl.textContent = e.message || "Could not send.";
        btn.disabled = false;
      }
    });
  }
  await load();
}

// "Documents Requested from Parent" -- the tokenized link that asks the family
// for the official autism diagnosis and both sides of the insurance card, and
// files what they send straight onto this record. Reuses the client-forms
// module that already owns every other parent-facing form.
async function renderDocRequestSection(backdrop, clientId) {
  const section = backdrop.querySelector("#doc-request-section");
  if (!section) return;
  const esc = (s) => { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; };
  const fmtWhen = (iso) => { try { return new Date(iso).toLocaleString(); } catch (e) { return iso || ""; } };

  let d;
  try { d = await api(`/api/client-forms/documents/${clientId}`); }
  catch (e) { section.innerHTML = `<div class="empty-state">Couldn't load: ${esc(e.message)}</div>`; return; }

  // Three short items that used to stack one per line down the card. They sit
  // across the row now and wrap on a narrow screen; each still shows the same
  // status, the same received-at line and the same View link.
  const itemRow = (it) => `<div style="border:1px solid var(--border,#e5e7eb); border-radius:10px; padding:9px 11px; min-width:0; display:flex; gap:8px; align-items:flex-start; justify-content:space-between;">
      <div style="min-width:0;">
        <div style="font-size:12.5px; font-weight:700;"><span class="status-dot ${it.received ? "completed" : "pending"}"></span>${esc(it.label)}</div>
        <div class="due" style="margin-top:2px;">${it.received ? `Received ${fmtWhen(it.received_at)}${it.filename ? ` · ${esc(it.filename)}` : ""}` : "Not received yet"}</div>
      </div>
      ${it.received && it.document_id
        ? `<a class="btn small secondary" href="/api/documents/${it.document_id}/download" target="_blank" rel="noopener">View</a>`
        : ""}
    </div>`;

  const outstanding = (d.items || []).filter((it) => !it.received).length;
  const header = !d.requested
    ? `<div style="font-size:13px; color:var(--text-muted); margin-bottom:8px;">Email the parent a private upload link for the official autism diagnosis and the front and back of the insurance card. Whatever they send lands on this record automatically — and the benefits check goes out to billing the moment the card arrives.</div>`
    : `<div style="font-size:13px; color:var(--text-muted); margin-bottom:8px;">
         Sent ${fmtWhen(d.sent_at)}${d.send_count > 1 ? ` · asked ${d.send_count} times` : ""}${d.viewed_at ? ` · opened ${fmtWhen(d.viewed_at)}` : " · not opened yet"}.
         ${d.status === "complete" ? `<span style="color:#166534; font-weight:700;">All documents received ✓</span>` : `${outstanding} still outstanding.`}
       </div>`;

  section.innerHTML = `
    ${header}
    <div class="opt-grid">${(d.items || []).map(itemRow).join("")}</div>
    <div style="margin-top:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
      <button class="btn small" id="doc-req-send"${d.status === "complete" ? " disabled" : ""}>${d.requested ? "✉ Resend request to parent" : "✉ Request documents from parent"}</button>
      ${d.link ? `<button class="btn small secondary" id="doc-req-copy">Copy parent link</button>` : ""}
      <span id="doc-req-status" style="font-size:12.5px; color:var(--text-muted);"></span>
    </div>
    ${d.link ? `<div id="doc-req-link" style="display:none; font-size:12px; margin-top:6px; background:#eef2ff; border:1px solid #c7d2fe; border-radius:8px; padding:8px 10px;"><code style="user-select:all;">${esc(d.link)}</code></div>` : ""}`;

  const statusEl = section.querySelector("#doc-req-status");
  const sendBtn = section.querySelector("#doc-req-send");
  if (sendBtn) sendBtn.addEventListener("click", async () => {
    sendBtn.disabled = true;
    statusEl.textContent = "Sending…";
    try {
      const r = await api("/api/client-forms/documents", { method: "POST", body: { client_id: clientId } });
      statusEl.textContent = `Sent to ${r.sent_to}${r.delivered === "simulated" ? " (simulated)" : ""} ✓`;
      setTimeout(() => renderDocRequestSection(backdrop, clientId), 1200);
    } catch (e) {
      sendBtn.disabled = false;
      statusEl.textContent = e.message || "Could not send.";
    }
  });
  const copyBtn = section.querySelector("#doc-req-copy");
  if (copyBtn) copyBtn.addEventListener("click", () => {
    const box = section.querySelector("#doc-req-link");
    if (box) box.style.display = "block";
    if (navigator.clipboard && d.link) navigator.clipboard.writeText(d.link).catch(() => {});
  });
}

// Attribute/text escaper so client values (names with quotes, &, <, etc.)
// can't break the input markup or the modal layout.
function ea(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}
// ---------------- Service location ----------------
// A client can be seen in more than one setting, so this is a set of choices
// rather than one. It stays in the single `service_location` TEXT column as a
// comma-separated list -- the map's classifier already reads a value naming
// several settings and reports them all, so nothing downstream had to change
// and no historical value had to be migrated.
const SERVICE_LOCATIONS = ["In-Clinic", "In Home", "In-School"];

// What is already stored is not necessarily one of the three. It is whatever
// was typed, imported or written before this was a multi-select: "In Home /
// In-School", "Telehealth", a note somebody left. So parsing reports BOTH --
// the settings it recognises, and the rest of the string verbatim -- and the
// editor keeps the remainder in a field of its own. Opening a client and
// pressing Save must not quietly delete something a person put there.
function parseServiceLocation(raw) {
  const flat = (v) => String(v).toLowerCase().replace(/[^a-z]/g, "");
  const parts = String(raw == null ? "" : raw).split(/[,/;|]+|\band\b/i).map((x) => x.trim()).filter(Boolean);
  const chosen = [], extra = [];
  parts.forEach((p) => {
    const hit = SERVICE_LOCATIONS.find((o) => flat(o) === flat(p));
    if (hit) { if (chosen.indexOf(hit) === -1) chosen.push(hit); }
    else extra.push(p);
  });
  return { chosen: chosen, extra: extra.join(", ") };
}

// Written back in the canonical order rather than the order the boxes were
// ticked, so the same set of settings always reads the same way.
function formatServiceLocation(chosen, extra) {
  const list = SERVICE_LOCATIONS.filter((o) => (chosen || []).indexOf(o) !== -1);
  const rest = String(extra == null ? "" : extra).trim();
  if (rest) list.push(rest);
  return list.join(", ");
}

// Does this stored value name that setting? Used for filtering, where a plain
// equality test would stop matching the moment a client is seen in two places.
function serviceLocationHas(raw, setting) {
  return parseServiceLocation(raw).chosen.indexOf(setting) !== -1;
}

// Exposed for pipeline-v2.js, which filters on the same field and must read it
// the same way. One parser, not two that agree until one is edited.
window.__serviceLocations = SERVICE_LOCATIONS;
window.__serviceLocationHas = serviceLocationHas;
window.__parseServiceLocation = parseServiceLocation;

function cdServiceLocation(current) {
  const parsed = parseServiceLocation(current);
  return (
    `<div id="cd-service_location">` +
      `<div class="opt-row">` +
        SERVICE_LOCATIONS.map((o) =>
          `<label><input type="checkbox" class="svc-opt" value="${ea(o)}"${parsed.chosen.indexOf(o) !== -1 ? " checked" : ""} /> ${ea(o)}</label>`
        ).join("") +
      `</div>` +
      // Only drawn when there IS something else on the record. There is no
      // reason to invite free text into a field with three settled answers --
      // this exists to hold on to what is already there.
      (parsed.extra
        ? `<label style="display:block; margin-top:6px; font-size:11.5px; color:var(--text-muted);">Also recorded
             <input class="svc-other" value="${ea(parsed.extra)}" style="margin-top:3px;" /></label>`
        : "") +
    `</div>`
  );
}

function readServiceLocation(box) {
  if (!box) return "";
  const chosen = Array.from(box.querySelectorAll("input.svc-opt")).filter((i) => i.checked).map((i) => i.value);
  const other = box.querySelector(".svc-other");
  return formatServiceLocation(chosen, other ? other.value : "");
}

function cdSelect(id, options, current) {
  return (
    `<select id="cd-${id}">` +
    options
      .map(
        (o) =>
          `<option ${String(o) === String(current || "") ? "selected" : ""}>${ea(o)}</option>`
      )
      .join("") +
    `</select>`
  );
}

// Whether the client-details section of the modal is currently in edit mode.
// Preserved across the modal re-render that toggling triggers, and reset to
// read-only whenever the modal is closed (see close() below).
let clientDetailsEditing = false;

// Core client details section of the modal. Read-only by default with an
// "Edit details" button; in edit mode it shows editable inputs plus Save /
// Cancel. Saving uses PATCH /api/clients/:id, whose allowed-fields list this
// mirrors.
// ---- client card: collapsible sections -------------------------------------
// Which sections a person left open, remembered per browser. Somebody who
// works the BIP every morning should not have to open it every morning.
const CS_OPEN_KEY = "ss.clientCard.open";
// A map of key -> true/false, NOT a list of open sections. The difference
// matters: with a list, a key that is absent is ambiguous between "they closed
// it" and "they have never touched it", so the first time anyone collapsed
// anything every other section would lose its default and slam shut.
function csPrefs() {
  try {
    const v = JSON.parse(localStorage.getItem(CS_OPEN_KEY) || "{}");
    return v && typeof v === "object" && !Array.isArray(v) ? v : {};
  } catch (e) { return {}; }
}
function csRemember(key, open) {
  try {
    const prefs = csPrefs();
    prefs[key] = !!open;
    localStorage.setItem(CS_OPEN_KEY, JSON.stringify(prefs));
  } catch (e) { /* private browsing: the card still works, it just forgets */ }
}

// One collapsible section. `chip` is [text, tone] and shows on the closed
// header, so the card can be read without opening anything.
// `defaultOpen` applies only until this person has an opinion about this
// section; after that their own choice wins.
//
// The second argument used to be a decorative emoji per section. The emoji are
// gone -- a client record is a clinical document and a row of does not
// belong on one -- and each header now carries a plain accent marker instead,
// so the sections still line up and scan the way they did. The argument is
// kept in the signature (and ignored) so every call site stays readable as a
// list of sections rather than needing a sweep of positional edits.
function cs(key, _legacyIcon, title, bodyHtml, { chip = null, defaultOpen = false } = {}) {
  const prefs = csPrefs();
  const open = Object.prototype.hasOwnProperty.call(prefs, key) ? !!prefs[key] : defaultOpen;
  const [chipText, chipTone] = chip || [];
  return `<details class="cs" data-cs="${key}"${open ? " open" : ""}>
    <summary><span class="cs-ico" aria-hidden="true"></span>${title}${
      chipText ? `<span class="cs-chip ${chipTone || "none"}">${chipText}</span>` : ""
    }</summary>
    <div class="cs-body">${bodyHtml}</div>
  </details>`;
}

// An explanation that no longer takes up a line. The words are unchanged --
// they are just on the icon now.
function hint(text) {
  const d = document.createElement("div");
  d.textContent = text == null ? "" : String(text);
  return `<span class="hint-badge" title="${d.innerHTML.replace(/"/g, "&quot;")}">i</span>`;
}

      try {
        const result = await api(`/api/clients/${id}/attendance-alert`, { method: "POST", body: { percentage: pct } });
        statusEl.textContent = result.delivered === "sent" ? "Sent ✓" : result.delivered === "simulated" ? "Simulated ✓" : "Failed";
        close();
        await loadClients();
        openClientModal(id);
      } catch (e) {
        statusEl.textContent = e.message || "Could not send.";
        attBtn.disabled = false;
      }
    });
  }
  backdrop.querySelectorAll("[data-ack-att]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      try {
        await api(`/api/notifications/${btn.dataset.ackAtt}/acknowledge`, { method: "POST" });
        close();
        await loadClients();
        openClientModal(id);
      } catch (e) {
        alert("Could not update: " + e.message);
      }
    });
  });
  // View the full body of any communication sent to the parent.
  const notifMap = Object.fromEntries((notifications || []).map((n) => [String(n.id), n]));
  backdrop.querySelectorAll("[data-view-cnotif]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const n = notifMap[btn.dataset.viewCnotif];
      if (!n) return;
      const bd = document.createElement("div");
      bd.className = "modal-backdrop";
      bd.innerHTML = `
        <div class="modal" style="width:680px; max-width:94vw;">
          <div class="modal-header"><h2 style="font-size:16px;">${adminEsc(n.subject)}</h2><button class="close-btn">✕</button></div>
          <div style="font-size:12.5px; color:var(--text-muted); margin-bottom:10px;">to <strong>${adminEsc(n.recipient || "—")}</strong> · ${adminEsc((n.type || "").replace(/_/g, " "))} · ${fmtDate(n.sent_at)}</div>
          <div style="border:1px solid var(--border,#e5e7eb); border-radius:10px; padding:14px; max-height:60vh; overflow:auto; background:#fff;">${n.body || "<em>(no body stored)</em>"}</div>
        </div>`;
      document.body.appendChild(bd);
      const c = () => bd.remove();
      bd.querySelector(".close-btn").addEventListener("click", c);
      bd.addEventListener("click", (e) => { if (e.target === bd) c(); });
    });
  });

  const saveAsmtBtn = backdrop.querySelector("#save-assessment-btn");
  if (saveAsmtBtn) {
    saveAsmtBtn.addEventListener("click", async () => {
      const statusEl = backdrop.querySelector("#assessment-status");
      const body = {
        in_clinic_assessment_date: backdrop.querySelector("#asmt-date").value || null,
        assessment_location: backdrop.querySelector("#asmt-loc").value || null,
      };
      backdrop.querySelectorAll("[data-asmt-done]").forEach((cb) => {
        body[cb.dataset.asmtDone + "_completed"] = cb.checked;
      });
      backdrop.querySelectorAll("[data-asmt-date]").forEach((inp) => {
        body[inp.dataset.asmtDate + "_date"] = inp.value || null;
      });
      saveAsmtBtn.disabled = true;
      statusEl.textContent = "Saving…";
      try {
        await api(`/api/clients/${id}`, { method: "PATCH", body });
        statusEl.textContent = "Saved ✓";
        setTimeout(() => (statusEl.textContent = ""), 1500);
      } catch (e) {
        statusEl.textContent = e.message || "Could not save.";
      } finally {
        saveAsmtBtn.disabled = false;
      }
    });
  }

  // Item 1: preview + send the post-assessment "next steps" email to the parent.
  const postAsmtBtn = backdrop.querySelector("#post-assessment-email-btn");
  if (postAsmtBtn) {
    postAsmtBtn.addEventListener("click", async () => {
      const statusEl = backdrop.querySelector("#assessment-status");
      statusEl.textContent = "Loading preview…";
      let preview;
      try {
        preview = await api(`/api/clients/${id}/preview-template`, { method: "POST", body: { key: "post_assessment_next_steps" } });
      } catch (e) { statusEl.textContent = e.message || "Could not build preview."; return; }
      statusEl.textContent = "";
      if (!preview.to) { alert("This client has no parent email on file, so this email can't be sent."); return; }
      openEmailPreviewModal({
        title: "Post-Assessment / Next Steps Email",
        to: preview.to,
        subject: preview.subject,
        html: preview.html,
        onSend: async () => {
          const r = await api(`/api/clients/${id}/send-template`, { method: "POST", body: { key: "post_assessment_next_steps" } });
          statusEl.textContent = `Sent to ${preview.to} ✓`;
          await loadClients();
          return r;
        },
      });
    });
  }

  const transportToggle = backdrop.querySelector("#cd-transportation");
  if (transportToggle) {
    transportToggle.addEventListener("change", () => {
      const wrap = backdrop.querySelector("#transport-notes-wrap");
      if (wrap) wrap.style.display = transportToggle.checked ? "" : "none";
    });
  }
  const saveTransportBtn = backdrop.querySelector("#save-transport-btn");
  if (saveTransportBtn) {
    saveTransportBtn.addEventListener("click", async () => {
      const statusEl = backdrop.querySelector("#transport-status");
      const notesEl = backdrop.querySelector("#cd-transportation_notes");
      const on = !!(transportToggle && transportToggle.checked);
      const body = {
        transportation_services: on,
        transportation_notes: on && notesEl ? (notesEl.value || null) : null,
      };
      saveTransportBtn.disabled = true;
      statusEl.textContent = "Saving…";
      try {
        await api(`/api/clients/${id}`, { method: "PATCH", body });
        statusEl.textContent = "Saved ✓";
        setTimeout(() => (statusEl.textContent = ""), 1500);
      } catch (e) {
        statusEl.textContent = e.message || "Could not save.";
      } finally {
        saveTransportBtn.disabled = false;
      }
    });
  }

  // Text Parent: record consent, then send a manual text. Consent is saved via

  const uploadBtn = backdrop.querySelector("#upload-doc-btn");
  if (uploadBtn) {
    uploadBtn.addEventListener("click", async () => {
      const fileInput = backdrop.querySelector("#doc-file-input");
      const labelInput = backdrop.querySelector("#doc-label-input");
      const statusEl = backdrop.querySelector("#upload-doc-status");
      const file = fileInput.files && fileInput.files[0];
      if (!file) { statusEl.textContent = "Choose a file first."; return; }
      if (file.size > 15 * 1024 * 1024) { statusEl.textContent = "File too large (15MB max)."; return; }
      uploadBtn.disabled = true;
      statusEl.textContent = "Uploading…";
      try {
        const dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        const base64 = String(dataUrl).split(",")[1];
        const cardBox = backdrop.querySelector("#doc-is-card");
        await api(`/api/clients/${id}/documents`, {
          method: "POST",
          body: {
            filename: file.name,
            mime_type: file.type || "application/octet-stream",
            label: labelInput.value.trim() || file.name,
            content_base64: base64,
            // Ticking the box is the only signal that survives a phone
            // filename like IMG_4821.jpg, and it is what lets the eligibility
            // check fire off this upload.
            is_insurance_card: !!(cardBox && cardBox.checked),
          },
        });
        close();
        await loadClients();
        openClientModal(id);
      } catch (e) {
        statusEl.textContent = e.message || "Upload failed.";
        uploadBtn.disabled = false;
      }
    });
  }

  backdrop.querySelectorAll("[data-del-doc]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm("Delete this document?")) return;
      try {
        await api(`/api/clients/${id}/documents/${btn.dataset.delDoc}`, { method: "DELETE" });
        close();
        await loadClients();
        openClientModal(id);
      } catch (e) {
        alert("Could not delete: " + e.message);
      }
    });
  });

  const eligBtn = backdrop.querySelector("#send-eligibility-btn");
  if (eligBtn) {
    eligBtn.addEventListener("click", async () => {
      const statusEl = backdrop.querySelector("#eligibility-status");
      eligBtn.disabled = true;
      statusEl.textContent = "Sending…";
      try {
        const result = await api(`/api/clients/${id}/eligibility-check`, { method: "POST" });
        statusEl.textContent =
          (result.delivered === "sent" ? "Sent ✓" : result.delivered === "simulated" ? "Simulated ✓" : "Failed") +
          (result.attachments ? ` (${result.attachments} attachment${result.attachments > 1 ? "s" : ""})` : " — no card on file yet");
      } catch (e) {
        statusEl.textContent = e.message || "Could not send.";
      } finally {
        eligBtn.disabled = false;
      }
    });
  }

  // Two buttons, two attributes. "Already done" deliberately does NOT reuse
  // data-complete-task: that selector is used elsewhere (and by tests) to mean
  // "the button that completes this task", and having it match two elements is
  // an ambiguity waiting to pick the wrong one.
  backdrop.querySelectorAll("[data-complete-task], [data-already-task]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const taskId = btn.dataset.completeTask || btn.dataset.alreadyTask;
      const isSilent = !!btn.dataset.alreadyTask;
      // Ticking the authorization task is the moment the treatment plan goes
      // to the payer, and the parent email quotes that date back to them --
      // so ask for it here rather than hoping someone fills it in later.
      const body = {};
      // "Already done" back-fills work that happened outside the CRM: it ticks
      // the task and moves the client on, but sends no parent email and no
      // department alert. Confirmed because the absence of an email is the kind
      // of thing nobody notices until a family says they were never told.
      if (isSilent) {
        if (!confirm("Mark this as already done?\n\nThe task is ticked and the client moves on as normal, but NO email is sent to the family or to staff for this step.")) return;
        body.silent = true;
      }
      if (btn.dataset.taskStage === "authorization") {
        const date = await askTreatmentPlanDate(client);
        if (date === null) return; // cancelled -- leave the task untouched
        if (date) body.treatment_plan_submitted_date = date;
      }
      await api(`/api/tasks/${taskId}/complete`, { method: "POST", body });
      close();
      await loadClients();
      openClientModal(id);
      route();
    });
  });

  // Un-ticking a task. Deliberately does not rewind the client's stage: the
  // stage change already fired its department alert and its parent email, and
  // walking those back would either re-send them or leave the record claiming
  // something that never un-happened. If the client has already moved past the
  // stage this task belongs to, say so rather than let it look like nothing
  // happened.
  backdrop.querySelectorAll("[data-reopen-task]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      const taskStage = btn.dataset.taskStage || "";
      try {
        await api(`/api/tasks/${btn.dataset.reopenTask}/reopen`, { method: "POST" });
      } catch (e) {
        btn.disabled = false;
        alert(e.message || "Could not undo that.");
        return;
      }
      const movedOn = taskStage && client.stage && taskStage !== client.stage;
      close();
      await loadClients();
      openClientModal(id);
      route();
      if (movedOn) {
        alert("Task reopened. " + client.child_name + " stays in their current stage — undoing a task doesn't move a client backwards. Use \u201cAdvance / Close Out\u201d if the stage itself is wrong.");
      }
    });
  });

  // Holding and releasing the automated intake chasers. Deliberately separate
  // from the waitlist: this changes nothing about where the family sits in the
  // pipeline and sends them nothing at all -- it only stops the CRM contacting
  // them about paperwork, and stops the deadline that would close them out.
  const chasingHoldBtn = backdrop.querySelector("#chasing-hold-btn");
  if (chasingHoldBtn) {
    chasingHoldBtn.addEventListener("click", async () => {
      const note = await askReason("Pause intake reminders", "Why (optional — visible to staff only, never sent to the family)");
      if (note === null) return; // cancelled
      if (!confirm(`Pause automatic intake reminders for ${client.child_name}?\n\n`
        + "• No more daily emails about the enrollment packet or the clinical screener\n"
        + "• The 7-day packet deadline stops, so they can't be closed out for not signing\n"
        + "• Nothing is sent, cancelled or changed in SignNow\n\n"
        + "You can resume from this card at any time.")) return;
      try {
        await api(`/api/clients/${id}/intake-chasing`, { method: "POST", body: { on_hold: true, note } });
        // Reopen the card rather than close()ing it: close() drops back to the
        // board, which would hide the notice they just created. Removing this
        // backdrop first matters -- openClientModal appends a new one and does
        // not clear the old, so re-opening over the top stacks two cards and
        // the buttons on the visible one stop responding.
        backdrop.remove();
        await loadClients();
        await openClientModal(id);
      } catch (e) {
        alert("Could not pause reminders: " + e.message);
      }
    });
  }

  const chasingResumeBtn = backdrop.querySelector("#chasing-resume-btn");
  if (chasingResumeBtn) {
    chasingResumeBtn.addEventListener("click", async () => {
      // If a stage or the waitlist would keep them paused anyway, say so before
      // the click rather than leaving somebody to wonder why nothing changed.
      const stillPaused = chasing.still_paused_without_hold
        ? "\n\nNote: reminders will still be paused after this — " + (chasing.automatic_reason || "")
        : "";
      if (!confirm(`Resume automatic intake reminders for ${client.child_name}?\n\n`
        + "The daily emails start again and the 7-day packet deadline restarts with the time they had left "
        + "when it was paused — not from zero." + stillPaused)) return;
      try {
        await api(`/api/clients/${id}/intake-chasing`, { method: "POST", body: { on_hold: false } });
        backdrop.remove();
        await loadClients();
        await openClientModal(id);
      } catch (e) {
        alert("Could not resume reminders: " + e.message);
      }
    });
  }

  const waitlistAddBtn = backdrop.querySelector("#waitlist-add-btn");
  if (waitlistAddBtn) {
    waitlistAddBtn.addEventListener("click", async () => {
      const reason = await askReason("Reason for waitlist (optional — visible to staff only, not sent to the family)");
      if (reason === null) return; // cancelled
      const emailNote = client.parent_email
        ? `\n\nAn automated "you're on the waitlist" email will be sent to ${client.parent_email}.`
        : "\n\nNote: no parent email is on file, so no email will be sent.";
      if (!confirm(`Place ${client.child_name} on the waitlist?\n\nAutomated reminders to the family stop, and the 7-day enrollment packet deadline pauses until you take them off.${emailNote}`)) return;
      try {
        await api(`/api/clients/${id}/waitlist`, { method: "POST", body: { waitlisted: true, reason } });
        close();
        await loadClients();
        route();
      } catch (e) {
        alert("Could not update waitlist: " + e.message);
      }
    });
  }
  const waitlistRemoveBtn = backdrop.querySelector("#waitlist-remove-btn");
  if (waitlistRemoveBtn) {
    waitlistRemoveBtn.addEventListener("click", async () => {
      const emailNote = client.parent_email
        ? `\n\nAn automated "a spot has opened" email will be sent to ${client.parent_email}.`
        : "\n\nNote: no parent email is on file, so no email will be sent.";
      if (!confirm(`Remove ${client.child_name} from the waitlist?${emailNote}`)) return;
      try {
        await api(`/api/clients/${id}/waitlist`, { method: "POST", body: { waitlisted: false } });
        close();
        await loadClients();
        route();
      } catch (e) {
        alert("Could not update waitlist: " + e.message);
      }
    });
  }

  // The advance / close-out trio is only rendered while a client is live; a
  // closed-out record shows the Reactivate panel in its place.
  const advanceBtn = backdrop.querySelector("#advance-btn");
  if (advanceBtn) advanceBtn.addEventListener("click", async () => {
    await api(`/api/clients/${id}/advance`, { method: "POST", body: {} });
    close();
    await loadClients();
    route();
  });
  const dischargeBtn = backdrop.querySelector("#discharge-btn");
  if (dischargeBtn) dischargeBtn.addEventListener("click", async () => {
    const reason = await askReason("Discharge reason");
    if (reason === null) return;
    await api(`/api/clients/${id}/discharge`, { method: "POST", body: { reason, stage: "discharged" } });
    close();
    await loadClients();
    route();
  });
  const notMovingBtn = backdrop.querySelector("#not-moving-btn");
  if (notMovingBtn) notMovingBtn.addEventListener("click", async () => {
    const reason = await askReason("Reason client is not moving forward");
    if (reason === null) return;
    await api(`/api/clients/${id}/discharge`, { method: "POST", body: { reason, stage: "not_moving_forward" } });
    close();
    await loadClients();
    route();
  });

  const reactivateBtn = backdrop.querySelector("#reactivate-btn");
  if (reactivateBtn) reactivateBtn.addEventListener("click", async () => {
    const stage = backdrop.querySelector("#reactivate-stage").value;
    const statusEl = backdrop.querySelector("#reactivate-status");
    const label = stageLabelOf(stage);
    if (!confirm(`Bring ${client.child_name} back into ${label}?\n\nTheir existing record is kept as-is — nothing is duplicated or deleted — and the note history will show they were previously ${client.stage === "not_moving_forward" ? "marked Not Moving Forward" : "discharged"}.`)) return;
    reactivateBtn.disabled = true;
    statusEl.textContent = "Reactivating…";
    try {
      const note = await askReason("Anything to record about bringing them back? (optional)");
      if (note === null) { reactivateBtn.disabled = false; statusEl.textContent = ""; return; }
      await api(`/api/clients/${id}/reactivate`, { method: "POST", body: { stage, note: note || null } });
      close();
      state.pipelineView = "active";
      await loadClients();
      route();
    } catch (e) {
      reactivateBtn.disabled = false;
      statusEl.textContent = e.message || "Could not reactivate.";
    }
  });
  backdrop.querySelector("#delete-lead-btn").addEventListener("click", async () => {
   const password = await askPassword(`This will permanently delete ${client.child_name}'s record, including all tasks, notes, documents, and notification history. Enter your own password to confirm.`);
    if (!password) return;
    try {
      await api(`/api/clients/${id}`, { method: "DELETE", body: { password } });
      close();
      await loadClients();
      route();
    } catch (e) {
      alert("Could not delete: " + e.message);
    }
  });


}

function dayName(n) {
  return ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][n] || n;
}
